<h1>喇叭診斷頁（暫時用，用完會刪）</h1>
<p class="note">請依序按下面的按鈕，每按一個就聽一下有沒有聲音，最後把整個畫面截圖給 Claude（包含最下面的紀錄）。測試前請先把手機音量調到中間以上。</p>
<div id="info"></div>
<button id="b0">測試 0：播一聲短短的「嗶」（確認這個頁面本身能出聲音）</button>
<button id="b1">測試 1：站上現在的做法（挑一個英文語音，唸 communication）</button>
<button id="b2">測試 2：不指定語音，只指定美式英文</button>
<button id="b3">測試 3：先把聲音模式設成「播放」再唸</button>
<button id="b4">測試 4：先播一小段無聲音檔再唸</button>
<button id="b5">測試 5：把上一次的唸法取消後，等 0.4 秒再唸</button>
<p class="note">下面是這支手機上的英文語音，每個按鈕唸一次 communication：</p>

var ss=window.speechSynthesis,keep=null,logEl=document.getElementById('log'),t0=Date.now();
function log(m){logEl.textContent+=((Date.now()-t0)/1000).toFixed(1)+'s  '+m+'\n';}
function info(){
  var vs=[];try{vs=ss.getVoices()||[]}catch(e){}
  var en=vs.filter(function(v){return /^en/i.test((v.lang||'').replace('_','-'))});
  document.getElementById('info').textContent=
   '瀏覽器：'+navigator.userAgent+'\n語音合成：'+(ss?'有':'沒有')+'\n全部語音：'+vs.length+' 個，英文語音：'+en.length+' 個\n'+
   'audioSession：'+(navigator.audioSession?'有（目前 '+navigator.audioSession.type+'）':'沒有')+'\n頁面是否安全環境：'+(window.isSecureContext?'是':'否');
  var box=document.getElementById('voices');
  if(box.getAttribute('data-n')!==String(en.length)){
    box.setAttribute('data-n',en.length);box.innerHTML='';
    en.slice(0,14).forEach(function(v,i){
      var b=document.createElement('button');
      b.textContent='語音 '+(i+1)+'：'+v.name+'（'+v.lang+(v.localService?'，本機':'，網路')+(v.default?'，預設':'')+'）';
      b.onclick=function(){say('communication',v)};box.appendChild(b);});
  }
  return en;
}
function pick(en){
  var best=null,sc0=0;
  en.forEach(function(v){var l=(v.lang||'').replace('_','-'),multi=/multilingual/i.test(v.name||''),sc=(l==='en-US'?2:1)+(multi?0:2);if(sc>sc0){best=v;sc0=sc}});
  return best;
}
function say(text,voice,wait){
  function go(){
    try{
      var u=new SpeechSynthesisUtterance(text);u.lang=(voice&&voice.lang)||'en-US';u.rate=.85;if(voice)u.voice=voice;
      u.onstart=function(){log('開始唸（onstart）')};u.onend=function(){log('唸完（onend）')};
      u.onerror=function(e){log('發生錯誤（onerror）：'+(e&&e.error))};
      keep=u;log('送出：'+text+'，語音：'+(voice?voice.name:'未指定'));ss.speak(u);
      setTimeout(function(){log('狀態 speaking='+ss.speaking+' pending='+ss.pending+' paused='+ss.paused)},400);
    }catch(e){log('例外：'+e)}
  }
  try{ss.cancel()}catch(e){}
  if(wait)setTimeout(go,wait);else go();
}
function play(src,loop){var a=new Audio(src);a.loop=!!loop;var p=a.play();if(p&&p.catch)p.catch(function(e){log('音檔播放失敗：'+e)});return a}
document.getElementById('b0').onclick=function(){log('播放嗶聲');play(BEEP)};
document.getElementById('b1').onclick=function(){var en=info();say('communication',pick(en))};
document.getElementById('b2').onclick=function(){say('communication',null)};
document.getElementById('b3').onclick=function(){
  try{if(navigator.audioSession){navigator.audioSession.type='playback';log('audioSession 已設為 '+navigator.audioSession.type)}else log('這個瀏覽器沒有 audioSession')}catch(e){log('設定失敗：'+e)}
  say('communication',pick(info()))};
document.getElementById('b4').onclick=function(){var a=play(SILENT);log('已播無聲音檔');say('communication',pick(info()))};
document.getElementById('b5').onclick=function(){say('communication',pick(info()),400)};
try{ss.addEventListener('voiceschanged',info)}catch(e){}
info();setTimeout(info,800);setTimeout(info,2500);
</script></body></html>
