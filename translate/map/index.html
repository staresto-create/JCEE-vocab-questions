<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中譯英題目地圖 · 依年度、主題、句型看歷屆題目｜學測中譯英</title>
<meta name="description" content="歷屆學測、指考與大學聯考的中譯英題目排成一張圖：一格一題，標出做過的題目和錯題本裡的題目；可以依句型、主題、句子結構、考別篩選，直接練習或列印成考卷。">
<link rel="canonical" href="https://staresto-create.github.io/JCEE-vocab-questions/translate/map/">
<meta property="og:type" content="article">
<meta property="og:title" content="中譯英題目地圖 · 依年度、主題、句型看歷屆題目｜學測中譯英">
<meta property="og:description" content="歷屆學測、指考與大學聯考的中譯英題目排成一張圖：一格一題，標出做過的題目和錯題本裡的題目；可以依句型、主題、句子結構、考別篩選，直接練習或列印成考卷。">
<meta property="og:url" content="https://staresto-create.github.io/JCEE-vocab-questions/translate/map/">
<meta property="og:site_name" content="學測中譯英">
<meta name="robots" content="index,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="../../progress.js"></script>
<script src="../../resume.js"></script>
<style>

:root{
  /*PALETTE*/--paper:#F4F4F4; --panel:#FAFAFA; --white:#FFFFFF; --ink:#222222; --muted:#5C5C5C; --rule:#E0E0E0; --rule-2:#CFCFCF; --edge:#858585; --track:#E8E8E8;
  --sel-wash:#EEF3F7; --dim-bg:#ECECEC; --dim-fg:#6B6B6B; --hatch:#EDEDED;/*END*/
  --acc:#3A6F93; --acc-2:#2E5F80; --ink-sel:#262626; --acc-wash:#E3EDF4; --bar:#4A83A8;
  --red:#AE3626; --red-2:#962B1E; --red-wash:#F6E4DF;
  --serif:'Noto Serif TC','Noto Serif CJK TC',serif; --sans:'Noto Sans TC','Noto Sans CJK TC',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
button,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[data-show="false"]{display:none !important}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px 0}
.num{font-variant-numeric:tabular-nums}
.only-m,.btn.only-m{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.link{color:var(--acc-2);font-weight:700;text-decoration:underline;text-underline-offset:3px}


/* 頁首 */
.head{padding:28px 0 20px}
.head h1{margin:0 0 8px;font-family:var(--serif);font-weight:900;font-size:44px;line-height:1.2;letter-spacing:.04em}
.lead{margin:0;font-size:16.5px;line-height:1.85;max-width:46em}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:1.5px solid var(--acc);border-radius:4px;background:transparent;color:var(--acc-2);font-weight:700;font-size:15.5px;line-height:1.3;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--acc-wash)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-2)}
.btn.strong{border-width:2px;border-color:var(--acc-2);background:var(--acc-wash);color:var(--acc-2)}
.btn.strong:hover{background:#D3E2EC}
.btn.ink{border-color:var(--ink);color:var(--ink);background:var(--white)}
.btn.ink:hover{background:var(--sel-wash)}
.btn.primary[data-quiet="true"]{background:transparent;color:var(--acc-2)}
.btn[aria-disabled="true"],.btn.primary[aria-disabled="true"]{border-color:var(--edge);border-style:dashed;background:transparent;color:var(--dim-fg);cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}

/* 繼續上次的練習 */
.resume{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 24px;margin:0 0 20px;padding:12px 16px 12px 20px;background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--acc);border-radius:0 6px 6px 0}
.resume h2{margin:0;font-family:var(--serif);font-weight:900;font-size:18px;white-space:nowrap}
.resume p{margin:0;font-size:15.5px;line-height:1.6}
.resume .zh{display:block;color:var(--muted);font-size:14.5px}
.resume .btn{min-width:170px}

/* 版面：左側選題欄＋右側地圖 */
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding:0 6px 16px 0;scrollbar-width:thin}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 6px;border-bottom:1.5px solid var(--ink)}
.side-top h2{margin:0;font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.04em}
.side-x{display:none}
.conds{padding:10px 0 12px;border-bottom:1px solid var(--rule)}
.conds-l{margin:0 0 6px;font-size:13.5px;font-weight:700;color:var(--muted)}
.cond-list{display:flex;flex-wrap:wrap;gap:6px}
.cond{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 4px 0 10px;border:1.5px solid var(--ink);border-radius:4px;background:var(--white);font-size:14px;line-height:1.35;text-align:left}
.cond i{font-style:normal;font-size:12px;color:var(--muted);flex:none;white-space:nowrap}
.cond .x{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper);font-size:15px}
.cond:hover .x{background:var(--rule)}
.clear{min-height:36px;padding:0 8px;border:0;background:transparent;color:var(--ink);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.none{margin:0;font-size:14px;line-height:1.7;color:var(--muted)}
.andor{margin:8px 0 0;font-size:13px;line-height:1.65;color:var(--muted)}
.fs{padding:14px 0 14px;border-bottom:1px solid var(--rule)}
.fs h3{margin:0 0 2px;font-family:var(--serif);font-weight:900;font-size:17px;line-height:1.4}
.fs .desc{margin:0 0 8px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.fs .desc b{color:var(--ink)}
.small{margin:8px 0 0;font-size:13px;line-height:1.65;color:var(--muted)}
.lh{display:flex;justify-content:space-between;margin:0;padding:0 4px 2px;font-size:12px;color:var(--muted)}
.acc{border-top:1.5px solid var(--ink)}
.acc-h{display:grid;grid-template-columns:1.3em minmax(0,1fr) auto 12px;align-items:center;gap:8px;width:100%;min-height:52px;padding:6px 4px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left}
.acc-h:hover{background:var(--panel)}
.acc-k{font-family:var(--serif);font-weight:900;font-size:18px;color:var(--acc-2)}
.acc-n{font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.35}
.acc-n small{display:block;font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--muted)}
.acc-n em{font-style:normal;color:var(--ink);font-weight:700}
.cnt{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cnt b{color:var(--ink);font-weight:700}
.cnt{display:inline-flex;flex-direction:column;align-items:flex-end;gap:3px}
.bar{display:block;width:44px;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:2px}
.chev{width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
.acc-h[aria-expanded="true"] .chev{transform:rotate(-135deg);margin-top:4px}
.acc-p{padding:2px 0 8px;border-bottom:1px solid var(--rule);background:var(--panel)}
.row{display:grid;grid-template-columns:18px 2.4em minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;min-height:44px;padding:5px 4px;border:0;border-bottom:1px dotted var(--rule-2);background:transparent;text-align:left;font-size:14px;line-height:1.4}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sel-wash)}
.row.t{grid-template-columns:18px minmax(0,1fr) auto;border-bottom:1px solid var(--rule)}
.code{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.box{position:relative;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:3px;background:var(--white)}
.row[aria-pressed="true"]{background:var(--sel-wash)}
.row[aria-pressed="true"] .nm{font-weight:700}
.row[aria-pressed="true"] .box,.tw[aria-pressed="true"] .box{background:var(--ink-sel);border-color:var(--ink-sel)}
.row[aria-pressed="true"] .box::after,.tw[aria-pressed="true"] .box::after{content:"";position:absolute;left:4.5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 12px;border:1.5px solid var(--edge);border-radius:20px;background:var(--white);font-size:14px;line-height:1.3}
.chip .c{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink-sel);border-color:var(--ink-sel);color:#fff}
.chip[aria-pressed="true"] .c{color:#DCE8F0}
.chip[aria-disabled="true"]{color:var(--dim-fg);border-style:dashed;background:transparent;cursor:not-allowed}
.chip[aria-disabled="true"]:hover{border-color:var(--edge)}
.tw{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;min-height:48px;padding:6px 10px;border:1.5px solid var(--edge);border-radius:4px;background:var(--white);text-align:left;font-size:14.5px;font-weight:700;line-height:1.4}
.tw:hover{border-color:var(--ink)}
.tw[aria-pressed="true"]{background:var(--sel-wash);border-color:var(--ink-sel)}
.tw[aria-disabled="true"]{color:var(--dim-fg);border-style:dashed;cursor:not-allowed}
.side-foot{display:none}

/* 地圖欄 */
.mapcol{position:relative;padding:0 20px 20px;background:var(--panel);border:1px solid var(--rule);border-radius:6px}
.result{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin:0 -20px;padding:12px 20px;background:var(--panel);border-bottom:1.5px solid var(--ink);border-radius:6px 6px 0 0}
.res-n{margin:0;font-size:15px;color:var(--muted);line-height:1.4}
.res-n b{font-family:var(--serif);font-weight:900;font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:10px}
.res-n span{display:inline-block}
.pickbtn{display:none}
.maphead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding:14px 0 2px}
.maphead h2{margin:0;font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.03em}
.mtool{display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden}
.seg button{min-height:40px;min-width:84px;padding:0 14px;border:0;border-left:1.5px solid var(--ink);background:var(--white);font-weight:700;font-size:15px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink-sel);color:#fff}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink)}
.legend li{display:flex;align-items:center;gap:8px}
.legend .tile{width:34px;height:26px;font-size:0;pointer-events:none}
.legend .tile[data-s="done"]::after{top:1px;right:3px}
.legend .num{color:var(--muted)}
.mapnote{margin:6px 0 0;font-size:13.5px;line-height:1.7;color:var(--muted);max-width:52em}
.mapnote b{color:var(--ink)}
.foot-notes{margin-top:20px;padding-top:10px;border-top:1px solid var(--rule)}
.viewnote{margin:0;font-size:13.5px;line-height:1.7;color:var(--muted)}
.zerobox{margin:18px 0 8px;padding:16px 18px;border:1.5px solid var(--ink);border-left:5px solid var(--red);border-radius:4px;background:var(--white);font-size:15.5px;line-height:1.7}
.zerobox p{margin:0 0 10px}
.zerobox b{color:var(--red-2)}
.skip{position:absolute;left:-9999px}
.skip:focus{position:static;display:inline-flex;margin:8px 0}

.per{margin-top:16px}
.per-h{display:flex;align-items:baseline;gap:12px;margin:0 0 8px;padding:4px 0 4px 10px;border-left:3px solid var(--ink);font-size:13px;color:var(--muted)}
.per-h b{font-family:var(--serif);font-weight:900;font-size:16px;color:var(--ink);letter-spacing:.03em}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
.grp{min-width:0}
.grp[data-span="2"]{grid-column:span 2}
.grp[data-span="3"]{grid-column:1 / -1}
.gh{display:flex;align-items:baseline;gap:8px;margin:0 0 4px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.gh b{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--ink)}
.gh .gm{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,52px);gap:4px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:40px;padding:0 2px;border:1.5px solid var(--edge);border-radius:3px;background:var(--white);color:var(--ink);font-size:13px;line-height:1.15;white-space:nowrap}
.tile .ty{display:none;font-family:var(--serif);font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
.groups[data-view="topic"] .tile,.groups[data-view="pattern"] .tile{height:46px}
.groups[data-view="topic"] .tile .ty,.groups[data-view="pattern"] .tile .ty{display:block}
.groups[data-view="topic"] .tile .tn,.groups[data-view="pattern"] .tile .tn{font-size:11.5px}
.tile[data-s="done"]{background:var(--acc);border-color:var(--acc-2);color:#fff;padding-right:9px}
.tile[data-s="done"]::after{content:"✓";position:absolute;top:1px;right:3px;font-size:10px;font-weight:700;line-height:1.3}
.tile[data-s="wrong"]{background:var(--red-wash);border:2px solid var(--red);color:var(--red-2);font-weight:700;padding-right:10px}
.tile[data-s="wrong"]::after{content:"!";position:absolute;top:-2px;right:-2px;width:13px;height:14px;border-radius:0 2px 0 3px;background:var(--red);color:#fff;font-size:11px;font-weight:900;line-height:14px;text-align:center}
.tile[data-dim="true"][data-s="wrong"]::after{background:transparent;color:var(--dim-fg)}
.tile:hover{border-color:var(--ink)}
.tile[data-s="done"]:hover{border-color:var(--ink)}
.tile[data-open="true"]{outline:3px solid var(--ink);outline-offset:2px;z-index:1}
.groups[data-filtering="true"] .tile[data-s="todo"][data-dim="false"]{border:2px solid var(--ink)}
.groups[data-filtering="true"] .tile[data-dim="false"]{box-shadow:0 2px 0 var(--ink)}
.tile[data-dim="true"],.tile[data-dim="true"]:hover{background:var(--dim-bg);border:1px solid var(--rule-2);color:var(--dim-fg);font-weight:400;box-shadow:none;cursor:default}
.tile[data-dim="true"]::after{color:var(--dim-fg)}
.hidden-note{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:18px 0 0;padding:10px 0 0;border-top:1px dashed var(--rule-2);font-size:14px;color:var(--muted)}
.hidden-note .clear{min-height:44px}
.nodiff{margin:6px 0 0;font-size:13.5px;line-height:1.7;color:var(--muted)}

/* 題目預覽：固定在地圖欄底部，不推動格子 */
.peek{position:sticky;bottom:16px;z-index:6;width:min(480px,100%);margin:16px 0 0 auto;padding:16px 18px;border:1.5px solid var(--ink);border-radius:6px;background:var(--white);box-shadow:0 14px 32px -14px rgba(34,31,26,.55)}
.peek-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.peek-src{margin:0;font-family:var(--serif);font-weight:900;font-size:16.5px;line-height:1.45}
.peek-tag{display:inline-block;margin-top:4px;padding:1px 8px;border:1px solid var(--edge);border-radius:3px;font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--muted)}
.peek-tag[data-s="done"]{border-color:var(--acc-2);background:var(--acc-wash);color:var(--acc-2)}
.peek-tag[data-s="wrong"]{border-color:var(--red);background:var(--red-wash);color:var(--red-2)}
.peek-x{flex:none;display:grid;place-items:center;width:44px;height:44px;margin:-8px -10px 0 0;border:0;border-radius:50%;background:transparent;font-size:22px;line-height:1}
.peek-x:hover{background:var(--paper)}
.peek-zh{margin:8px 0 0;font-size:16.5px;line-height:1.75;max-height:9em;overflow:auto}
.peek-meta{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
.peek-meta span{display:block}
.peek .btns{margin-top:12px;align-items:center}
.peek-note{margin:8px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted)}

/* 下方區塊 */
.lower{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0 44px;margin-top:44px}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 44px;margin-top:8px}
.sec{padding:24px 0 32px;border-top:1.5px solid var(--ink)}
.sec h3{margin:0 0 6px;font-family:var(--serif);font-weight:900;font-size:21px;line-height:1.4}
.sec h4{margin:0 0 4px;font-family:var(--serif);font-weight:900;font-size:17px;line-height:1.4}
.sec .desc{margin:0 0 14px;font-size:15px;line-height:1.8;color:var(--muted)}
.sec .desc b{color:var(--ink)}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.picked{margin:14px 0 0;padding:14px 16px;background:var(--white);border:1px solid var(--rule);border-left:4px solid var(--acc);border-radius:0 4px 4px 0;font-size:15px;line-height:1.7}
.picked h4{margin:0 0 6px}
.picked ol{margin:0 0 12px;padding-left:1.4em}
.picked li{margin:0 0 4px}
.wl{margin:0 0 14px;padding:0;list-style:none;border-top:1px solid var(--rule)}
.wl li{padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px;line-height:1.55}
.wl .s{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.wl .s span{flex:none;font-weight:400;font-size:13.5px;color:var(--muted)}
.wl .s span[data-late="true"]{color:var(--red-2);font-weight:700}
.wl .z{display:block;color:var(--muted);font-size:14px}
.lst-h{margin:20px 0 6px !important}
.back{margin:20px 0 0;padding:14px 16px;border-left:3px solid var(--red);background:var(--white);border-radius:0 4px 4px 0}
.back p{margin:0 0 10px;font-size:14.5px;line-height:1.7;color:var(--ink)}
.empty{margin:0 0 14px;padding:12px 14px;background:var(--white);border:1px solid var(--rule);border-radius:4px;font-size:14.5px;line-height:1.7;color:var(--muted)}
.more{font-size:14px;color:var(--muted);margin:-6px 0 12px}
.tools .btn{min-width:220px}
.ta{display:block;width:100%;min-height:120px;margin:6px 0 10px;padding:10px 12px;border:1.5px solid var(--edge);border-radius:4px;background:var(--white);font-size:14px;line-height:1.6;resize:vertical}
.ta:focus-visible{border-color:var(--ink)}
.ta[aria-invalid="true"]{border:2px solid var(--red)}
.bk-l{display:block;margin-top:14px;font-size:14px;font-weight:700}
.bk-err{margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--red);background:var(--red-wash);font-size:14px;line-height:1.65;color:var(--red-2);font-weight:700}
.bk-ask{margin:0 0 10px;padding:12px 14px;border:1.5px solid var(--ink);border-radius:4px;background:var(--white);font-size:14.5px;line-height:1.7}
.bk-ask p{margin:0 0 10px}
.bk-hint{margin:0 0 10px;font-size:13px;line-height:1.6;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;margin-top:12px;padding:16px 0 40px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
.foot a{color:var(--muted)}
.sig{letter-spacing:.06em}

/* 提示列 */
.toast{position:fixed;left:24px;bottom:24px;z-index:30;display:flex;align-items:center;gap:14px;width:min(540px,calc(100% - 32px));padding:10px 10px 10px 18px;border-radius:6px;background:var(--ink);color:var(--paper);font-size:15px;line-height:1.6;box-shadow:0 10px 30px -12px rgba(34,31,26,.6)}

.scrim{display:none}

@media (max-width:1240px){
  .groups{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grp[data-span="2"]{grid-column:1 / -1}
}
@media (max-width:1000px){
  .layout{grid-template-columns:240px minmax(0,1fr);gap:20px}
  .lower{grid-template-columns:1fr}
  .tools{grid-template-columns:1fr}
}

  .only-d,.btn.only-d{display:none}
  .wrap{padding:0 16px}
  .head{padding:18px 0 14px}
  .head h1{font-size:30px}
  .lead{font-size:15.5px;line-height:1.8}
  .resume{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;margin-bottom:12px}

  .resume p{font-size:14px;line-height:1.5}
  .resume .zh{display:none}
  .resume .btn{min-width:0;min-height:44px;padding:0 12px;font-size:14.5px}
  .layout{display:block}
  /* 選題欄變成底部抽屜 */
  .side{display:none;position:fixed;left:0;right:0;bottom:0;top:6vh;z-index:40;max-height:none;padding:0 16px;background:var(--paper);border-radius:14px 14px 0 0;box-shadow:0 -12px 40px -10px rgba(34,31,26,.5);overflow:auto;overscroll-behavior:contain}
  .side[data-open="true"]{display:block}
  .side-top{position:sticky;top:0;z-index:2;margin:0 -16px;padding:10px 8px 8px 16px;background:var(--paper)}

  .side-foot{display:flex;position:sticky;bottom:0;z-index:2;align-items:center;gap:12px;margin:0 -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1.5px solid var(--ink)}
  .side-foot p{flex:1;margin:0;font-size:13.5px;line-height:1.4;color:var(--muted)}
  .side-foot p b{display:block;font-family:var(--serif);font-weight:900;font-size:19px;color:var(--ink)}
  .side-foot .btn{min-height:48px}
  .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(34,31,26,.45);border:0;padding:0}
  .row,.acc-h{min-height:48px}
  .chip{min-height:44px}
  .mapcol{display:flex;flex-direction:column;margin:0 -16px;padding:0 12px 0;border-radius:0;border-left:0;border-right:0}
  .maphead{position:sticky;top:0;z-index:5;order:1;display:block;margin:0 -12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--rule)}
  .maphead h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .pickbtn{display:inline-flex;flex:none;padding:0 12px;min-height:44px;border-color:var(--ink);color:var(--ink);background:var(--white)}
  .pickbtn:hover{background:var(--sel-wash)}
  .seg{flex:1;min-width:0}
  .seg button{flex:1;min-width:0;min-height:44px;padding:0 4px;font-size:14.5px}
  .mapinfo{order:3}
  .legend{gap:4px 14px;font-size:13.5px}
  .mapbody{order:4}
  .foot-notes{order:5;margin-bottom:16px}
  .peek{order:6;position:sticky;bottom:0;width:auto;margin:12px -12px 0;border-width:1.5px 0 0;border-radius:12px 12px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}

  .tools .btn{min-width:0;width:100%}
  .toast{left:16px;bottom:88px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}

/* 正式版補充：頁首導覽、讀不到紀錄的說明、載入狀態、頁尾、深色模式、列印 */
.crumb{margin:0;padding:14px 0 0;font-size:14px;line-height:1.6;color:var(--muted)}
.crumb a{color:var(--acc-2);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.unitbar a,.unitbar .cur{display:inline-block;border:1px solid var(--rule-2);border-radius:14px;padding:3px 11px;white-space:nowrap;font-weight:700;text-decoration:none}

.foot{align-items:flex-start}

.foot .fl a + a::before{content:"·";display:inline-block;padding:0 10px;color:var(--muted);text-decoration:none}

.heading-target:focus{outline:none}
[tabindex="-1"]:focus{outline:none}
.toast[data-show="false"]{display:none}

@media screen and (prefers-color-scheme:dark){
  :root{
    --paper:#18191B; --panel:#1F2123; --white:#26292C; --ink:#E6E6E6; --muted:#ABABAB; --rule:#383B3F; --rule-2:#4A4E53; --edge:#80858B; --track:#383B3F;
    --sel-wash:#22303A; --dim-bg:#232528; --dim-fg:#8E8E8E; --hatch:#26282B;
    --acc:#3D78A0; --acc-2:#9CC7E6; --ink-sel:#E6E6E6; --acc-wash:#1E3240; --bar:#6FA6CC;
    --red:#D2614F; --red-2:#F3A497; --red-wash:#3A2421;
    color-scheme:dark;
  }
  .btn.primary{color:#fff}
  .btn.primary:hover{background:#346A8F;border-color:#346A8F}

  .tile[data-dim="true"][data-s="wrong"]::after{color:var(--dim-fg)}
  .toast{background:#E6E6E6;color:#18191B}
  .toast button{border-color:#6B6B6B;color:#18191B}
  .peek{box-shadow:0 14px 32px -14px rgba(0,0,0,.9)}
}

@media print{
  body{background:#fff;color:#000}
  .unitbar,.crumb,.storenote,.resume,.side,.scrim,.result .btns,.pickbtn,.seg,.peek,.skip,.hidden-note .clear,.lower,.tools,.toast,.zerobox .btn{display:none !important}
  .layout{display:block}
  .mapcol{border:0;padding:0;background:#fff}
  .result{position:static;margin:0;padding:0 0 8px;background:#fff}
  .maphead{position:static}
  .grp{break-inside:avoid}
  .tile[data-s="done"]{background:#fff !important;color:#000 !important;border:2px solid #000 !important}
  .tile[data-s="done"]::after{color:#000 !important}
  .tile[data-s="wrong"]{background:#fff !important;color:#000 !important;border:2px dashed #000 !important}
  .tile[data-s="wrong"]::after{background:#000 !important;color:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<div class="wrap" id="app">

<script>
/* 中譯英題目地圖（2026-11-07）

(function () {
  'use strict';

  var examOf = function (l) { return l === '學測' ? 'G' : l === '大學聯考' ? 'J' : (l === '指考' || l === '指考補考' || l === '指考補救考試') ? 'A' : 'O'; };
  var EXAMS = [['G', '學測'], ['A', '指考（含補考、補救考試）'], ['J', '大學聯考'], ['O', '研究用試卷、試辦考試']];
  var STRUCTS = ['簡單句', '複句', '合句', '合複句', '其他（片段、多句）'];
  var PROG = [['todo', '還沒做'], ['done', '做過，不在錯題本'], ['wrong', '在錯題本裡']];
  var SN = { todo: '還沒做', done: '做過，不在錯題本', wrong: '在錯題本裡' };
  var GROUPS = [['A', '動詞後面接什麼'], ['B', '分詞'], ['C', '連接詞與銜接詞'], ['D', '子句與倒裝'], ['E', '比較'], ['F', '時態、語態與同位語']];
  /* 主題順序和中譯英題庫首頁的固定順序一致 */
  var TOPICS = ['家庭與日常生活', '校園與學習', '人際關係', '自我成長與心理', '健康、醫療與運動', '社會議題', '商業、經濟與職場', '科技與媒體', '科學與自然', '環境與災害', '歷史與文化', '文學與藝術', '飲食與旅遊'];

  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function dayNum(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; }

  function daysSince(s) { var n = dayNum(s); if (n == null) return null; return Math.max(0, Math.round((todayNum() - n) / 86400000)); }
  var daysText = function (d) { return d == null ? '存入日期不明' : d <= 0 ? '今天存進來' : d === 1 ? '昨天存進來' : '已存 ' + d + ' 天'; };
  function ago(t) { var d = Math.floor((Date.now() - t) / 86400000); return d <= 0 ? '今天' : d === 1 ? '昨天' : d < 30 ? d + ' 天前' : '一個月以前'; }

    s = String(s || ''); var out = ''; var cnt = 0; var i = 0;

  }

  var STORE_OK = (function () { try { var k = '__scmap_t'; localStorage.setItem(k, '1'); var ok = localStorage.getItem(k) === '1'; localStorage.removeItem(k); return ok; } catch (e) { return false; } })();
  var REC = { done: {}, wb: [], wrong: {} };
  function readRecords() {

        + '<button type="button" class="btn" data-k="printWrong"' + on(function () { goSheet(V.wrongRecentFirst, '我的錯題'); }) + '>列印錯題考卷</button></div>';
      if (V.recent.length) {
        h += '<h4 class="lst-h">最近存進來的（未滿 7 天）</h4><ul class="wl">' + V.recent.slice(0, 5).map(function (w) { return item(w, false); }).join('') + '</ul>'
          + (V.recent.length > 5 ? '<p class="more">還有 ' + (V.recent.length - 5) + ' 題，重做時會一起出。</p>' : '');
      }
      h += '<div class="back" aria-labelledby="h-back"><h4 id="h-back">隔一週再寫一次</h4>';
      if (V.review.length) {
        h += '<p><b>這些題目存進錯題本已滿 7 天。</b>隔一段時間再重做一次，比較能看出自己是不是真的會了；重做後按「我答對了 / 差不多」，題目就會從錯題本移除。</p>'
          + '<ul class="wl">' + V.review.slice(0, 5).map(function (w) { return item(w, true); }).join('') + '</ul>'
          + (V.review.length > 5 ? '<p class="more">還有 ' + (V.review.length - 5) + ' 題，重做時會一起出。</p>' : '')
          + '<button type="button" class="btn strong" data-k="redoReview"' + on(function () { goSet(V.review.map(function (w) { return w.id; }), '錯題本滿 7 天的題目'); }) + '>重做這 ' + V.review.length + ' 題</button>';
      } else {
        h += '<p>存進錯題本滿 7 天的題目，會列在這裡。錯題本裡的題目都還不滿 7 天，過幾天再來看看。</p>';
      }
      h += '</div>';
    } else {
      h += '<p class="empty">錯題本是空的。作答時按「我需要加強」，題目就會存進這裡，之後可以重做或列印成考卷。存進錯題本滿 7 天的題目，也會在這裡提醒你隔一週再寫一次。</p>';
    }
    h += '</section></div>';

    h += '<div class="tools"><section class="sec" aria-labelledby="h-check"><h3 id="h-check">寫完自我檢查</h3>'
      + '<p class="desc">大考中心批改中譯英時，每個錯誤扣 0.5 分，相同的錯誤只扣一次。寫完後照清單逐項檢查，可以找出自己容易漏掉的錯誤；清單頁也有請 AI 批改的指令，可以直接複製。</p>'
      + '<a class="btn" href="../selfcheck.html">打開自我檢查清單</a></section>';
    h += '<section class="sec" aria-labelledby="h-basic"><h3 id="h-basic">寫句子的基本功</h3>'
      + '<p class="desc">中文句子太長、不知道從哪裡下手時，可以照三個步驟來：先找出主要動詞，再選出句型，最後把英文句子排出來。</p>'
      + '<div class="btns"><a class="btn" href="../structure.html">句子結構練習' + (EXT.stN ? '（' + EXT.stN + ' 題）' : '') + '</a><a class="btn" href="../../sentence-patterns.html">句型對照' + (EXT.spTotal ? '（' + EXT.spTotal + ' 個句型）' : '') + '</a></div></section>';

    h += '<section class="sec" aria-labelledby="h-bk"><h3 id="h-bk" tabindex="-1">備份進度</h3>'
      + '<p class="desc">進度只記在這台裝置的這個瀏覽器裡。換手機、換電腦、改用別的瀏覽器，或清除瀏覽紀錄，都會看不到紀錄。換裝置前，先按「複製進度文字」，把文字存在自己找得到的地方；到了新裝置，再按「貼上還原」。</p>'
      + '<div class="btns"><button type="button" class="btn" data-k="bkCopy"' + on(bkCopy) + '>複製進度文字</button>'
      + '<button type="button" class="btn" data-k="bkPaste" aria-expanded="' + (st.bk === 'paste') + '" aria-controls="bk-paste"' + on(function () { var open = app.state.bk === 'paste'; app.setState({ bk: open ? '' : 'paste', bkErr: '', bkAsk: null }); }) + '>貼上還原</button></div>';
    if (st.bk === 'copy') {
      var lab = st.bkCopied === true ? '進度文字（已複製到剪貼簿）' : st.bkCopied === false ? '進度文字（自動複製沒有成功，請自己複製）' : '進度文字';
      h += '<label class="bk-l" for="bk-out">' + lab + '</label><textarea class="ta" id="bk-out" data-k="bk-out" readonly>' + esc(bkTextNow()) + '</textarea>'
        + '<p class="bk-hint">還沒存起來：請貼到自己找得到的地方，例如傳 LINE 給自己，或存進手機的備忘錄。如果沒有複製成功，請長按文字框，選「全選」再「拷貝」。</p>'
        + '<button type="button" class="btn" data-k="bkCloseC"' + on(function () { app.focusKey = 'bkCopy'; app.setState({ bk: '', bkErr: '', bkAsk: null, bkCopied: null }); }) + '>收起</button>';
    }
    if (st.bk === 'paste') {
      var a = st.bkAsk;
      h += '<div id="bk-paste"><label class="bk-l" for="bk-in">把之前複製的進度文字整段貼在這裡</label>'
        + '<textarea class="ta" id="bk-in" data-k="bk-in" aria-invalid="' + (!!st.bkErr) + '"' + (st.bkErr ? ' aria-describedby="bk-err"' : '') + ' placeholder="中譯英進度 v2……">' + esc(st.bkIn) + '</textarea>'
        + (st.bkErr ? '<p class="bk-err" id="bk-err" role="alert">' + esc(BKERR[st.bkErr] || '') + '</p>' : '');
      if (a) {
        var cc = curCounts();
        h += '<div class="bk-ask" role="alert"><p>這段備份有：做過 ' + a.d + ' 題、錯題本 ' + a.w + ' 題。' + (a.miss ? '另有 ' + a.miss + ' 題錯題在目前的題庫裡找不到，不會還原。' : '')
          + '還原後，這台裝置目前的紀錄（做過 ' + cc.d + ' 題、錯題本 ' + cc.w + ' 題）會被取代，不能復原；其他題庫的進度不受影響。確定要還原嗎？</p>'
          + '<div class="btns"><button type="button" class="btn strong" data-k="bkConfirm"' + on(bkConfirm) + '>確定還原</button><button type="button" class="btn" data-k="bkCancel"' + on(function () { app.focusKey = 'bkRestore'; app.setState({ bkAsk: null }); }) + '>取消</button></div></div>';
      } else {
        h += '<div class="btns"><button type="button" class="btn strong" data-k="bkRestore"' + on(bkRestore) + '>還原進度</button><button type="button" class="btn" data-k="bkCloseP"' + on(function () { app.focusKey = 'bkPaste'; app.setState({ bk: '', bkErr: '', bkAsk: null }); }) + '>收起</button></div>';
      }
      h += '</div>';
    }
    h += '</section></div>';
    return h + footHtml();
  }
  function footHtml() {
    return '<footer class="foot"><span class="fl"><a href="../">回到中譯英題庫</a><a href="../../">回題庫首頁</a><a href="../../find.html">找功能</a></span>'
      + '<span class="sig">© 2026 staresto-create ZZSH · 免費、無廣告的非營利自學題庫</span>'
      + '<p class="cc">資料來源：73–115 年歷屆中譯英試題，含大學聯考、學測與指考（學測、指考由大考中心公布）。<br>本題庫自己寫的部分採用 <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.zh-hant" target="_blank" rel="license noopener">CC BY-NC 4.0</a>（姓名標示─非商業性）授權：可以分享，但須註明出處，不得用於商業用途。試題來源與完整說明請見<a href="../../#terms">使用與著作權</a>。</p></footer>';
  }
  function toastHtml() {
    var st = app.state;
    return '<div class="toast" data-show="' + (!!st.notice) + '"><p>' + esc(st.notice) + '</p><button type="button" data-k="noticeX"' + on(function () { if (app._tm) clearTimeout(app._tm); app.setState({ notice: '' }); }) + '>知道了</button></div>';
  }

  function resumeEntry() {
    try {
      if (!window.SCResume) return null;
      var e = window.SCResume.entries().filter(function (x) { return x.key === SITE; })[0];
      if (!e) return null;
      var m = /^#q-(\d+|TA-[\w-]+)$/.exec(e.hash || '');
      if (!m) return null;
      var r = BYID[m[1]];
      return { src: r ? src(r) : e.label, zh: r ? head(r.zh, 24) : '', when: ago(e.t), href: '../index.html' + e.hash };
    } catch (x) { return null; }
  }

  /* ---------- 動作 ---------- */
  var mq = window.matchMedia ? window.matchMedia('(max-width:760px)') : null;
  function isMobile() { return !!(mq && mq.matches); }
  function lockScroll(on1) { document.documentElement.style.overflow = on1 ? 'hidden' : ''; document.body.style.overflow = on1 ? 'hidden' : ''; }
  function openDrawer() { app.focusKey = 'sidex'; app.setState({ drawer: true, openTile: '' }); lockScroll(isMobile()); }
  function closeDrawer() { var was = app.state.drawer; lockScroll(false); if (was) app.focusKey = 'pickbtn'; app.setState({ drawer: false }); }
  function closePeek() { var k = app.state.openTile; if (k) app.focusKey = 'tile:' + k; app.setState({ openTile: '' }); }
  function clearAll() { app.focusKey = 'conds-l'; app.setState({ sel: EMPTY_SEL(), openTile: '', showAll: false }); }
  function removeCond(g, k) {
    var list = [].slice.call(document.querySelectorAll('[data-k^="cond:"]')).map(function (el) { return el.getAttribute('data-k'); });
    var i = list.indexOf('cond:' + g + ':' + k);
    var next = list[i + 1] || list[i - 1];
    app.focusKey = next || 'conds-l';
    app.flip(g, k);
  }
  function setNameFromConds(V) {
    if (!V.conds.length) return '題目地圖 · 全部題目';
    var s = V.conds.map(function (c) { return c.name; }).join('、');
    if (s.length > 40) s = s.slice(0, 38) + '…';
    return '題目地圖 · ' + s;
  }
  function doStart(V) { if (!V.n) { app.say('這個組合沒有題目，請先移除一個條件。'); return; } goSet(V.res.map(function (r) { return r.id; }), setNameFromConds(V)); }
  function doPrint(V) { if (!V.n) { app.say('這個組合沒有題目，請先移除一個條件。'); return; } goSheet(V.res.map(function (r) { return r.id; }), setNameFromConds(V)); }
  function bkCopy() {
    var text = bkTextNow();
    app.focusKey = 'bkCopy';
    app.setState({ bk: 'copy', bkErr: '', bkAsk: null, bkCopied: null });
    copyText(text, document.getElementById('bk-out')).then(function (ok) {
      app.focusKey = ok ? 'bkCopy' : 'bk-out';
      app.setState({ bkCopied: !!ok });
      if (ok) app.say('已複製到剪貼簿，但還沒存起來：請貼到自己找得到的地方，例如傳 LINE 給自己。');
      else {
        var ta = document.getElementById('bk-out');
        if (ta) { try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); } catch (e) {} }
        app.say('自動複製沒有成功。已幫你選好整段文字，請長按選「拷貝」或「複製」（電腦按 Ctrl+C），再存到自己找得到的地方。');
      }
    });
  }

  /* ---------- 畫出來：保留焦點、選題欄的捲動位置 ---------- */
  var root;
  app.render = function () {
    if (!root) return;
    var ae = document.activeElement;
    var key = this.focusKey || (ae && ae !== document.body && root.contains(ae) ? ae.getAttribute('data-k') : null);
    var sel0 = null;
    if (ae && ae.tagName === 'TEXTAREA' && !this.focusKey) { try { sel0 = [ae.selectionStart, ae.selectionEnd]; } catch (e) {} }
    this.focusKey = null;
    var side = root.querySelector('.side'); var sideTop = side ? side.scrollTop : 0;
    root.innerHTML = viewHtml() + toastHtml();
    var side2 = root.querySelector('.side'); if (side2) side2.scrollTop = sideTop;
    if (key) {
      var el = null;
      try { el = root.querySelector('[data-k="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]'); } catch (e) { el = null; }
      if (el && el.getClientRects().length) {
        try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
        if (sel0 && el.setSelectionRange) { try { el.setSelectionRange(sel0[0], sel0[1]); } catch (e) {} }
      }
    }
  };

  function init() {
    root = document.getElementById('app');
    readRecords();
    root.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-h]') : null;
      if (!el || !root.contains(el)) return;
      var fn = H[+el.getAttribute('data-h')];
      if (typeof fn === 'function') { e.preventDefault(); fn(e); }
    });
    root.addEventListener('input', function (e) { if (e.target && e.target.id === 'bk-in') app.state.bkIn = e.target.value; });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' || e.key === 'Esc') {
        if (app.state.drawer) { e.preventDefault(); closeDrawer(); return; }
        if (app.state.openTile) { e.preventDefault(); closePeek(); return; }
        if (app.state.notice) { if (app._tm) clearTimeout(app._tm); app.setState({ notice: '' }); }
        return;
      }
      /* 抽屜打開時，Tab 只在抽屜裡面繞 */
      if (e.key === 'Tab' && app.state.drawer && isMobile()) {
        var side = root.querySelector('.side'); if (!side) return;
        var f = [].slice.call(side.querySelectorAll('button:not([tabindex="-1"]),a[href],textarea,[tabindex="0"]')).filter(function (x) { return x.getClientRects().length; });
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (!side.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    if (mq) {
      var onMq = function () { if (!isMobile() && app.state.drawer) closeDrawer(); else if (app.state.drawer) lockScroll(true); };
      if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
    }
    /* 從作答畫面按「上一頁」回來時，重新讀一次紀錄 */
    window.addEventListener('pageshow', function (e) { if (e.persisted && app.state.loaded) { readRecords(); app.render(); } });
    window.addEventListener('storage', function (e) { if (app.state.loaded && (e.key === LS_WRONG || e.key === 'scProgressV1' || e.key === null)) { readRecords(); app.render(); } });
    app.render();
    fetch('../quiz_items.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (items) {
      prepare(Array.isArray(items) ? items : []);
      if (!ROWS.length) throw new Error('empty');
      app.setState({ loaded: true });
      loadExtras();
    }).catch(function () { app.setState({ loadErr: true }); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  window.__mapApp = app;
})();

</script>
