<title>每日一句</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap">
<style>
/* 版面：單欄閱讀，句子在最上面，先判斷、再看原因；色票與字體沿用本題庫首頁 */
:root{
  --bg:#F6F1E4; --card:#FFFDF7; --fg:#221F1A; --muted:#5B5648; --rule:#DCD3BB;
  --accent:#AE3626; --accent-soft:#D8C6BE; --on-accent:#FFFFFF;

  --mark:#FFE9A0; --mark-fg:#221F1A; --note-bg:#FBF2DA;
  --serif:'Noto Serif TC','PingFang TC','Microsoft JhengHei',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'IBM Plex Mono','Noto Sans TC','PingFang TC','Microsoft JhengHei',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1916; --card:#26231F; --fg:#F2F0EE; --muted:#C2BFBB; --rule:#514A37;
    --accent:#E4B6B0; --accent-soft:#4F413A; --on-accent:#1B1916;
    --ok:#CBDDD2; --ok-bg:#25302A; --bad:#E8BEB9; --bad-bg:#352724;
    --mark:#53471F; --mark-fg:#F2F0EE; --note-bg:#2A2821; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1916; --card:#26231F; --fg:#F2F0EE; --muted:#C2BFBB; --rule:#514A37;
  --accent:#E4B6B0; --accent-soft:#4F413A; --on-accent:#1B1916;
  --ok:#CBDDD2; --ok-bg:#25302A; --bad:#E8BEB9; --bad-bg:#352724;
  --mark:#53471F; --mark-fg:#F2F0EE; --note-bg:#2A2821; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:16px; line-height:1.75;
  padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
h1{font-family:var(--serif); font-size:28px; line-height:1.3; margin:0; text-wrap:balance}
.lead{margin:4px 0 0; color:var(--muted); font-size:15px}
.top{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap}
.meta{display:flex; gap:8px; flex-wrap:wrap; font-family:var(--mono); font-size:13px}
.chip{border:1px solid var(--rule); border-radius:999px; padding:2px 12px; background:var(--card); white-space:nowrap}
.chip b{font-weight:500; color:var(--accent)}
.sample{border:1px dashed var(--rule); border-radius:8px; padding:10px 14px; font-size:14px; color:var(--muted); background:var(--note-bg)}
.sample strong{color:var(--fg)}
.card{background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:20px max(16px,4vw)}
.src{font-family:var(--mono); font-size:13px; color:var(--muted); margin:0 0 10px}
.sent{font-family:var(--serif); font-size:22px; line-height:1.65; margin:0; overflow-wrap:anywhere}
mark{background:var(--mark); color:var(--mark-fg); padding:0 3px; border-radius:3px}
.gap{color:var(--accent); font-weight:700}
.q{margin:20px 0 10px; font-weight:700}
.opts{display:flex; flex-direction:column; gap:8px; padding:0; margin:0; list-style:none}
.opt{
  width:100%; text-align:left; font:inherit; color:var(--fg); background:var(--card);
  border:1.5px solid var(--rule); border-radius:10px; padding:10px 14px; cursor:pointer;
  display:flex; gap:12px; align-items:baseline; min-height:48px;
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.opt .l{font-family:var(--mono); color:var(--muted); flex:none}
.opt .t{font-family:var(--serif); font-size:17px; overflow-wrap:anywhere; min-width:0}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok); background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.why{margin:6px 0 0; font-size:14.5px; color:var(--muted); font-family:var(--sans)}
.opt .t,.opt .body{flex:1; min-width:0}
.res{margin-top:20px; display:flex; flex-direction:column; gap:14px; border-top:1px solid var(--rule); padding-top:16px}
.verdict{margin:0; font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.blk h2{font-size:14px; font-family:var(--mono); font-weight:500; letter-spacing:.06em; color:var(--muted); margin:0 0 4px}
.blk p{margin:0}
.en{font-family:var(--serif); font-size:18px; line-height:1.65}
.nav{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.btn{
  font:inherit; font-size:15px; color:var(--fg); background:var(--card); border:1.5px solid var(--rule);
  border-radius:10px; padding:8px 16px; cursor:pointer; min-height:44px;
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.spacer{flex:1}
.pos{font-family:var(--mono); font-size:13px; color:var(--muted)}
.pname{font-weight:700; margin:0 0 4px !important}
.links{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:15px}
.links li{display:flex; gap:8px; align-items:baseline; min-width:0}
.links a{color:var(--accent); overflow-wrap:anywhere; min-width:0}
.tag{flex:none; font-family:var(--mono); font-size:12px; border:1px solid var(--rule); border-radius:999px; padding:0 8px; color:var(--muted); background:var(--card)}
@media (prefers-reduced-motion:no-preference){ .opt,.btn{transition:border-color .15s, background-color .15s} }
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>每日一句</h1>
      <p class="lead">歷屆試題裡的長句，每天一句。先判斷，再看原因。</p>
    </div>
    <div class="meta">
      <span class="chip" id="today"></span>
      <span class="chip">連續 <b id="streak">0</b> 天</span>

    <span class="pos" id="pos"></span>
    <span class="spacer"></span>
    <button class="btn" id="home" type="button">回到今天這題</button>
  </div>
</div>

ITEMS.forEach(function(it){ var k = Object.keys(WXALL).filter(function(k){ return it.sent.indexOf(k)===0; })[0]; if(k) it.wx = WXALL[k]; });
var DAYS = ['日','一','二','三','四','五','六'];
var now = new Date();
var todayKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
var dayNum = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
var todayIdx = dayNum % ITEMS.length;
var cur = todayIdx;
var done = {};

function store(k, v){ try{ if(v===undefined){ return localStorage.getItem(k); } localStorage.setItem(k, v); }catch(e){ return null; } }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

document.getElementById('today').textContent = (now.getMonth()+1) + ' 月 ' + now.getDate() + ' 日（' + DAYS[now.getDay()] + '）';

function loadStreak(){
  var s = parseInt(store('ds-streak'),10) || 0, last = store('ds-last');
  if(last){
    var d = new Date(last + 'T00:00:00'), gap = Math.round((new Date(todayKey + 'T00:00:00') - d)/86400000);
    if(gap > 1) s = 0;
  }
  document.getElementById('streak').textContent = s;
}
function bumpStreak(){
  var last = store('ds-last'), s = parseInt(store('ds-streak'),10) || 0;
  if(last === todayKey) return;
  var gap = last ? Math.round((new Date(todayKey + 'T00:00:00') - new Date(last + 'T00:00:00'))/86400000) : 99;
  s = (gap === 1) ? s + 1 : 1;
  store('ds-streak', String(s)); store('ds-last', todayKey);
  document.getElementById('streak').textContent = s;
}

function render(){
  var it = ITEMS[cur], answered = done[cur];
  var h = '<p class="src">' + esc(it.src) + '</p>';
  h += '<p class="sent">' + (answered !== undefined ? it.after : esc(it.sent)) + '</p>';
  h += '<p class="q">' + esc(it.q) + '</p><ul class="opts">';
  var L = ['A','B','C','D'];
  it.opts.forEach(function(o,i){
    var cls = 'opt';
    if(answered !== undefined){ if(o.ok) cls += ' right'; else if(i === answered) cls += ' wrong'; }
    h += '<li><button type="button" class="' + cls + '" data-i="' + i + '"' + (answered !== undefined ? ' disabled' : '') + '>'
      + '<span class="l">(' + L[i] + ')</span><span class="body"><span class="t">' + esc(o.t) + '</span>'
      + (answered !== undefined ? '<p class="why">' + o.why + '</p>' : '') + '</span></button></li>';
  });
  h += '</ul>';
  if(answered !== undefined){
    var right = !!it.opts[answered].ok;
    h += '<div class="res"><p class="verdict ' + (right ? 'ok' : 'no') + '">' + (right ? '答對了' : '再看一次原因') + '</p>';
    if(it.zh) h += '<div class="blk"><button class="btn" type="button" id="zhbtn" aria-expanded="false">看中譯</button><p class="en" id="zhtxt" hidden style="margin-top:.6rem">' + esc(it.zh) + '</p><p class="why" id="zhnote" hidden>中譯由本題庫自擬，供對照句意，不是官方翻譯。</p></div>';
    h += '<div class="blk"><h2>' + (it.rh || '還原成一般語序') + '</h2><p class="en">' + it.restore + '</p></div>';
    h += '<div class="blk"><h2>這是什麼句型</h2><p class="pname">' + it.pat.name + '</p>' + it.pat.rule.map(function(p){ return '<p>' + p + '</p>'; }).join('') + '</div>';
    h += '<div class="blk"><h2>想看更多</h2><ul class="links">' + it.pat.links.map(function(l){
      if(l[2] === 'text') return '<li><span class="tag">課本</span>' + esc(l[0].replace(/^課本：/, '')) + '</li>';
      return '<li><span class="tag">' + (l[2] === 'site' ? '本題庫' : l[2]) + '</span><a href="' + l[1] + '" target="_blank" rel="noopener">' + esc(l[0]) + '</a></li>';
    }).join('') + '</ul></div>';
    if(it.wx && it.wx.length) h += '<div class="blk"><h2>這句的單字，在本題庫的其他題</h2><ul class="links">' + it.wx.map(function(w){ return '<li><span class="tag">' + esc(w.w) + '</span>' + '<span style="display:flex;flex-wrap:wrap;gap:.15rem 1rem">' + w.h.map(function(x){ return '<a style="white-space:nowrap" href="' + x[1] + '" target="_blank" rel="noopener">' + (x[2] ? '答案' : '選項') + '：' + esc(x[0]) + '</a>'; }).join('') + '</span></li>'; }).join('') + '</ul></div>';
    if(it.contrast) h += '<div class="blk"><h2>對照</h2><p>' + it.contrast + '</p></div>';
    if(it.news) h += '<div class="blk"><h2>事實依據（句子為本題庫自編，不是新聞原文）</h2>' + it.facts.map(function(f){ return '<p>' + esc(f) + '</p>'; }).join('') + '<ul class="links">' + it.flinks.map(function(l){ return '<li><span class="tag">新聞</span><a href="' + l[1] + '" target="_blank" rel="noopener">' + esc(l[0]) + '</a></li>'; }).join('') + '</ul><p class="why">事實查證日期：' + (it.fd || '2026 年 11 月 4 日') + '。</p></div>';
    h += '</div>';
  }
  var card = document.getElementById('card');
  card.innerHTML = h;
  var zb = document.getElementById('zhbtn');
  if(zb) zb.addEventListener('click', function(){ var t = document.getElementById('zhtxt'), n = document.getElementById('zhnote'), open = t.hidden; t.hidden = !open; n.hidden = !open; zb.textContent = open ? '收起中譯' : '看中譯'; zb.setAttribute('aria-expanded', open ? 'true' : 'false'); });
  card.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click', function(){
      done[cur] = parseInt(b.getAttribute('data-i'),10);
      if(cur === todayIdx) bumpStreak();
      render();
    });
  });
  document.getElementById('pos').textContent = '第 ' + (cur+1) + ' 題／共 ' + ITEMS.length + ' 題' + (cur === todayIdx ? '（今天這題）' : '');
}
document.getElementById('prev').addEventListener('click', function(){ cur = (cur + ITEMS.length - 1) % ITEMS.length; render(); });
document.getElementById('next').addEventListener('click', function(){ cur = (cur + 1) % ITEMS.length; render(); });
document.getElementById('home').addEventListener('click', function(){ cur = todayIdx; render(); });
loadStreak(); render();
</script>
