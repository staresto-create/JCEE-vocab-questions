(function(){

var $=function(id){return document.getElementById(id);};
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var has=Object.prototype.hasOwnProperty;
var FREQ=null, FIDX={}, TB=null, CV=null, COV=null, CF=null, SNI=null, WLOK=false, ready=false;
var GN={1:'初級',2:'中級',3:'中高級'};
var SITE={
  gsat:{n:'學測單字',base:'../gsat/#q-',suf:''},
  zhikao:{n:'指考單字',base:'../zhikao/#q-',suf:''},
  gcz:{n:'學測克漏字',base:'https://staresto-create.github.io/grammar-cloze-test/#set-',suf:'|查單字'},

  tr:{n:'中譯英',base:'../translate/#q-',suf:''}
};
function jget(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u+' '+r.status);return r.json();});}
function soft(p){return p.catch(function(){return null;});}
function loadWL(){return new Promise(function(res){
  var s=document.createElement('script');s.src='../wordlevel-data.js';
  s.onload=function(){res(!!(window.WL&&window.WL.c));};s.onerror=function(){res(false);};document.head.appendChild(s);});}

/* 學測全卷用字統計：「state(ment)」這類寫法，兩種字形都指向同一列 */
function indexFreq(d){
  FREQ=d;FIDX={};
  d.rows.forEach(function(r){
    var n=String(r[0]).toLowerCase();
    n.split('/').forEach(function(part){
      var m=/^([a-z'-]+)\(([a-z'-]+)\)$/.exec(part);
      if(m){if(!has.call(FIDX,m[1]))FIDX[m[1]]=r;if(!has.call(FIDX,m[1]+m[2]))FIDX[m[1]+m[2]]=r;}else if(!has.call(FIDX,part))FIDX[part]=r;
    });
  });
}
function load(){
  return Promise.all([
    PV.load(),
    soft(jget('freq_data.json')),
    soft(jget('../textbook/tb_index.json')),
    Promise.resolve(null),
    soft(jget('confusables_data.json')),
    soft(jget('confusables_sense_index.json')),
    loadWL(),
    soft(jget('corevocab_data.json'))
  ]).then(function(r){
    if(r[1])indexFreq(r[1]);
    TB=r[2];COV=PV.ctx().D&&PV.ctx().D.q?PV.ctx().D:null;CF=r[4];SNI=r[5];WLOK=r[6];CV=r[7];
  });
}

/* ---------- 各段落 ---------- */
function badges(key,e){
  var h='',W=window.WL,c=null,g=0,t=false,k;
  if(e&&!e.out)c=e.lv;
  else if(WLOK&&has.call(W.c,key))c=W.c[key];
  if(WLOK){g=has.call(W.g,key)?W.g[key]:0;t=W.t.indexOf(key)>=0;}
  h+=c?'<span class="bd bd-c">'+(c===9?'大考附錄字':'大考詞彙表 '+c+' 級')+'</span>':'<span class="bd bd-no">不在大考詞彙表</span>';
  if(WLOK){
    h+=g?'<span class="bd bd-g'+g+'">英檢'+GN[g]+'</span>':'<span class="bd bd-no">不在英檢字表</span>';
    h+=t?'<span class="bd bd-t">多益補充字表</span>':'<span class="bd bd-no">不在多益補充字表</span>';
  }
  return h;
}
function freqSec(key,typed,lv){
  var r=FIDX[key]||FIDX[typed];
  if(!FREQ)return '';
  var N=FREQ.papers,h='<div class="sec"><h3>學測全卷出現次數</h3>';
  var how='<p class="tnote">詞彙、克漏字、文意選填、篇章結構、閱讀測驗、混合題的文章、題目和選項都計入；翻譯題、作文題目和英聽沒有計。字形變化算回詞彙表的詞條（例如 went 算 go），專有名詞不算。<a href="freq.html">計算方式與逐字清單</a></p>';
  if(!r){
    if(lv===1)return h+'<p>一級字太常見，這份統計沒有逐字列出：一級字占了全部字次的 '+FREQ.cov[0].own+'%。</p>'+how+'</div>';
    if(!lv)return h+'<p>這份統計對詞彙表以外的字，只列出現在 2 份以上試卷的字，所以沒有查到這個字。</p>'+how+'</div>';
    return h+'<p>83 到 115 學年度的 '+N+' 份學測試卷中，沒有出現這個字。</p>'+how+'</div>';
  }
  h+='<p class="big">'+N+' 份學測試卷中，出現在 <b>'+r[3]+'</b> 份，共 <b>'+r[4]+'</b> 次。</p>';
  h+='<div class="meter" role="img" aria-label="'+N+' 份試卷中有 '+r[3]+' 份出現這個字"><i style="width:'+Math.max(2,Math.round(r[3]/N*100))+'%"></i></div>';
  h+='<p class="tnote">出現的年份：'+esc(r[5])+'</p>';
  if(r[6])h+='<p class="tnote">這個字的出現次數，有一部分來自閱讀測驗的題目（例如 according to the passage）。</p>';
  return h+how+'</div>';
}
function qLink(id,site,label,k,form){
  var s=SITE[site];if(!s)return '';
  var h='<a'+(k==='a'?' class="ans"':'')+' href="'+s.base+encodeURIComponent(id)+s.suf+'" title="'+esc(s.n+'　'+label)+'">'+esc(label);
  if(form)h+='（'+esc(form)+'）';
  if(k)h+='<span class="k">'+(k==='a'?'　答案':'　誘答')+'</span>';
  return h+'</a>';
}
function refList(key,typed,e){
  var seen={},items=[],lex=PV.ctx().LEX,L=lex[key]||lex[typed];
  function add(id,site,label,k,form){if(seen[id])return;seen[id]=1;items.push({id:id,s:site,t:label,k:k,f:form});}
  if(e&&e.grp&&e.grp.tested&&COV){
    e.grp.tested.forEach(function(x){(x[1]||[]).forEach(function(q){var c=COV.q[q[0]];if(c)add(q[0],c[0],c[1],q[1],x[0]!==key?x[0]:'');});});
  }
  if(L&&L.refs)L.refs.forEach(function(r){add(r.id,r.s,r.t,r.k,'');});
  return items;
}
function refSec(key,typed,e){
  var items=refList(key,typed,e),h='<div class="sec"><h3>出現過的題目</h3>';
  if(!items.length)return h+'<p>本題庫沒有查到這個字出現在單字題、克漏字或中譯英的選項或答案裡。</p></div>';
  var by={};items.forEach(function(x){(by[x.s]=by[x.s]||[]).push(x);});
  var order=['gsat','zhikao','gcz','zcz','tr'],sum=[];
  order.forEach(function(s){if(by[s])sum.push(SITE[s].n+' '+by[s].length+(s==='gcz'||s==='zcz'?' 格':' 題'));});
  var noK=items.some(function(x){return !x.k;});
  h+='<p>'+sum.join('、')+'。標「答案」，表示這個字是該題的正確答案；標「誘答」，表示它是該題的錯誤選項。'+(noK?'沒有標示的，是這個字出現在該題裡。':'')+'</p>';
  var LIM=8,html=items.map(function(x){return qLink(x.id,x.s,x.t,x.k,x.f);});
  h+='<div class="refs">'+html.slice(0,LIM).join('')+'</div>';
  if(html.length>LIM)h+='<details><summary>還有 '+(html.length-LIM)+' 題</summary><div class="refs">'+html.slice(LIM).join('')+'</div></details>';
  return h+'</div>';
}
function tbSec(key,typed){
  if(!TB&&!CV)return '';
  var ks=[key];if(typed!==key)ks.push(typed);
  var seen={},kk=[];ks.forEach(function(k){if(!seen[k]){seen[k]=1;kk.push(k);}});
  var rows=PV.tb.line(kk,TB,CV);
  var h='<div class="sec"><h3>教材有沒有收</h3>';
  var legend='<details><summary>教材標記怎麼看</summary><p class="tnote">'+esc(PV.tb.legend({form:PV.tb.hasForm(rows)}))+'</p></details>';
  var hasTb=rows.some(function(r){return /(^|：)(龍|乙|甲)/.test(r);});
  if(!hasTb){
    var miss=TB?((rows.length||!CV)?'龍騰、三民課本的單字表裡沒有查到這個字。'+(rows.length?'<br>':''):'龍騰、三民課本和《核心字彙》的單字表裡沒有查到這個字。'):'';
    if(!miss&&!rows.length)return '';
    return h+'<p>'+miss+esc(rows.join('；'))+'</p>'+(rows.length?legend:'')+'</div>';
  }
  return h+'<p>'+esc(rows.join('；'))+'</p>'+legend+'<p class="tnote"><a href="../textbook/longteng.html">龍騰課本單字</a>　<a href="../textbook/sanmin.html">三民課本單字</a></p></div>';
}
function hl(sentence,w){
  var stem=w.length>4?w.replace(/e$/,''):w;
  var re=new RegExp('\\b'+stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*','ig');
  var out='',last=0,m;
  while((m=re.exec(sentence))){out+=esc(sentence.slice(last,m.index))+'<b>'+esc(m[0])+'</b>';last=m.index+m[0].length;if(m[0].length===0)re.lastIndex++;}
  return out+esc(sentence.slice(last));
}
function exSec(key,typed){
  if(!WLOK)return '';
  var X=window.WL.ex||{},x=has.call(X,key)?X[key]:(has.call(X,typed)?X[typed]:null);
  if(!x)return '';
  var h='<div class="sec ex"><h3>例句與字詞搭配</h3><p class="en" lang="en">'+hl(x.e,key)+'</p><p class="cz">'+esc(x.z)+'</p>';
  if(x.c&&x.c.length)h+='<ul class="co">'+x.c.map(function(c){return '<li><span lang="en">'+esc(c[0])+'</span><span class="cz">'+esc(c[1])+'</span></li>';}).join('')+'</ul>';
  return h+'</div>';
}
function polySec(key,typed){
  var P=PV.ctx().POLY,p=P[key]||P[typed];
  if(!p)return '';
  var h='<div class="sec"><h3>一字多義</h3><p>這個字有不只一個意思，上方的中文列出了其中幾個意思。</p>';
  if(p.col)h+='<dl class="kv"><dt>常見搭配</dt><dd lang="en">'+esc(p.col)+'</dd></dl>';
  return h+'<p class="tnote"><a href="./#deck=po&amp;view='+p.n+'">到一字多義卡看完整說明與歷屆試題 →</a></p></div>';
}
function confSec(key,typed){
  var out=[];
  function hit(t){return String(t).split('／').some(function(x){x=x.trim().toLowerCase();return x===key||x===typed;});}
  if(CF&&CF.g)CF.g.forEach(function(g){if(hit(g.t))out.push({n:g.n,t:g.t,kind:'拼字相近'});});
  if(SNI&&SNI.t)Object.keys(SNI.t).forEach(function(k){if(hit(SNI.t[k]))out.push({n:400+(+k),t:SNI.t[k],kind:'字義相近'});});
  if(!out.length)return '';
  var h='<div class="sec"><h3>易混淆字組</h3><p>這個字容易與下列的字混淆：</p><dl class="kv">';
  out.forEach(function(g){h+='<dt>'+g.kind+'</dt><dd lang="en"><a href="./#deck=cf&amp;view='+g.n+'">'+esc(g.t.replace(/／/g,' ／ '))+'</a></dd>';});
  return h+'</dl></div>';
}
function rootSec(key,typed){
  var L=PV.ctx().LEX,x=L[key]||L[typed];
  if(!x||(!(x.fam&&x.fam.length)&&!(x.aff&&x.aff.length)))return '';
  var w=encodeURIComponent(key==='internet'?'Internet':(L[key]?key:typed)),h='<div class="sec"><h3>字根與字首字尾</h3><dl class="kv">';
  if(x.fam&&x.fam.length)h+='<dt>字根家族表</dt><dd lang="en"><a href="../roots/#w='+w+'">'+esc(x.fam.join('、'))+'</a></dd>';
  if(x.aff&&x.aff.length)h+='<dt>字首字尾表</dt><dd lang="en"><a href="../affixes/#w='+w+'">'+esc(x.aff.join('、'))+'</a></dd>';
  return h+'</dl></div>';
}

/* ---------- 查詢 ---------- */
function show(html){var r=$('res');r.innerHTML=html;r.hidden=false;$('sc').classList.add('compact');var h1=r.querySelector('.bds')?r.querySelector('.w'):null;$('st').textContent=h1?'已查到 '+h1.textContent:'';}
function search(raw,quiet){
  var toks=String(raw).match(/[A-Za-z][A-Za-z'’-]*/g);
  if(!toks){show('<p class="empty">請輸入英文單字。</p>');return;}
  var typed=toks[0].toLowerCase().replace(/[’]/g,"'"),note='';
  if(toks.length>1)note='<p class="notice">一次只查一個字，這次查的是第一個字 <b lang="en">'+esc(toks[0])+'</b>。</p>';
  var hy=/-/.test(typed),LX=PV.ctx().LEX,whole=hy&&(has.call(LX,typed)||(WLOK&&(has.call(window.WL.c,typed)||has.call(window.WL.g,typed)||has.call(window.WL.zc,typed))));
  if(hy&&!whole){show(note+'<div class="hw"><span class="w" lang="en">'+esc(typed)+'</span></div><p class="zh">本題庫沒有收這個字（可能太基本、是專有名詞，或拼錯了）。</p><p class="tnote"><a href="'+PV.camUrl(typed)+'" target="_blank" rel="noopener">到劍橋英漢字典看更多</a></p>');return;}
  var A=hy?{order:[]}:PV.analyze(toks[0]),e=A.order[0]||null,key=e?e.key:typed;
  var head='<div class="hw"><span class="w" lang="en">'+esc(key)+'</span>'+
    (window.SPK?(SPK.html(key,true)||''):'')+(window.KK?KK.html(key):'')+
    (e&&!e.out&&e.pos?'<span class="p">'+esc(e.pos)+'</span>':'')+'</div>';
  if(e&&typed!==key)head+='<p class="tnote">你輸入的是 <b lang="en">'+esc(typed)+'</b>，查的是原形 <b lang="en">'+esc(key)+'</b>。</p>';
  var g=e?PV.glossOf(e):'';
  if(!g&&WLOK&&has.call(window.WL.zc,key)){var zz=window.WL.zc[key];g=(zz[0]?zz[0]+' ':'')+zz[1];}
  if(!e&&!g&&PV.ctx().LEX[typed]&&PV.ctx().LEX[typed].g)g=PV.ctx().LEX[typed].g;
  var cam='<a href="'+PV.camUrl(key)+'" target="_blank" rel="noopener">到劍橋英漢字典看更多</a>';
  if(!e&&!has.call(PV.ctx().LEX,typed)){
    show(note+head+'<p class="zh">本題庫沒有收這個字（可能太基本、是專有名詞，或拼錯了）。</p><p class="tnote">'+cam+'</p>');
    return;
  }
  var h=note+head+'<div class="zh">'+(g?esc(g):'這個字的中文意思請看<a href="'+PV.camUrl(key)+'" target="_blank" rel="noopener">劍橋英漢字典</a>。')+'</div><div class="bds">'+badges(key,e)+'</div>';
  var lvn=(e&&!e.out)?e.lv:0;
  h+=freqSec(key,typed,lvn)+refSec(key,typed,e)+tbSec(key,typed)+exSec(key,typed)+polySec(key,typed)+confSec(key,typed)+rootSec(key,typed);
  h+='<div class="sec"><p class="tnote">'+cam+'　·　<a href="../wordlevel.html">英檢、多益與大考詞彙表單字對照</a></p></div>';
  show(h);
  if(!quiet){try{history.replaceState(null,'','#w='+encodeURIComponent(key));}catch(x){}}
}
function fromHash(){
  var m=/(?:^|[#&])w=([^&]+)/.exec(location.hash),w='';
  try{w=m?decodeURIComponent(m[1]):'';}catch(x){w=m?m[1]:'';}
  if(w){$('q').value=w;search(w,true);}
}
$('f').addEventListener('submit',function(ev){ev.preventDefault();var v=$('q').value.trim();if(v)search(v);});
[].forEach.call(document.querySelectorAll('.chip'),function(b){b.addEventListener('click',function(){var w=b.getAttribute('data-w');$('q').value=w;if(ready)search(w);});});
window.addEventListener('hashchange',function(){if(ready)fromHash();});
(window.KK&&KK.ready?KK.ready:Promise.resolve()).then(load).then(function(){
  ready=true;$('go').disabled=false;[].forEach.call(document.querySelectorAll('.chip'),function(b){b.disabled=false;});$('st').textContent='';fromHash();
}).catch(function(){$('st').textContent='資料載入失敗，請重新整理頁面試試。';});
})();
</script>
