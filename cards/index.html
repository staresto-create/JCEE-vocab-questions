<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單字記憶卡 · 學測指考英文字彙</title>
<meta name="description" content="用學測、指考詞彙題考過的字做間隔複習。答對的字往後推，記不牢的隔天再來。免費、無廣告。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E4;
    --paper-card:#FFFDF7;
    --ink:#221F1A;
    --ink-soft:#5B5648;
    --rule:#DCD3BB;
    --crimson:#AE3626;
    --crimson-soft:#D8C6BE;
    --sage:#3E6E52;
    --sage-soft:#CBD9C9;
    --gold:#A9812E;
    --shadow: 0 1px 0 rgba(34,31,26,.06), 0 8px 24px rgba(34,31,26,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      radial-gradient(circle at 100% 0%, rgba(174,54,38,.05), transparent 40%),
      repeating-linear-gradient(0deg, rgba(34,31,26,0.025) 0px, rgba(34,31,26,0.025) 1px, transparent 1px, transparent 34px);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    padding: 28px 16px 72px;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header.top{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    border-bottom: 3px double var(--ink);
    padding-bottom:12px; margin-bottom: 20px;
  }
  header.top .title{font-family:'Noto Serif TC',serif; font-weight:900; font-size:23px; letter-spacing:.02em;}
  header.top .sub{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}
  .card{
    background: var(--paper-card);
    border:1px solid var(--rule);
    border-radius:3px;
    box-shadow: var(--shadow);
    position:relative;
  }
  .card::before{
    content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px;
    background: repeating-linear-gradient(0deg, var(--crimson-soft) 0 6px, transparent 6px 13px);
    opacity:.6;
  }
  .hide{display:none !important;}

  /* ---------- HOME ---------- */
  #home .card{padding:26px 24px 24px; margin-bottom:16px;}
  .home-lead{font-family:'Noto Serif TC',serif; font-weight:700; font-size:19px; margin:0 0 8px;}
  .home-desc{color:var(--ink-soft); font-size:14px; line-height:1.85; margin:0 0 18px;}
  .big-btn{
    display:block; width:100%; text-align:center; cursor:pointer;
    background: var(--ink); color: var(--paper-card);
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:20px;
    padding:17px; border:none; border-radius:3px; letter-spacing:.06em;
    transition: transform .12s ease, background .15s ease;
  }
  .big-btn:hover{background:#000; transform: translateY(-1px);}
  .big-btn:active{transform: translateY(0);}
  .big-btn[disabled]{background:var(--rule); color:var(--ink-soft); cursor:default; transform:none;}
  .scope-line{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--sage);
    letter-spacing:.04em; margin:14px 0 0; text-align:center; line-height:1.7;
  }
  .home-stat{
    margin:18px 0 0; padding-top:14px; border-top:1px dashed var(--rule);
    font-size:13px; color:var(--ink-soft); line-height:1.9;
  }
  .home-stat b{color:var(--crimson); font-family:'IBM Plex Mono',monospace; font-size:14px;}
  .minor-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .minor-btn{
    flex:1 1 auto; min-width:140px; cursor:pointer; text-align:center;
    background:transparent; color:var(--ink); border:1px solid var(--rule);
    border-radius:3px; padding:11px 12px; font-size:13.5px; font-family:'Noto Sans TC',sans-serif;
  }
  .minor-btn:hover{border-color:var(--ink); background:#F1EADA;}
  .note{font-size:12.5px; color:var(--ink-soft); line-height:1.85; margin:16px 0 0;}
  .note a{color:var(--crimson);}

  /* ---------- QUIZ ---------- */
  .bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);
    margin-bottom:10px;
  }
  .bar .quit{cursor:pointer; text-decoration:underline; color:var(--crimson); background:none; border:none; font:inherit; padding:0;}
  .track{height:3px; background:var(--rule); border-radius:2px; overflow:hidden; margin-bottom:16px;}
  .track span{display:block; height:100%; background:var(--sage); width:0; transition:width .25s ease;}

  .qcard{padding:26px 22px 22px; margin-bottom:14px;}
  .mode-tag{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em;
    color:var(--sage); display:block; margin-bottom:14px;
  }
  .front-word{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:32px; line-height:1.3;
    margin:0 0 6px; word-break:break-word;
  }
  .front-zh{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:23px; line-height:1.55;
    margin:0 0 6px;
  }
  .front-frame{
    font-size:19px; line-height:1.75; margin:0 0 6px; word-break:break-word;
  }
  .front-frame u{text-decoration:none; color:var(--crimson); font-weight:700; letter-spacing:.06em;}
  .front-meta{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); margin:0;}
  .front-meta .pos{color:var(--crimson); font-weight:600;}
  .front-hint{font-size:12.5px; color:var(--ink-soft); margin:10px 0 0; line-height:1.75;}

  .opts{list-style:none; margin:20px 0 0; padding:0;}
  .opts li{margin-bottom:9px;}
  .opt{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--paper-card); border:1px solid var(--rule); border-radius:3px;
    padding:13px 14px; font-size:15.5px; line-height:1.6; color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover{border-color:var(--ink); background:#F1EADA;}
  .opt .lt{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);
    margin-right:9px;
  }
  .opt.right{border-color:var(--sage); background:var(--sage-soft);}
  .opt.wrong{border-color:var(--crimson); background:#F3E2DE;}
  .opt.dim{opacity:.5;}
  .opt[disabled]{cursor:default;}
  .opt.right .lt, .opt.wrong .lt{color:var(--ink);}

  /* ---------- BACK ---------- */
  .back{padding:20px 22px 22px; margin-bottom:14px;}
  .verdict{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:16px; margin:0 0 14px;
    padding-bottom:12px; border-bottom:1px dashed var(--rule);
  }
  .verdict.ok{color:var(--sage);}
  .verdict.no{color:var(--crimson);}
  .bk-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .bk-word{font-family:'Noto Serif TC',serif; font-weight:700; font-size:22px;}
  .bk-kk{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft);}
  .lvtag{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em;
    border:1px solid var(--rule); border-radius:2px; padding:2px 6px; color:var(--ink-soft);
  }
  .bk-gloss{font-size:14.5px; line-height:1.85; margin:6px 0 0;}
  .bk-sec{margin-top:16px; padding-left:11px; border-left:2px solid var(--sage);}
  .bk-src{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em;
    color:var(--sage); display:block; margin-bottom:4px;
  }
  .bk-src .seg{display:inline-block;}
  .bk-en{font-size:14.5px; line-height:1.8; margin:0 0 3px;}
  .bk-en b{color:var(--crimson);}
  .bk-zh{font-size:13px; color:var(--ink-soft); line-height:1.8; margin:0;}
  .bk-role{
    margin:8px 0 0; font-size:12.5px; color:var(--ink-soft); line-height:1.8;
    background:#F1EADA; border-radius:3px; padding:7px 10px;
  }
  .bk-role b{color:var(--crimson);}
  .bk-col{margin-top:14px; font-size:13px; color:var(--ink-soft); line-height:1.85;}
  .bk-col .lab{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em; color:var(--sage); display:block; margin-bottom:3px;}
  .bk-link{
    display:inline-block; margin-top:14px; font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; color:var(--crimson); text-decoration:underline;
  }
  .act-row{display:flex; gap:10px; align-items:stretch;}
  .act-row .big-btn{flex:1 1 auto;}
  .guess-btn{
    flex:0 0 auto; cursor:pointer; background:transparent; color:var(--ink-soft);
    border:1px solid var(--rule); border-radius:3px; padding:0 16px;
    font-size:13px; font-family:'Noto Sans TC',sans-serif; line-height:1.5;
  }
  .guess-btn:hover{border-color:var(--crimson); color:var(--crimson);}
  .guess-done{
    flex:0 0 auto; display:flex; align-items:center; padding:0 16px;
    font-size:12.5px; color:var(--crimson); border:1px dashed var(--crimson-soft); border-radius:3px;
  }

  /* ---------- DONE ---------- */
  #done .card{padding:26px 24px 24px; margin-bottom:16px;}
  .done-lead{font-family:'Noto Serif TC',serif; font-weight:700; font-size:19px; margin:0 0 12px;}
  .done-stat{font-size:14px; line-height:2; color:var(--ink-soft); margin:0 0 18px;}
  .done-stat b{color:var(--crimson); font-family:'IBM Plex Mono',monospace; font-size:15px;}

  footer.foot{
    margin-top:26px; padding-top:14px; border-top:1px solid var(--rule);
    font-size:12px; color:var(--ink-soft); line-height:1.9;
  }
  footer.foot a{color:var(--crimson);}
  .loading{text-align:center; padding:60px 0; color:var(--ink-soft); font-size:14px;}

  @media (max-width:420px){
    body{padding:20px 12px 60px;}
    .front-word{font-size:28px;}
    .front-zh{font-size:20px;}
    .act-row{flex-wrap:wrap;}
    .guess-btn,.guess-done{width:100%; padding:11px 16px; justify-content:center; text-align:center;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title">單字記憶卡</div>
    <div class="sub">學測 · 指考詞彙題</div>
  </header>

  <div id="loading" class="loading">載入字庫中…</div>

  <!-- ================= HOME ================= -->
  <section id="home" class="hide">
    <div class="card">
      <p class="home-lead">用考過的字複習，不是背字典</p>
      <p class="home-desc">
        每一張卡片的字都真的在學測或指考詞彙題出現過，選項也是當年真正拿來騙人的那三個。
        答對的字會往後推，記不牢的隔天再出現。
      </p>
      <button id="startBtn" class="big-btn">開始複習</button>
      <p id="scopeLine" class="scope-line"></p>

      <div id="homeStat" class="home-stat"></div>

      <div class="minor-row">
        <button id="freeBtn" class="minor-btn">自由練習（不排程）</button>
        <button id="resetBtn" class="minor-btn">清除我的進度</button>
      </div>

      <p class="note">
        進度存在這台裝置的瀏覽器裡，換手機或換電腦不會跟著走，清除瀏覽器資料也會一起消失。
      </p>
    </div>
  </section>

  <!-- ================= QUIZ ================= -->
  <section id="quiz" class="hide">
    <div class="bar">
      <span id="barLeft"></span>
      <button id="quitBtn" class="quit">結束</button>
    </div>
    <div class="track"><span id="trackFill"></span></div>

    <div id="frontCard" class="card qcard">
      <span id="modeTag" class="mode-tag"></span>
      <div id="frontBody"></div>
      <ul id="optList" class="opts"></ul>
    </div>

    <div id="backCard" class="card back hide"></div>
    <div id="actRow" class="act-row hide"></div>
  </section>

  <!-- ================= DONE ================= -->
  <section id="done" class="hide">
    <div class="card">
      <p class="done-lead" id="doneLead"></p>
      <p class="done-stat" id="doneStat"></p>
      <button id="againBtn" class="big-btn">繼續練</button>
      <div class="minor-row">
        <button id="homeBtn" class="minor-btn">回到首頁</button>
      </div>
    </div>
  </section>

  <footer class="foot">
    <a href="../">回題庫首頁</a>　·　
    字源為本站學測 500 題、指考 343 題詞彙題。免費、無廣告之非營利自學題庫。
  </footer>

</div>
<script>
/* 單字記憶卡 · 引擎
   資料：cards_data.json（同資料夾）
   進度：localStorage，鍵 jcee_cards_v1
   排程：簡化 SM-2，只決定「何時再出現」 */
(function () {
  'use strict';

  var STORE_KEY = 'jcee_cards_v1';
  var DEFAULT_Y0 = 106, DEFAULT_Y1 = 115;
  var RELEARN_GAP = 6;      // 答錯的卡片隔幾張後再出現（同一張一再答錯就往後拉更遠）
  var RELEARN_MAX = 24;
  var VAR_MEMORY = 6;       // 每個字記住最近用過的幾種出現方式

  var DATA = null, Q = null, W = null;
  var state = null;         // { v, w:{word:{i,e,d,r,l,vv}}, day, done }
  var scope = null;         // { y0, y1, st, lv, label, free }
  var session = null;

  /* ---------------- 小工具 ---------------- */
  function $(id) { return document.getElementById(id); }
  function show(id) { $(id).classList.remove('hide'); }
  function hide(id) { $(id).classList.add('hide'); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function today() {
    var d = new Date();
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  /* ---------------- 進度存取 ---------------- */
  function loadState() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { s = null; }
    if (!s || s.v !== 1 || typeof s.w !== 'object' || !s.w) s = { v: 1, w: {}, day: today(), done: 0 };
    if (s.day !== today()) { s.day = today(); s.done = 0; }
    return s;
  }
  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 無痕模式等，略過 */ }
  }

  /* ---------------- 範圍參數 ---------------- */
  function parseScope() {
    var raw = '';
    try { raw = decodeURIComponent((location.hash || '').replace(/^#/, '')); } catch (e) { raw = (location.hash || '').replace(/^#/, ''); }
    var p = {};
    raw.split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) p[kv.slice(0, i).trim()] = kv.slice(i + 1).trim();
    });

    var y0 = DEFAULT_Y0, y1 = DEFAULT_Y1;
    if (p.y) {
      var m = p.y.match(/^(\d{2,3})\s*(?:[-–~]\s*(\d{2,3}))?$/);
      if (m) { y0 = +m[1]; y1 = m[2] ? +m[2] : +m[1]; if (y0 > y1) { var t = y0; y0 = y1; y1 = t; } }
    }
    var st = (p.st === 'gsat' || p.st === 'zhikao') ? p.st : 'both';

    var lv = null;                       // null = 全部字級
    if (p.lv) {
      lv = { n: {}, p: false, x: false };
      p.lv.split(',').forEach(function (tok) {
        tok = tok.trim();
        if (tok === 'p' || tok === '片語') { lv.p = true; return; }
        if (tok === 'x' || tok === '超綱') { lv.x = true; return; }
        var m2 = tok.match(/^([1-6])\s*(?:[-–~]\s*([1-6]))?$/);
        if (m2) {
          var a = +m2[1], b = m2[2] ? +m2[2] : +m2[1];
          if (a > b) { var t2 = a; a = b; b = t2; }
          for (var i = a; i <= b; i++) lv.n[i] = true;
        }
      });
      var any = lv.p || lv.x || Object.keys(lv.n).length;
      if (!any) lv = null;
    }

    return {
      y0: y0, y1: y1, st: st, lv: lv,
      label: p.t || '',
      free: p.mode === 'free',
      custom: !!(p.y || p.st || p.lv)
    };
  }

  function scopeText() {
    var parts = [];
    parts.push(scope.y0 === scope.y1 ? (scope.y0 + ' 年') : (scope.y0 + '–' + scope.y1 + ' 年'));
    parts.push(scope.st === 'gsat' ? '學測' : scope.st === 'zhikao' ? '指考' : '學測＋指考');
    if (scope.lv) {
      var ns = Object.keys(scope.lv.n).map(Number).sort(function (a, b) { return a - b; });
      var seg = [];
      if (ns.length) seg.push(ns.length === 1 ? (ns[0] + ' 級') : (ns[0] + '–' + ns[ns.length - 1] + ' 級'));
      if (scope.lv.p) seg.push('片語');
      if (scope.lv.x) seg.push('超綱');
      parts.push(seg.join('、'));
    }
    return parts.join('　·　');
  }

  /* ---------------- 選字 ---------------- */
  function inRange(qid) {
    var q = Q[qid];
    if (!q) return false;
    if (q.y < scope.y0 || q.y > scope.y1) return false;
    if (scope.st !== 'both' && q.st !== scope.st) return false;
    return true;
  }
  function lvOK(w) {
    if (!scope.lv) return true;
    if (w.kd === '片語') return !!scope.lv.p;
    if (w.kd === '超綱') return !!scope.lv.x;
    return !!(w.lv && scope.lv.n[+w.lv]);
  }
  function buildPool() {
    var pool = [];
    for (var k in W) {
      var w = W[k];
      if (!w.c || !lvOK(w)) continue;
      var hit = false;
      for (var i = 0; i < w.oc.length; i++) { if (inRange(w.oc[i][0])) { hit = true; break; } }
      if (hit) pool.push(k);
    }
    // 新字排序：考過越多次的排前面，其次是年份越近的排前面
    pool.sort(function (a, b) {
      var d = W[b].oc.length - W[a].oc.length;
      if (d) return d;
      var ya = Math.max.apply(null, W[a].oc.map(function (o) { return Q[o[0]].y; }));
      var yb = Math.max.apply(null, W[b].oc.map(function (o) { return Q[o[0]].y; }));
      if (yb !== ya) return yb - ya;
      return a < b ? -1 : 1;
    });
    return pool;
  }

  /* ---------------- 出現方式 ---------------- */
  // 回傳這個字在目前範圍內所有可用的出現方式
  function variantsOf(word) {
    var w = W[word], out = [];
    w.oc.forEach(function (o) {
      var qid = o[0];
      if (!inRange(qid)) return;
      if (Q[qid].ez !== 0) out.push('e|' + qid);
      out.push('z|' + qid);
    });
    (w.fr || []).forEach(function (f, i) {
      if (inRange(f[1])) out.push('f|' + f[1] + '|' + i);
    });
    if (w.fm && w.fm.length >= 3) out.push('m|');
    return out;
  }
  // 挑一個最久沒用過的出現方式
  function chooseVariant(word) {
    var vs = variantsOf(word);
    if (!vs.length) return null;
    var used = (state.w[word] && state.w[word].vv) || [];
    var fresh = vs.filter(function (v) { return used.indexOf(v) === -1; });
    if (fresh.length) return pick(fresh);
    var best = vs[0], bestPos = 1e9;
    vs.forEach(function (v) {
      var p = used.indexOf(v);
      if (p < bestPos) { bestPos = p; best = v; }
    });
    return best;
  }
  function rememberVariant(word, v) {
    var s = state.w[word];
    if (!s) return;
    s.vv = (s.vv || []).filter(function (x) { return x !== v; });
    s.vv.push(v);
    if (s.vv.length > VAR_MEMORY) s.vv = s.vv.slice(-VAR_MEMORY);
  }

  /* ---------------- 排程（簡化 SM-2） ---------------- */
  function grade(word, ok) {
    var s = state.w[word];
    if (!s) s = state.w[word] = { i: 0, e: 2.5, d: today(), r: 0, l: 0, vv: [] };
    if (ok) {
      s.r = (s.r || 0) + 1;
      s.i = s.r === 1 ? 1 : s.r === 2 ? 3 : Math.round(s.i * s.e);
      if (s.i > 365) s.i = 365;
      s.e = Math.min(2.8, (s.e || 2.5) + 0.05);
    } else {
      s.l = (s.l || 0) + 1;
      s.r = 0;
      s.i = 0;
      s.e = Math.max(1.3, (s.e || 2.5) - 0.2);
    }
    s.d = today() + s.i;
    return s;
  }

  /* ---------------- 開始一輪 ---------------- */
  function startSession(free) {
    var pool = buildPool();
    var t = today(), due = [], fresh = [];
    pool.forEach(function (k) {
      var s = state.w[k];
      if (!s) fresh.push(k);
      else if (s.d <= t) due.push(k);
    });
    due.sort(function (a, b) { return state.w[a].d - state.w[b].d; });

    var queue;
    if (free) {
      queue = shuffle(pool.slice());
    } else {
      queue = due.concat(fresh);
    }
    if (!queue.length) { renderDone(free, 0, 0, pool); return; }

    session = {
      free: !!free, queue: queue, at: 0,
      total: queue.length, answered: 0, right: 0,
      newSeen: 0, pool: pool, current: null, miss: {}
    };
    hide('home'); hide('done'); show('quiz');
    nextCard();
  }

  function nextCard() {
    if (session.at >= session.queue.length) {
      hide('quiz');
      renderDone(session.free, session.answered, session.right, session.pool);
      return;
    }
    var word = session.queue[session.at];
    var v = chooseVariant(word);
    if (!v) { session.at++; nextCard(); return; }
    session.current = { word: word, variant: v, isNew: !state.w[word], graded: false, ok: null };
    renderFront();
  }

  /* ---------------- 畫卡片正面 ---------------- */
  var MODE_LABEL = {
    e: '英文 → 中文',
    z: '中文 → 英文',
    f: '搭配詞填空',
    m: '形近字辨識'
  };

  function frameHTML(txt) {
    return esc(txt).replace(/_{2,}/g, '<u>______</u>');
  }

  function renderFront() {
    var c = session.current, word = c.word, w = W[word];
    var kind = c.variant.charAt(0);
    var parts = c.variant.split('|');
    var qid = parts[1] || null;

    $('modeTag').textContent = MODE_LABEL[kind];

    var body = '', opts = [], correct = '';

    if (kind === 'e') {
      var q = Q[qid], L = letterOf(word, qid);
      body = '<p class="front-word">' + esc(displayWord(word, qid)) + '</p>' +
             metaLine(w);
      opts = lettersOf(q).map(function (x) { return { key: x, text: q.gs[x] }; });
      correct = L;
    } else if (kind === 'z') {
      var q2 = Q[qid], L2 = letterOf(word, qid);
      body = '<p class="front-zh">' + esc(q2.gs[L2]) + '</p>' +
             '<p class="front-hint">四個選項都是這一題當年的原選項。</p>';
      opts = lettersOf(q2).map(function (x) { return { key: x, text: q2.o[x] }; });
      correct = L2;
    } else if (kind === 'f') {
      var q3 = Q[qid], L3 = letterOf(word, qid);
      var fr = w.fr[+parts[2]];
      body = '<p class="front-frame">' + frameHTML(fr[0]) + '</p>' +
             '<p class="front-hint">出自 ' + esc(yearTag(qid)) + ' 的原題，四個選項是當年的原選項。</p>';
      opts = lettersOf(q3).map(function (x) { return { key: x, text: q3.o[x] }; });
      correct = L3;
    } else { // m 形近字
      var first = primaryOcc(word);
      body = '<p class="front-zh">' + esc(Q[first[0]].gs[first[1]]) + '</p>' +
             '<p class="front-hint">四個拼法相近的字都在本站考過，選出符合上面意思的那一個。</p>';
      var cand = [{ key: '*', text: word }];
      w.fm.slice(0, 3).forEach(function (p, i) { cand.push({ key: 'x' + i, text: p }); });
      opts = cand;
      correct = '*';
    }

    $('frontBody').innerHTML = body;

    var shuffled = shuffle(opts.slice());
    var LT = ['A', 'B', 'C', 'D', 'E'];
    var ul = $('optList');
    ul.innerHTML = '';
    shuffled.forEach(function (o, i) {
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.className = 'opt';
      btn.type = 'button';
      btn.setAttribute('data-key', o.key);
      btn.innerHTML = '<span class="lt">' + LT[i] + '</span>' + esc(o.text);
      btn.addEventListener('click', function () { answer(o.key, correct); });
      li.appendChild(btn);
      ul.appendChild(li);
    });

    hide('backCard'); hide('actRow');
    $('frontCard').classList.remove('hide');
    updateBar();
    window.scrollTo(0, 0);
  }

  // 挑一筆代表性的出現紀錄：範圍內、而且這個字是正解的優先，例句才會有這個字
  function primaryOcc(word) {
    var oc = W[word].oc, i;
    for (i = 0; i < oc.length; i++) if (inRange(oc[i][0]) && oc[i][1] === Q[oc[i][0]].a) return oc[i];
    for (i = 0; i < oc.length; i++) if (inRange(oc[i][0])) return oc[i];
    for (i = 0; i < oc.length; i++) if (oc[i][1] === Q[oc[i][0]].a) return oc[i];
    return oc[0];
  }
  function letterOf(word, qid) {
    var oc = W[word].oc;
    for (var i = 0; i < oc.length; i++) if (oc[i][0] === qid) return oc[i][1];
    return null;
  }
  function lettersOf(q) { return Object.keys(q.o); }
  function displayWord(word, qid) {
    // 用原題選項的大小寫，例如句首的 Regardless of
    var L = letterOf(word, qid);
    return (qid && L && Q[qid].o[L]) ? Q[qid].o[L] : word;
  }
  function yearTag(qid) {
    var q = Q[qid];
    return q.y + ' ' + q.t;
  }
  function metaLine(w) {
    if (!w.pos) return '';
    return '<p class="front-meta"><span class="pos">' + esc(w.pos) + '</span></p>';
  }

  /* ---------------- 作答 ---------------- */
  function answer(chosen, correct) {
    var c = session.current;
    if (c.graded) return;
    c.graded = true;
    c.ok = (chosen === correct);

    var btns = $('optList').querySelectorAll('.opt');
    Array.prototype.forEach.call(btns, function (b) {
      var k = b.getAttribute('data-key');
      b.disabled = true;
      if (k === correct) b.classList.add('right');
      else if (k === chosen) b.classList.add('wrong');
      else b.classList.add('dim');
    });

    session.answered++;
    if (c.ok) session.right++;
    if (c.isNew) session.newSeen++;

    if (!session.free) {
      grade(c.word, c.ok);
      rememberVariant(c.word, c.variant);
      state.done = (state.done || 0) + 1;
      saveState();
    }
    if (!c.ok) requeue(c.word);

    renderBack();
  }

  // 答錯的字排回佇列。同一個字在這一輪錯越多次，就排得越後面，
  // 免得幾個難字一直輪迴、後面的新字都輪不到。
  function requeue(word) {
    session.miss[word] = (session.miss[word] || 0) + 1;
    var gap = Math.min(RELEARN_GAP * session.miss[word], RELEARN_MAX);
    var q = session.queue;
    var pos = Math.min(session.at + 1 + gap, q.length);
    q.splice(pos, 0, word);
    session.total = q.length;
  }

  function markGuessed() {
    var c = session.current;
    if (session.free) { requeue(c.word); }
    else {
      grade(c.word, false);
      saveState();
      requeue(c.word);
    }
    var row = $('actRow');
    row.innerHTML = '';
    var b = document.createElement('button');
    b.className = 'big-btn'; b.type = 'button'; b.textContent = '下一張';
    b.addEventListener('click', advance);
    var d = document.createElement('div');
    d.className = 'guess-done'; d.textContent = '已記為猜的，等一下會再出現';
    row.appendChild(b); row.appendChild(d);
    updateBar();
  }

  function advance() {
    session.at++;
    nextCard();
  }

  /* ---------------- 畫卡片背面 ---------------- */
  function renderBack() {
    var c = session.current, word = c.word, w = W[word];
    var parts = c.variant.split('|');
    var qid = parts[1] || primaryOcc(word)[0];
    var L = letterOf(word, qid);
    var q = Q[qid];

    var h = '';
    h += '<p class="verdict ' + (c.ok ? 'ok' : 'no') + '">' + (c.ok ? '答對了' : '答錯了') + '</p>';

    h += '<div class="bk-head">';
    h += '<span class="bk-word">' + esc(displayWord(word, qid)) + '</span>';
    if (w.kk) h += '<span class="bk-kk">[' + esc(w.kk) + ']</span>';
    h += '<span class="lvtag">' + esc(levelText(w)) + '</span>';
    h += '</div>';
    h += '<p class="bk-gloss">' + esc(q.g[L]) + '</p>';

    // 例句
    h += '<div class="bk-sec">';
    h += '<span class="bk-src"><span class="seg">' + esc(q.y + ' ' + q.t) + '</span>　<span class="seg">第 ' + q.n + ' 題</span></span>';
    h += '<p class="bk-en">' + stemHTML(q) + '</p>';
    if (q.sz) h += '<p class="bk-zh">' + esc(q.sz) + '</p>';
    if (L !== q.a) {
      h += '<p class="bk-role">這一題的正解是 <b>' + esc(q.o[q.a]) + '</b>，' +
           esc(displayWord(word, qid)) + ' 是當年的誘答，所以句子裡看不到它。</p>';
    }
    h += '</div>';

    if (q.col) {
      h += '<div class="bk-col"><span class="lab">字詞搭配</span>' + esc(q.col) + '</div>';
    }

    h += '<a class="bk-link" href="' + (q.st === 'gsat' ? '../gsat/' : '../zhikao/') +
         '#set-' + encodeURIComponent(q.id || qid) + '|單字記憶卡" target="_blank" rel="noopener">看原題與完整解析 →</a>';

    $('backCard').innerHTML = h;
    show('backCard');

    var row = $('actRow');
    row.innerHTML = '';
    var b = document.createElement('button');
    b.className = 'big-btn'; b.type = 'button'; b.textContent = '下一張';
    b.addEventListener('click', advance);
    row.appendChild(b);
    if (c.ok) {
      var g = document.createElement('button');
      g.className = 'guess-btn'; g.type = 'button'; g.textContent = '剛才是猜的';
      g.addEventListener('click', markGuessed);
      row.appendChild(g);
    }
    show('actRow');
    updateBar();
  }

  function stemHTML(q) {
    var ans = q.o[q.a];
    var s = esc(q.s);
    var re = /_{3,}/;
    if (re.test(s)) return s.replace(re, ' <b>' + esc(ans) + '</b> ').replace(/\s+([,.;!?])/g, '$1');
    return s + '（正解 <b>' + esc(ans) + '</b>）';
  }

  function levelText(w) {
    if (w.kd === '片語') return '片語';
    if (w.kd === '超綱') return '超出詞彙表';
    if (w.kd === '衍生' && w.fam) return w.lv + ' 級 · 源自 ' + w.fam;
    return w.lv ? (w.lv + ' 級') : '未標級';
  }

  /* ---------------- 進度列 ---------------- */
  function updateBar() {
    var left = session.queue.length - session.at;
    var acc = session.answered ? Math.round(session.right / session.answered * 100) : 0;
    $('barLeft').textContent = '剩 ' + left + ' 張　·　已做 ' + session.answered +
      (session.answered ? '　·　答對 ' + acc + '%' : '') + (session.free ? '　·　自由練習' : '');
    var pct = session.queue.length ? (session.at / session.queue.length * 100) : 0;
    $('trackFill').style.width = pct.toFixed(1) + '%';
  }

  /* ---------------- 結束畫面 ---------------- */
  function renderDone(free, answered, right, pool) {
    var t = today(), dueLater = [], nextDay = null, learned = 0;
    pool.forEach(function (k) {
      var s = state.w[k];
      if (!s) return;
      learned++;
      if (s.d > t) { dueLater.push(s.d); if (nextDay === null || s.d < nextDay) nextDay = s.d; }
    });
    var newLeft = pool.filter(function (k) { return !state.w[k]; }).length;

    var lead, stat = '';
    if (answered === 0) {
      lead = '今天沒有到期的字';
      stat += '這個範圍裡的 <b>' + pool.length + '</b> 個字，你已經看過 <b>' + learned + '</b> 個。';
      if (newLeft) stat += '<br>還有 <b>' + newLeft + '</b> 個新字沒開始。';
    } else {
      lead = free ? '這一輪練完了' : '今天這一輪做完了';
      stat += '做了 <b>' + answered + '</b> 張，答對 <b>' + Math.round(right / answered * 100) + '</b>%。';
      if (!free) {
        stat += '<br>這個範圍累計看過 <b>' + learned + '</b> 個字，還有 <b>' + newLeft + '</b> 個新字沒開始。';
      }
    }
    if (nextDay !== null) {
      var days = nextDay - t;
      stat += '<br>下一批到期是' + (days <= 0 ? '現在' : days === 1 ? '明天' : (days + ' 天後'));
      stat += '，共 ' + dueLater.filter(function (d) { return d === nextDay; }).length + ' 個字。';
    }
    $('doneLead').textContent = lead;
    $('doneStat').innerHTML = stat;
    $('againBtn').textContent = (answered === 0 && newLeft === 0) ? '自由練習' : '繼續練';
    hide('quiz'); hide('home'); show('done');
    window.scrollTo(0, 0);
  }

  /* ---------------- 首頁 ---------------- */
  function renderHome() {
    var pool = buildPool();
    var t = today(), due = 0, fresh = 0, learned = 0;
    pool.forEach(function (k) {
      var s = state.w[k];
      if (!s) { fresh++; return; }
      learned++;
      if (s.d <= t) due++;
    });
    $('scopeLine').textContent = (scope.label ? scope.label + '　·　' : '') + scopeText() +
      '　·　' + pool.length + ' 字';

    var h = '';
    if (!learned) {
      h += '這個範圍有 <b>' + pool.length + '</b> 個字，全部還沒開始。';
    } else {
      h += '今天到期 <b>' + due + '</b> 個字';
      h += '，沒開始過的還有 <b>' + fresh + '</b> 個。';
      h += '<br>累計已經看過 <b>' + learned + '</b> 個字。';
    }
    $('homeStat').innerHTML = h;
    $('startBtn').disabled = pool.length === 0;
    if (pool.length === 0) $('startBtn').textContent = '這個範圍沒有字';
    hide('quiz'); hide('done'); show('home');
  }

  /* ---------------- 啟動 ---------------- */
  function boot(data) {
    DATA = data; Q = data.q; W = data.w;
    // 補上 id 欄位，背面連結要用
    for (var k in Q) Q[k].id = k;
    state = loadState();
    scope = parseScope();
    hide('loading');
    if (scope.free) { startSession(true); return; }
    renderHome();
  }

  function wire() {
    $('startBtn').addEventListener('click', function () { startSession(false); });
    $('freeBtn').addEventListener('click', function () { startSession(true); });
    $('quitBtn').addEventListener('click', function () {
      hide('quiz');
      renderDone(session.free, session.answered, session.right, session.pool);
    });
    $('againBtn').addEventListener('click', function () {
      var pool = buildPool(), t = today();
      var hasWork = pool.some(function (k) { var s = state.w[k]; return !s || s.d <= t; });
      startSession(!hasWork);
    });
    $('homeBtn').addEventListener('click', renderHome);
    $('resetBtn').addEventListener('click', function () {
      if (!window.confirm('確定要清除這台裝置上的所有複習進度嗎？清掉之後所有的字都會變回新字。')) return;
      state = { v: 1, w: {}, day: today(), done: 0 };
      saveState();
      renderHome();
    });
    window.addEventListener('hashchange', function () {
      scope = parseScope();
      renderHome();
    });
  }

  function init() {
    wire();
    fetch('cards_data.json', { cache: 'default' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(boot)
      .catch(function (e) {
        $('loading').textContent = '字庫載入失敗，請重新整理頁面試試。';
      });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  // 測試用
  window.__cards = {
    get state() { return state; },
    get scope() { return scope; },
    get session() { return session; },
    buildPool: buildPool, variantsOf: variantsOf, today: today,
    setState: function (s) { state = s; }, saveState: saveState, grade: grade
  };
})();
</script>
</body>
</html>
