  .gloss b.gt{color:inherit;margin:0}

  .blank.swap.done{background:var(--okbg);border-bottom:2px solid var(--ok)}

  .src{font-size:12.5px;color:var(--sub);margin-top:6px}
  .acts{display:flex;gap:8px;margin-top:10px}
  .act{font:inherit;font-size:15px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer;min-height:44px}

  .reset.warn{background:var(--badbg);border-color:var(--bad);color:var(--bad)}

  .cand{display:inline;border-bottom:2px dashed var(--acc);background:rgba(47,111,94,.12);padding:0 2px;border-radius:4px 4px 0 0;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;-webkit-tap-highlight-color:transparent}

  .zh{margin-top:10px;font-size:15px;line-height:1.8;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .zh summary{cursor:pointer;color:var(--acc);font-weight:600;padding:8px 0}
  .zh.lock{color:var(--sub);font-size:14px}

6:{gloss:"procession 遶境　pilgrimage 進香　sedan chair 轎　goddess 女神　fork 岔路　moon blocks 筊杯　crescent-shaped 新月形的　timetable 時間表",zh:"每年春天，數十萬人跟在一頂粉紅色的轎子後面，走過台灣西部。因為它走得很快，又罩著粉紅色的轎罩，人們叫它「粉紅超跑」。這頂轎子載著海上女神媽祖，從苗栗拱天宮前往雲林朝天宮。多數媽祖遶境都有事先規劃好的路線，白沙屯的遶境卻沒有。每到岔路，扛轎的人就擲筊杯，也就是一對新月形的木片，請問媽祖該往哪走。這裡也沒有時間表。因此，沒有人能預先確切說出轎子什麼時候會到。即使如此，2026 年仍有創紀錄的約 46 萬人報名這趟為期八天的進香。",exp:{
1:{"by contrast":"however 在這裡表示對比：多數遶境有路線，白沙屯卻沒有。by contrast 功能相同。",likewise:"likewise：同樣地，表示相似，不是對比。","for instance":"for instance：舉例。",consequently:"consequently：因此，表示結果。"},
2:{"in other words":"that is 用來把同一件事換個說法，這裡把 moon blocks 解釋成一對木片，in other words 功能相同。","in addition":"in addition：此外，是追加另一件事。",afterward:"afterward：之後，表示時間先後。",similarly:"similarly：類似地。"},
3:{therefore:"As a result 表示結果，前面沒有時間表，所以沒人知道何時抵達。therefore 功能相同。","on the contrary":"on the contrary：恰恰相反，用來推翻前面的說法。",besides:"besides：此外，只是追加。",otherwise:"otherwise：否則，要接「如果不這樣」的情況。"},
4:{nonetheless:"Even so 表示儘管如此。前面說時間不確定，人還是創紀錄地報名。nonetheless 功能相同。",moreover:"moreover：而且，是追加。",instead:"instead：反而、取而代之。",meanwhile:"meanwhile：同時。"}}},
7:{gloss:"urinal 小便斗　etched 蝕刻的　aim 瞄準　spillage 濺出　estimate 估計　knock 敲門　opaque 不透明的",zh:"很少有人覺得公共廁所很有意思，但有兩個地方試著改變這個印象。在荷蘭阿姆斯特丹的史基浦機場，小便斗裡蝕刻了一隻蒼蠅的圖案，讓男士有個瞄準的目標。引進這個做法的經理阿德．基布姆（Aad Kieboom）說，它讓濺出的尿液減少了 80%。不過，他其實也承認，這個數字只是估計，從來沒有做過科學研究。同一時間，在東京，日本財團推動的一項計畫在澀谷重建了 17 間公共廁所。其中有些相當特別。例如，建築師坂茂設計了兩間廁所，鎖上門之後，玻璃牆會變成不透明。裡面沒有人的時候，玻璃是透明的，大家可以看出這間廁所乾淨又沒人使用。因此，他們不需要敲門，也不必猜。基金會表示，這項計畫的目標，是要改變大家認為公共廁所又暗、又髒、又臭、又可怕的想法。",exp:{
1:{actually:"In fact 引出實際的情況，和前一句的說法有落差。actually 功能相同。",otherwise:"otherwise：否則。","in short":"in short：簡言之，用來作結。",likewise:"likewise：同樣地。"},
2:{"at the same time":"Meanwhile 表示另一個地方同時進行的事，at the same time 功能相同。","in the end":"in the end：最後。","in particular":"in particular：特別是。","in other words":"in other words：換句話說，用來重述前面的話，不是同時發生。"},
3:{"for example":"For instance 用來舉例，for example 功能相同。","on the other hand":"on the other hand：另一方面，表示對比。","in conclusion":"in conclusion：總結。",instead:"instead：反而。"},
4:{"as a result":"Thus 表示結果：玻璃會顯示有沒有人，所以不用敲門。as a result 功能相同。","in contrast":"in contrast：對比。",besides:"besides：此外。",nonetheless:"nonetheless：儘管如此。"}}},
8:{gloss:"roundabout 圓環　clockwise 順時針的　give way 讓路　gap 空隙　counterclockwise 逆時針的　junction 路口　panic 驚慌",zh:"在英國，車輛靠左行駛，所以圓環的車流是順時針方向。主要規則很簡單：讓已經在圓環上的車輛先行，也就是讓從你右邊來的車先走。斯文頓（Swindon）的魔法圓環啟用於 1972 年，看起來複雜多了。它有五個小圓環圍成一圈，中間還有一個中央圓環，而中央圓環是逆時針方向，與外圍五個相反。的確，第一次來的駕駛看到它可能會慌張。不過，規則並沒有改變：把每個小圓環當成一個獨立路口，讓右邊的車先行。在每一個小圓環，必要時要停車，等到有空隙再走。如果錯過了出口，只要再繞一圈就好。",exp:{
1:{"to say the same thing in other words":"that is 用另一種說法重述，這裡把「已在圓環上的車」說成「從你右邊來的車」。","to give a result":"表示結果用 so、as a result。","to show a contrast":"表示對比用 but、however。","to list another case":"另舉一例用 also、in addition。"},
2:{"to admit a point before arguing against it":"To be sure 先承認一個事實（確實會慌張），後面通常接 but、still 轉折。","to add a similar fact":"追加相似的事實用 likewise、similarly。","to sum up":"總結用 in short、to sum up。","to give a reason":"說明理由用 because、since。"},
3:{"to say something is still true despite that":"Still 在這裡等於 nevertheless：雖然看起來很複雜，規則仍然不變。","to show the order in time":"表示時間先後用 then、afterward。","to give an example":"舉例用 for example。","to restate the idea":"重述用 in other words。"}
,4:{"when you have to":"if necessary 是 if it is necessary 的省略，意思是「必要的時候」。","even when you do not have to":"和 if necessary 的意思矛盾。","only when you want to":"necessary 是不得不，不是想不想。","unless you have to":"unless 是「除非」，意思剛好相反。"}}},
9:{gloss:"raid 突襲　watchman 守望的人　bandit 土匪　lantern 燈籠　flame 火焰　rice paper 宣紙　ban 禁令　break down 分解",zh:"很久以前，土匪經常突襲平溪山區的村莊。大多數村民跑進山裡躲起來，但有幾位守望的人留了下來。危險過去之後，他們放天燈到夜空中，通知各家人可以安心回家了。如今，平溪是台灣唯一可以施放天燈的地方，因此每年元宵節都有成千上萬的遊客前往。火焰熄滅之後，天燈會掉回山上。這就是為什麼政府鼓勵使用比較容易分解的材料，例如宣紙和竹子。有些村民認為應該禁止施放，但店家不這麼認為，因為他們擔心當地經濟會受影響。",exp:{
1:{a:"bandits（土匪）是來突襲的人，不會放天燈通知家人平安。",b:"Most villagers 跑進山裡躲起來了，留下來放天燈的不是他們。",c:"a few watchmen 留了下來，危險過後放天燈通知家人，所以 they 指他們。",d:"the families 是被通知的對象，不是放天燈的人。"},
2:{e:"Taiwan：同一句的前半只是說平溪是台灣唯一能放天燈的地方，遊客要去的是平溪，不是整個台灣。",f:"Pingxi：travel there 就是前往平溪。",g:"the mountains：出現在過去的故事裡，是村民躲藏的地方，不是今天遊客去的地點。",h:"the villages：同樣是過去被突襲的村莊，不是今天遊客的目的地。"},
3:{i:"the lanterns fall back onto the mountains：天燈掉回山上造成垃圾，這就是政府鼓勵易分解材料的原因，所以 This 指這件事。",r:"the flame goes out：只是掉下來之前的時間點，造成問題的是天燈掉在山上。",p:"rice paper and bamboo：這是後面說的解決辦法，不是原因。",z:"lanterns：只指天燈這種東西，不能解釋為什麼要改用易分解的材料。"},
4:{i:"the lanterns fall back onto the mountains：店家沒有否認這件事，不同意的是要不要禁止。",j:"Some villagers：是人。so 在 do not think so 裡代替一個想法，不代替人。",k:"the lanterns should be banned：do not think so 就是不認為應該禁止，so 代替的是這個想法。",l:"shop owners：是這句的主詞，so 不能代替句子的主詞。"}}},
10:{gloss:"Kew Gardens 邱園（英國皇家植物園）　shipment 貨物　specimen 標本　fortune 巨額財富　sprout 發芽　descendant 後代　plantation 大型農場　internship 實習",zh:"1876 年 6 月，一批貨物抵達倫敦的邱園（Kew Gardens）：7 萬顆從巴西運來的橡膠種子，出口文件上寫的是「學術標本」。橡膠當時非常值錢。而且，當時幾乎所有橡膠都由巴西供應。這些種子不能等，因為它們幾天內就會失去發芽的能力。結果，發芽的不到 4%。儘管如此，8 月仍有約 2,000 株幼苗運往錫蘭，它們的後代協助開創了東南亞的橡膠園。直到今天，邱園仍在研究植物如何影響經濟與社會。2027 年，邱園將再次提供實習機會給台灣的年輕人，四個名額中有一個是關於植物館藏的專案。",exp:{
1:{"to add one more point":"What is more 用來再追加一個更進一步的論點：橡膠很值錢，而且幾乎都由巴西供應。","to give an example":"舉例用 for example、for instance。","to restate the idea":"重述用 in other words。","to show the time order":"表示時間先後用 then、afterward。"},
2:{"to tell what actually happened in the end":"As it turned out 引出事情最後實際的結果：種子只有不到 4% 發芽。","to give a reason":"說明理由用 because、since。","to add a similar fact":"追加相似的事實用 likewise、similarly。","to sum up":"總結用 in short、to sum up。"},
3:{"to say something is still true despite that":"All the same 等於 nevertheless：發芽率那麼低，還是運了約 2,000 株幼苗到錫蘭。","to explain more exactly":"說得更精確用 or rather、that is。","to list another case":"另舉一例用 also、in addition。","to start a new topic":"轉到新話題用 by the way。"},
4:{"even now":"To this day 表示從過去一直到現在，所以是「直到今天」。","only in the past":"意思相反：to this day 說的是到現在仍然如此。","for the first time":"to this day 沒有「第一次」的意思。","on that day only":"this day 指現在，不是指某個特定的一天。"}}},
11:{gloss:"pressed tea 緊壓茶　Pu'er 普洱茶　Hakka 客家　remedy 療方　hutou orange 虎頭柑　peel 果皮　steam 蒸　compound 化合物　mellow 溫潤的",zh:"普洱可能是最有名的緊壓茶，但台灣也有自己的一款：客家酸柑茶。根據《台灣光華》雜誌，它是台灣獨有的緊壓茶。很久以前，住在山區的客家家庭把它放在家裡，當作治感冒的偏方。它是用虎頭柑的果皮和茶葉做成的，要蒸過再放在太陽下曬，一共九次。這道工序很費時，卻改變了茶的風味。研究人員發現，果皮裡兩種有效成分會流失七到九成，但茶的味道變得溫潤。因此，連討厭濃茶的人也可能喜歡喝上一杯。",exp:{
1:{treatment:"treatment：治療的方法，和 remedy 同義。",reward:"reward：獎賞，和治病無關。",habit:"habit：習慣。",protection:"protection：保護、防護，重點在預防；remedy 是生病之後用的療方。"},
2:{quick:"quick：快的，是 slow 的反義字。",careful:"careful：仔細的，講的是做事態度，和速度無關。",skilled:"skilled：技術熟練的。",tiring:"tiring：累人的，講的是感受，不是速度。"},
3:{smooth:"smooth：滑順、不刺激的，和 mellow 同義。",sharp:"sharp：尖銳、刺激的，意思相反。",sudden:"sudden：突然的，不能形容味道。",heavy:"heavy：濃重的，和溫潤相反。"},
4:{love:"love：喜愛，是 hate 的反義字。",avoid:"avoid：避開，是討厭的人可能會做的事，但不是 hate 的反義字。",fear:"fear：害怕，和 hate 的方向相同。",forget:"forget：忘記，和喜不喜歡無關。"}}},
12:{gloss:"freezer 冷凍櫃　technician 技術人員　apparently 看來、似乎　defrost 除霜　default password 預設密碼　criminal investigation 刑事調查　claim responsibility 宣稱是自己做的",zh:"多數顧客以為，超市的冷凍櫃只是一個會自己運作的冷箱子。其實，很多冷凍櫃都連上了網路，技術人員可以從遠端檢查並調整設定。11 月 2 日，看來駭客就是利用了這條連線。歐洲好幾個國家的商店發現，他們的冷凍櫃不但沒有降溫，反而愈來愈熱。在其中一家店，溫度設定升到了 50°C。店員只好把冷凍食品丟掉。報導說，這些機器被切換成了除霜模式。冷凍櫃的製造商把問題歸咎於過時的軟體，在某些案例中還有預設密碼。比利時已經展開刑事調查，但沒有人宣稱是自己做的。",exp:{
1:{suppose:"suppose：以為、推想，和 assume 同義。",prove:"prove：證明，是有證據的，不是以為。",decide:"decide：決定。",demand:"demand：要求。"},
2:{distant:"distant：遙遠的，和 remote 在這裡同義。",hidden:"hidden：隱藏的，遠不等於藏起來。",narrow:"narrow：狹窄的。",private:"private：私人的，講的是誰能使用，不是距離。"},
3:{rose:"rose：上升，和 climbed 同義。",dropped:"dropped：下降，方向相反。",sank:"sank：下沉，方向相反。",slid:"slid：滑動，多半指往下滑，用在溫度設定不自然。"},
4:{discard:"discard：丟棄，和 throw out 同義。",collect:"collect：收集，和丟掉相反。",protect:"protect：保護。",deliver:"deliver：運送。"},
5:{modern:"modern：現代的、新式的，是 outdated 的反義字。",costly:"costly：昂貴的，與新舊無關。",foreign:"foreign：外國的。",simple:"simple：簡單的。"}}},
13:{gloss:"vault 金庫　share certificate 股票　paperless 無紙化的　tile 花磚（磁磚）　restored 修復過的　raised pattern 浮雕花紋",zh:"台灣並不是每間博物館都展示畫作。台北的台灣股票博物館原本是存放紙本股票的金庫。交易改成無紙化之後，這個金庫就不再被當作金庫使用，於是在 2012 年改成了博物館。畢竟，空的金庫很適合保存舊文件。在嘉義，台灣花磚博物館展出約 1,500 片修復過的、有浮雕花紋的花磚，特別是約一世紀前台灣住家使用的那些。說來令人意外，歷史學者 Kang Nuo-xi 指出，台灣沒有生產這類磁磚的歷史：展出的幾乎全是 1915 年到 1935 年間在日本製造的。",exp:{
1:{"as a vault":"as such 的意思是「以那樣的身分」，指剛提到的金庫，所以是不再被當作金庫使用。","as a museum":"museum 是後來才變成的，不是 as such 指的對象。","as a bank":"文中說的是 vault，不是銀行。","as an office":"文中沒有提到辦公室。"},
2:{"to give a reason that explains the last point":"After all 提出一個理由，說明為什麼前一句合理：空的金庫本來就適合保存舊文件。","to show a contrast":"表示對比用 however、in contrast。","to give an example":"舉例用 for example。","to sum up":"總結用 in short。"},
3:{"to point out one part of what was just said":"in particular 是在剛說的範圍中，特別指出其中一部分：磁磚中尤其是百年前台灣住家用的。","to add something unrelated":"追加不相干的事用 by the way。","to show the order in time":"表示時間先後用 then、afterward。","to correct the earlier point":"修正前面的說法用 or rather。"},
4:{"to introduce a surprising fact":"Believe it or not 用來帶出令人意外的事實：台灣沒有生產這類磁磚的歷史。","to show the result":"表示結果用 as a result。","to list another case":"另舉一例用 also、in addition。","to restate the idea":"重述用 in other words。"}}},
1:{gloss:"spinal muscular atrophy 脊髓性肌肉萎縮症　inherited 遺傳的　condition 病況　House of Lords 英國上議院　lawmaker 立法者、議員　robotic 機器人般的　health budget 個人健康預算　Tino Bao 包小柏",zh:"Jane Campbell 一歲時，醫生告訴她的父母，她活不到兩歲生日。她患有脊髓性肌肉萎縮症，這是一種罕見的遺傳疾病，會使肌肉慢慢衰弱。然而，她長大後成為爭取身心障礙者權利的重要倡議者，並在 2007 年進入英國上議院。隨著病情逐年惡化，她在公開場合說話也越來越困難。很長一段時間，她靠一位協助者幫忙，由對方代她朗讀演講稿。後來，在上議院的特別許可下，她成為第一位用 AI 生成聲音發表演說的議員。AI 公司只需要她幾分鐘的舊錄音就能複製她的聲音，而且不像較舊的系統，聽起來並不像機器人。Campbell 的演說主題是個人健康預算，她說自己也仰賴這項預算。台灣也有類似的故事。音樂人包小柏的女兒二十二歲時因罕見疾病過世，他後來用 AI 只靠幾段簡短的錄音就重建了她的聲音。"},
2:{gloss:"Medicine Buddha 藥師佛　wall painting 壁畫　on display 展出　temple 寺廟　digital 數位的　copy 複製品　monument 古蹟　craftsman 匠師",zh:"在紐約大都會藝術博物館裡，正展出一幅巨大的藥師佛壁畫。它寬超過 15 公尺，高約 7.5 公尺。這幅畫大約在 700 年前為中國山西的一座寺廟所繪，後來卻從牆上被切了下來，最後流落到美國。它由 274 塊分開的碎片組成，有些碎片無法完全拼合。博物館現在和中國的藝術專家合作，研究並修復這幅受損的畫。畫家 Zhang Jian 帶領的團隊製作了一幅原尺寸的複製品。為此，他們研究了原作的詳細數位照片。在牆面的部分，他們使用寺廟原址的當地泥土，讓複製品更有真跡的質感。這幅複製品已在北京展出，雙方也計畫召開會議，討論未來如何保存這幅畫。台灣也面臨類似的問題。台灣有超過 1,000 處古蹟和近 1,800 棟歷史建築，但能修復它們的匠師正在老去，也越來越難找。"},
14:{gloss:"furusato nozei 故鄉納稅（日文ふるさと納税）　donation 捐款　donor 捐款人　fiscal 2025 指 2025 年度（2025 年 4 月到 2026 年 3 月）　residential tax 住民稅（日本的地方稅）　get out of hand 失控　hit 大受歡迎的事物",zh:"日本有一項稅收制度，感覺有點像網路購物。納稅人可以選擇全國任何一個城鎮，捐錢給它，之後就會收到禮物，例如米、水果或海鮮。這項制度叫做「故鄉納稅」（furusato nozei），不過捐款人不一定要捐給自己長大的地方。在依捐款人所得而定的上限內，除了 2,000 日圓之外，其餘捐款都可以從捐款人的住民稅和所得稅中扣除。為了避免回禮失控，各城鎮花在回禮上的費用，不得超過每筆捐款的 30%。這項制度大受歡迎。在 3 月結束的 2025 年度，捐款人共捐了約 1.33 兆日圓，總額連續第六年創下新高。許多捐款人現在選擇米和衛生紙這類日常用品，顯然是因為物價上漲。主要衛生紙產地富士市，在獲得最多捐款的城鎮排行榜上前進七名，升到第 14 名。大都市就不那麼高興了。當居民把錢捐給別的地方時，這些城市就會少了原本可以用來支應地方服務的稅收。"},
15:{gloss:"tourism factory 觀光工廠　manufacturer 製造業者　hands-on 親自動手做的　tour 導覽　label 標章　output 產值　visits 人次（同一個人去幾次就算幾次）",zh:"台灣有些工廠歡迎觀光客。全國有 150 家這樣的「觀光工廠」，這些仍在運作的工廠提供導覽、展覽和手作體驗課程。政府在 2003 年啟動這項計畫，當時許多製造業者正把生產線遷往海外。目的是協助老工廠找到新的賺錢方式。要取得官方標章，工廠必須通過政府的評鑑。食品公司經營 150 處中的 69 處，占總數的 46%。2025 年，這些據點吸引了約 2,136 萬人次參觀，創造出約新台幣 67 億元的產值。由於同一個人可以參觀不只一次，這個數字計算的是人次，不是個別的人數。"},
16:{gloss:"character goods 角色周邊商品　organizer 主辦單位　brand exhibition 品牌商展　booking 預約　in advance 事先　entry 入場　visits 人次（同一個人去幾次就算幾次）",zh:"台灣文博會是由文化部主辦的大型創意商品展。它從 2010 年開始舉辦，本地品牌在這裡販售角色周邊商品和其他創意商品。2025 年，參觀者有時得等上約四小時才能入場。因此，主辦單位在 2026 年首度加入線上預約。事先預約超過 10 萬人次，入場速度大約比前一年快了一倍。品牌商展的銷售額從新台幣 13.5 億元升到約 16.5 億元，成長了 22%。兩個展區合計吸引了超過 67 萬人次。即使如此，排隊的人龍並沒有完全消失，最後一天仍有人在排隊入場。"},
17:{gloss:"mystery 推理小說　on the side 利用工餘時間（副業）　debut novel 處女作　bookseller 書店（書商）　copy 一本（冊）　wave 一波　exceed 超過　printed book 紙本書　annual 每年的",zh:"日本最暢銷的推理作家之一東野圭吾，於 2026 年 7 月 23 日過世，享壽 68 歲。他一邊當工程師，一邊在工餘寫作，1985 年憑處女作拿下一項推理文學獎。他一共出版了 106 本書，到 2023 年，光在日本國內，他的書就賣出超過一億冊。消息在 7 月 27 日星期一傳到台灣時，他在台灣最大的網路書店博客來的銷量，超過了 7 月到那天為止整個月的總和。當天書店前十名暢銷書中有五本是他的作品。博客來表示，也有一波四十歲以下的新讀者開始接觸他的作品，雖然他的讀者長期以來多半是四十多歲的人。根據一家台灣出版社的說法，一本紙本書能賣到一萬冊就算相當成功，因此《解憂雜貨店》賣出超過 50 萬冊，可說是非常驚人的成績。這本書在 2013 年出版後，連續五年名列該書店年度前十名。"},
18:{gloss:"manhole 人孔（街上通往下水道的孔）　gold rush 淘金熱　sewer 下水道　sewage 汙水　sludge 汙泥　copper 銅　trespassing 未經許可進入　conspiracy 共謀",zh:"今年，紐約市有人被拍到在夜晚掀開人孔蓋，爬進下水道。他們穿著橡膠靴，在地下待好幾個小時，並在有人看清他們的臉之前離開。9 月下旬，警方在一次這樣的行動後逮捕了兩名男子。警方說，在幾起案件中，被逮捕的人說他們是在找沖進排水管的金項鍊、戒指或銅。下面真的有黃金嗎？美國一項針對汙水處理廠汙泥的研究發現，每公噸只有約三分之一公克的金。主要作者說，金是以微小顆粒的形式存在，所以沒有人能像過去的礦工那樣用淘洗的方式找金。市政府警告，下水道裡有毒氣、有淹水的危險，地面也不穩固，進入下水道是違法的。街道底下有一場淘金熱的想法聽起來也許令人興奮，但 9 月被逮捕的男子只被控侵入和共謀罪。",exp:{
1:{"lids placed over an opening":"cover 在這裡是蓋子：manhole cover 就是人孔蓋。","bindings of books":"cover 也可以指書的封面，但人孔不是書。","cloths on a bed":"covers 也可以指床上的被單、被子，但這裡掀開的是街上的人孔。","new versions of old songs":"cover 也可以指翻唱的版本（a cover of an old song），與人孔無關。"},
2:{"to see or notice":"spot 在這裡是看見、認出：before anyone can spot their faces 是在有人認出他們的臉之前。","to stain with marks":"spot 也可以指弄出汙點（spot a shirt），但臉不是被弄髒。","to hide on purpose":"意思相反：這裡是怕被別人看見。","to give a head start to":"spot 也有讓對手先得若干分的意思（spot someone ten points），與臉無關。"},
3:{"pipes that carry liquid away":"drains 在這裡是排水管：金鍊、戒指可能被水沖進排水管。","things that use up money or energy":"drain 也可以指持續耗損資源的事物（a drain on resources），但戒指沒有被沖進這樣的東西。","tubes that remove liquid from a wound":"drain 也可以指傷口的引流管，屬於醫療用語。","wells that supply drinking water":"意思相反：drain 是把水排走，不是供水。"},
4:{"to wash gravel in a dish to find gold":"pan for 是淘洗砂礫找金子，也就是淘金，和同一句後面的 miners 相合。","to criticize harshly":"pan 也可以指嚴厲批評（pan a movie），與找金子無關。","to turn a camera sideways":"pan 也可以指攝影機水平搖鏡，與找金子無關。","to put something in a pan":"pan 也可以指把東西放進平底鍋，與找金子無關。"},
5:{"a crowd of people hurrying to a place to get rich":"gold rush 是淘金熱，指一大群人趕往某地想要發財。","a burst of speed":"rush 也可以指一陣急忙的活動或速度（the holiday rush），不是淘金熱的意思。","a sudden feeling of excitement":"rush 也可以指一陣興奮的感覺（a rush of adrenaline），與 gold rush 不同。","a plant that grows in wet ground":"rush 也可以指燈心草，是一種長在潮濕地方的草。"}}},
19:{gloss:"magnetic field 磁場　compass 指南針　protein 蛋白質　robin 知更鳥　homing pigeon 信鴿　iron-rich 富含鐵的　rotate 旋轉　brain waves 腦波",zh:"許多鳥類似乎能感應到地球的磁場，並把它當作指南針來用。科學家目前還無法確切弄清楚這些鳥是怎麼做到的。2021 年，牛津大學與奧登堡大學的一個團隊報告，歐洲知更鳥眼睛裡的一種蛋白質，可能解釋了這項能力，但他們說這還不是決定性的證據。2026 年 5 月，另一個團隊報告，信鴿的肝臟裡可能有富含鐵的細胞，把磁場資訊傳遞給大腦。那人類呢？在 2019 年的一項研究中，當磁場繞著受試者旋轉時，他們的腦波改變了，雖然他們並沒有察覺任何變化。研究人員說，其他團隊還需要查證這項結果，而且沒有人知道大腦會用這種訊號來做什麼。",exp:{
1:{"to sense or detect":"pick up 在這裡是感應到、偵測到：鳥類能感應到磁場。","to collect someone in a car":"pick up 也可以指開車去接人，與感應磁場無關。","to improve after a slow time":"pick up 也可以指情況好轉（business is picking up），但磁場不是會好轉的東西。","to learn without formal teaching":"pick up 也可以指不經正式教學就學會（pick up a language），與感應無關。"},
2:{"to find the answer to":"work out 在這裡是想出、弄清楚：科學家還弄不清楚鳥類怎麼做到的。","to do exercise to stay fit":"work out 也可以指運動健身，與研究問題無關。","to end in a good way":"work out 也可以指結果順利（things worked out），但這裡的 exactly how 是要弄清楚的內容。","to add up to a total":"work out 也可以指總數算起來是（the bill works out to $50），但 how they do it 不是算出來的數字。"},
3:{"to explain the reason for":"account for 在這裡是解釋原因：蛋白質可能解釋了這項能力。","to make up part of a total":"account for 也可以指占某個比例（accounts for 20 percent），但蛋白質並不是占這項能力的百分比。","to know where someone is":"account for 也可以指交代某人的下落（account for all the passengers），與能力無關。","to destroy or kill":"account for 也有消滅、擊敗的意思（accounted for three enemy planes），與能力無關。"},
4:{"to send from one to another":"pass on 在這裡是傳遞：細胞把磁力資訊傳給大腦。","to refuse a chance":"pass on 也可以指放棄機會（pass on the offer），與傳遞資訊無關。","to die":"pass on 也可以委婉地指去世，與傳遞資訊無關。","to move past a car ahead":"超車的說法是 pass，不加 on；與傳遞資訊無關。"},
5:{"to look into and make sure it is true":"check out 在這裡是查證：其他團隊需要查證這項結果是否為真。","to leave a hotel":"check out 也可以指退房，與查證結果無關。","to borrow a library book":"check out 也可以指借圖書館的書，與查證結果無關。","to pay for goods at a store":"check out 也可以指在商店結帳，與查證結果無關。"}}},
20:{gloss:"peacekeeping 維和　observer 觀察員　truce 停戰、休戰　mission 任務　Security Council 安全理事會　shortfall 缺口　troops 部隊　personnel 人員",zh:"聯合國維和行動始於 1948 年，當時派出一小群觀察員去監督中東的一項停戰協議。有些任務持續很長的時間，也有些是比較新的。例如 2014 年 4 月，安理會在中非共和國設立了一項任務。然而，如今維和行動正在縮減。2026 年的一份報告發現，2025 年 12 月，全球有 78,633 人在和平行動中服務，比 2016 年少了 49%。原因之一是經費：2025 年 7 月，聯合國維和行動面臨約 20 億美元的缺口，10 月聯合國表示，將把部隊和警察的人數削減約四分之一。即使如此，聯合國仍主導了 2025 年運作的 58 項行動中的 18 項，人員約占全部的三分之二。",exp:{
1:{"watch a movie":"動詞，和文中 watch a truce（監督停戰）的詞性相同。","the night watch":"名詞：夜間的守衛、警戒。","a gold watch":"名詞：手錶。","keep watch at night":"名詞：放哨、警戒（keep watch 是固定說法）。"},
2:{"a long road":"形容詞，修飾名詞 road，和文中 a long time 的 long 詞性相同。","all night long":"副詞：整個晚上（long 放在後面）。","long for a rest":"動詞：渴望（long for）。","didn't stay long":"副詞：久（修飾動詞 stay）。"},
3:{"cut the cake in half":"動詞，和文中 cut its troops（削減部隊）的詞性相同。","a cut in pay":"名詞：減少、削減。","a deep cut on her hand":"名詞：傷口。","a power cut":"名詞：停電。"},
4:{"still live in Taipei":"副詞：仍然，和文中 still led 的 still 詞性相同。","a still lake":"形容詞：平靜不動的。","the still of the night":"名詞：寂靜。","tried to still her nerves":"動詞：使平靜下來。"}}},
21:{gloss:"esports 電競　caster 電競賽評　prize pool 總獎金　viewer 觀眾　peak 最高峰（這裡指同時觀看人數的最高值）　tactics 戰術　in real time 即時地　on air 播出中　meme 迷因（網路梗圖）",zh:"《英雄聯盟》世界大賽是電競界最大的賽事之一。2025 年 11 月 9 日的決賽，T1 擊敗 KT Rolster，同時觀看人數最高時約有 670 萬人。今年有 19 支隊伍爭奪 500 萬美元的總獎金，決賽將於 11 月 14 日在布魯克林的巴克萊中心舉行。每場比賽背後都有賽評，也就是向觀眾說明場上情況的人。10 月 28 日發布的一集台灣 Podcast，訪問了一位名叫 ZOD 的賽評，他播報《英雄聯盟》比賽已經超過八年。節目主持人說，優秀的賽評必須了解遊戲的戰術、選手和隊伍，還要即時播報場上的動態。這一集的標題還說，播報一整天可能長達十二小時。主持人說，連笑話和時事梗都必須事先準備好。",exp:{
1:{"to attract":"draw 在這裡是吸引：決賽吸引了約 670 萬名觀眾。","to make a picture with a pencil":"draw 也可以指畫圖，但決賽不是在畫畫。","to end a game with no winner":"draw 也可以指比賽打成平手，但這場比賽 T1 贏了。","to pull something toward you":"draw 也可以指拉（draw the curtains），但觀眾不是被拉過來。"},
2:{"all the competitors in a contest":"field 在這裡指所有參賽者：這屆有 19 支隊伍參賽。","an open area of land":"field 也可以指田野，與比賽的參賽隊伍無關。","an area of study or work":"field 也可以指領域（the field of science），與參賽隊伍無關。","the ground where a sport is played":"field 也可以指球場，但這裡的 19 teams 是人，不是場地。"},
3:{"reported on":"cover 在這裡是報導、播報：賽評播報比賽已超過八年。","put something over":"cover 也可以指蓋住，與播報比賽無關。","was enough to pay for":"cover 也可以指足以支付（cover the cost），與播報比賽無關。","traveled a distance":"cover 也可以指走過一段距離（cover ten miles），與播報比賽無關。"},

22:{gloss:"geoid 大地水準面　surveyor 測量人員　exaggerate 誇大　deepest dip 最深的凹陷　sea level 海平面　average 平均　mathematical 數學上的　leveling 水準測量　reading 測量讀數　first-order benchmark 一等水準點　Keelung 基隆　gap 差距",zh:"2011 年，歐洲太空總署公布了一張彩色的地球圖片，看起來像一顆凹凸不平的馬鈴薯。這張圖片是根據一顆衛星的資料製成，呈現的是大地水準面。類似的圖片至今仍在網路上流傳，許多貼文把它稱為這個星球的真實形狀。其實，大地水準面是海洋在沒有潮汐和洋流時會形成的表面，測量人員再把它延伸到陸地底下，作為量測高度的零點線。在這些圖片裡，凹凸被誇大了數千倍，因為實際上它們非常微小。最深的凹陷位在印度西南方約 1,200 公里處，那裡的海平面比全球平均低約 106 公尺。自從 1948 年發現它以來，科學家一直在爭論成因，2023 年的一項研究則指出，成因是地球深處又熱又輕的岩石。在台灣，高程是從基隆的平均海水面起算，但 GPS 測得的，則是相對於一個光滑的數學地球模型的高度。內政部曾在全島 2,065 個一等水準點取得 GPS 與水準測量的讀數，研究人員已用這些讀數建立模型，描述這兩種高度之間的差距。",exp:{
1:{a:"the European Space Agency：是發表圖片的機構，貼文不會把機構稱為星球的形狀。",b:"the Earth：若 it 指地球，句子就變成「把地球稱為地球的真實形狀」，意思不通。",c:"a satellite：衛星是蒐集資料的工具，貼文稱為星球真實形狀的是圖片呈現的東西。",d:"the geoid：圖片呈現的是大地水準面，貼文把它稱為這個星球的真實形狀，所以 it 指 the geoid。"},

function withMarker(t,n){ if(!n) return t; const i=t.indexOf('{'+n+'}'); if(i<0) return t; const m=t.slice(i).match(/[.!?]["')”’]?(?=\s+[A-Z0-9"“({<]|\s*$)/); const e=m? i+m.index+m[0].length : t.length; return t.slice(0,e)+'@@PANEL@@'+t.slice(e); }

function sentOf(p,n){const raw=p.text.replace(/<<\w:([^>]+)>>/g,'$1');const i=raw.indexOf('{'+n+'}');if(i<0)return fullText(p);const re=/[.!?]["')”’]?(?=\s+[A-Z0-9"“({]|\s*$)/g;let s=0,m;while((m=re.exec(raw))&&m.index<i)s=m.index+m[0].length;const e=m?m.index+m[0].length:raw.length;return raw.slice(s,e).trim().replace(/\{(\d)\}/g,(x,k)=>p.q[k].word||p.q[k].ans);}
