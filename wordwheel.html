});

function draw(){
  [...tabs.children].forEach((b,i)=>b.setAttribute('aria-selected', i===cur));
  const d = DATA[cur];
  hub.innerHTML = d.k + '<span>' + d.zh + '</span>';
  note.textContent = d.note;

  const n = d.items.length, R = 128, S = 340, c = S/2, NR = 34;
  let s = `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="${d.k} 的單字輪">`;
  d.items.forEach((it,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/n;
    const x = c + R*Math.cos(a), y = c + R*Math.sin(a);
    s += `<line class="spoke" x1="${c+46*Math.cos(a)}" y1="${c+46*Math.sin(a)}" x2="${x}" y2="${y}"/>`;
  });
  d.items.forEach((it,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/n;
    const x = c + R*Math.cos(a), y = c + R*Math.sin(a);
    const exam = !it.t.startsWith('第');
    const short = it.w.length > 9 ? it.w.slice(0,8)+'…' : it.w;
    s += `<g class="node ${exam?'exam':''} ${sel===i?'on':''}" data-i="${i}" tabindex="0" role="button" aria-label="${it.w}">`
       + `<circle cx="${x}" cy="${y}" r="${NR}"/><text x="${x}" y="${y}">${short}</text></g>`;
  });
  s += `<g class="core"><circle cx="${c}" cy="${c}" r="44"/>`
     + `<text x="${c}" y="${c+5}">${d.k.replace(' / ','/')}</text></g></svg>`;
  chart.innerHTML = s;
  chart.querySelectorAll('.node').forEach(g=>{
    const go = ()=>{ sel = +g.dataset.i; draw();
      list.children[sel].scrollIntoView({block:'center', behavior:'smooth'}); };
    g.onclick = go;
    g.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
  });

  list.innerHTML = d.items.map((it,i)=>{
    const exam = !it.t.startsWith('第');
    return `<li class="${sel===i?'on':''}"><span class="tag ${exam?'':'sup'}">${it.t}</span>`
         + `<div class="w">${it.w}</div><div class="p">${it.p}</div><div class="g">${it.g}</div></li>`;
  }).join('');
}
draw();
</script>
</body>
</html>
