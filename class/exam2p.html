<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>第二次段考　片語與字詞搭配</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E4; --paper-card:#FFFDF7; --ink:#221F1A; --ink-soft:#5B5648;
    --rule:#DCD3BB; --crimson:#AE3626; --sage:#3E6E52;
    --shadow: 0 1px 0 rgba(34,31,26,.06), 0 8px 24px rgba(34,31,26,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Noto Sans TC',sans-serif;
       font-size:16px; line-height:1.75; -webkit-text-size-adjust:100%;}
  .wrap{max-width:600px; margin:0 auto; padding:0 16px 48px;}
  header.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
             padding:18px 0 10px; border-bottom:3px double var(--ink);}
  header.top .title{font-family:'Noto Serif TC',serif; font-weight:900; font-size:21px;}
  header.top .sub{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}
  .card{background:var(--paper-card); border:1px solid var(--rule); border-left:6px dashed var(--rule);
        border-radius:3px; box-shadow:var(--shadow); padding:20px 18px; margin:18px 0;}
  .lead{font-family:'Noto Serif TC',serif; font-weight:700; font-size:19px; margin:0 0 6px;}
  .note{color:var(--ink-soft); font-size:14.5px; margin:0 0 12px;}
  .stat{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); margin:2px 0 0;}
  .stat b{color:var(--crimson);}
  .big-btn{display:block; width:100%; font:inherit; font-size:18px; font-weight:700;
           font-family:'Noto Serif TC',serif; background:var(--ink); color:var(--paper-card);
           border:0; border-radius:3px; padding:15px; cursor:pointer; margin:6px 0 10px;}
  .minor-row{display:flex; gap:10px; flex-wrap:wrap;}
  .minor-btn{flex:1 1 0; min-width:120px; font:inherit; font-size:14.5px; background:var(--paper-card);
             color:var(--ink); border:1px solid var(--rule); border-radius:3px; padding:11px; cursor:pointer;}
  .minor-btn.ok{background:var(--ink); color:var(--paper-card); border-color:var(--ink);}
  .big-btn:focus-visible,.minor-btn:focus-visible{outline:2px solid var(--crimson); outline-offset:2px;}
  .row{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 12px;}
  .grp{margin:0 0 10px;}
  .grp .glbl{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--sage); display:block; margin:0 0 5px;}
  .legend{font-size:12.5px; color:var(--ink-soft); margin:0 0 14px;}
  .chip{font:inherit; font-size:14.5px; cursor:pointer; background:var(--paper-card); color:var(--ink);
        border:1px solid var(--rule); border-radius:3px; padding:7px 12px;}
  .chip[aria-pressed="true"]{background:var(--ink); color:var(--paper-card); border-color:var(--ink);}
  .chip:focus-visible{outline:2px solid var(--crimson); outline-offset:2px;}
  .chip .qty{font-family:'IBM Plex Mono',monospace; font-size:11.5px; opacity:.75; margin-left:5px;}
  .bar{display:flex; justify-content:space-between; align-items:center;
       font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); padding:14px 0 0;}
  .bar a{color:var(--crimson);}
  .src{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--sage); margin:0 0 2px;}
  .prompt{font-family:'Noto Serif TC',serif; font-weight:700; font-size:23px; line-height:1.5; margin:2px 0 6px;}
  .hint{font-family:'IBM Plex Mono',monospace; font-size:17px; color:var(--ink-soft); letter-spacing:.06em;
        margin:0 0 18px; word-break:break-word;}
  .typed{width:100%; font:inherit; font-family:'IBM Plex Mono',monospace; font-size:18px;
         padding:12px 13px; border:1px solid var(--rule); border-radius:3px; background:#fff;
         color:var(--ink); margin:0 0 10px;}
  .typed:focus{outline:2px solid var(--sage); outline-offset:1px;}
  .verdict{font-family:'Noto Serif TC',serif; font-weight:700; font-size:17px; margin:0 0 4px;}
  .verdict.right{color:var(--sage);} .verdict.wrong{color:var(--crimson);}
  .yours{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--ink-soft); margin:0 0 8px;
         word-break:break-word;}
  .answer{font-family:'IBM Plex Mono',monospace; font-size:20px; color:var(--crimson); background:#FBF6EA;
          border:1px solid var(--rule); border-radius:3px; padding:14px; margin:0 0 6px; word-break:break-word;}
  .kk{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); margin:0 0 14px;}
  .done{text-align:center; padding:14px 0;}
  .done .big{font-family:'Noto Serif TC',serif; font-weight:900; font-size:25px; margin:0 0 6px;}
  footer{border-top:1px solid var(--rule); margin-top:26px; padding-top:14px; font-size:13px; color:var(--ink-soft);}
  .hide{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="title">第二次段考　片語與字詞搭配</span>
    <span class="sub">中正高中　張敬欣</span>
  </header>

  <section id="home">
    <div class="card">
      <p class="lead">看中文，把英文打出來</p>
      <p class="note">選一個範圍開始。答對的會往後推，答錯的當場再來。</p>
      <div id="setGroups"></div>
      <button class="big-btn" id="startBtn">開始練習</button>
      <p class="stat" id="homeStat"></p>
      <div class="minor-row"><button class="minor-btn" id="clearBtn">清除我的進度</button></div>
      <p class="note" style="margin:14px 0 0;">看到中文就把英文打出來，跟段考一樣要自己拼。大小寫、標點、冠詞和 his／her 這類代名詞不列入計分，介系詞要求完全正確。答案裡括號中的字，寫或不寫都算對。進度存在這台裝置裡，換手機不會跟著走。</p>
    </div>
  </section>

  <section id="quiz" class="hide">
    <div class="bar"><span id="qProgress"></span><a href="#" id="quitLink">回上一頁</a></div>
    <div class="card">
      <p class="src" id="srcLbl"></p>
      <p class="prompt" id="prompt"></p>
      <p class="hint" id="hint"></p>
      <div id="typeBox">
        <input id="typed" class="typed" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" placeholder="把英文打出來">
        <div class="minor-row">
          <button class="minor-btn" id="dunnoBtn">還不會</button>
          <button class="minor-btn ok" id="sendBtn">送出</button>
        </div>
      </div>
      <div id="ansBox" class="hide">
        <p class="verdict" id="verdict"></p>
        <p class="yours" id="yours"></p>
        <div class="answer" id="answer"></div>
        <p class="kk" id="kk"></p>
        <div class="minor-row">
          <button class="minor-btn" id="overrideBtn">我其實拼對了</button>
          <button class="minor-btn ok" id="nextBtn">下一個</button>
        </div>
      </div>
    </div>
  </section>

  <section id="done" class="hide">
    <div class="card done">
      <p class="big">這一輪練完了</p>
      <p class="note" id="doneNote"></p>
      <button class="big-btn" id="againBtn">再練一輪</button>
      <div class="minor-row"><button class="minor-btn" id="homeBtn">回到首頁</button></div>
    </div>
  </section>

  <footer>範圍由老師給的連結決定，還沒開放的課會在開放後出現。</footer>
</div>
<script>
var DATA = null;
(function () {
  'use strict';
  var STORE_KEY = 'zz_exam2p_v1', RELEARN_GAP = 5, PASS = 3;
  var state = null, session = null, scope = null;

  function $(id){ return document.getElementById(id); }
  function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function today(){ var d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function loadState(){
    var s=null;
    try { s=JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){ s=null; }
    if (!s || s.v!==1) s={v:1,w:{}};
    return s;
  }
  function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }

  // 網址：#n=25-36,296-304&c=L1,L2&t=第五節聽寫
  function parseScope(){
    var h=(location.hash||'').replace(/^#/,''), q={};
    h.split('&').forEach(function(p){
      var i=p.indexOf('='); if(i<0) return;
      q[decodeURIComponent(p.slice(0,i))]=decodeURIComponent(p.slice(i+1));
    });
    var nums=null;
    if (q.n) {
      nums=[];
      q.n.split(',').forEach(function(r){
        var m=/^(\d+)(?:-(\d+))?$/.exec(r.trim());
        if(m) nums.push([+m[1], m[2]?+m[2]:+m[1]]);
      });
    }
    var lessons = q.c ? q.c.split(',').map(function(s){return s.trim().toUpperCase();}) : null;
    return { nums: nums, lessons: lessons, title: q.t || '' };
  }

  function inRanges(n, rs){ for (var i=0;i<rs.length;i++) if (n>=rs[i][0] && n<=rs[i][1]) return true; return false; }

  var SETS = [], sel = 0;

  // 開放時間：每一課從指定日期（台灣時間）零點起開放，片語和字詞搭配一起開。
  // null 表示還沒決定，老師說可以了再填日期。
  var OPEN = { 'L4': '2026-10-29', 'L5': '2026-10-30', 'L6': null };
  function todayStr(){
    var d = new Date(), m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function openLessons(){
    var t = todayStr();
    return ['L4','L5','L6'].filter(function (l) { return OPEN[l] && OPEN[l] <= t; });
  }

  function makeSets(){
    var g = [], lessons = scope.lessons || openLessons();
    if (scope.nums || scope.lessons) {
      g.push({ label: '老師指定', sets: [
        { label: scope.title || '這次範圍', nums: scope.nums, lessons: scope.lessons } ] });
    }
    g.push({ label: '龍騰課本　片語', sets: lessons.map(function (l) {
      return { label: l, secs: [l] }; }) });
    g.push({ label: '龍騰課本　字詞搭配', sets: lessons.map(function (l) {
      return { label: l, lessons: [l] }; }) });
    g.push({ label: '整課　片語加字詞搭配', sets: lessons.map(function (l) {
      return { label: l, secs: [l], lessons: [l] }; }) });
    if (lessons.length > 1) {
      g.push({ label: '整份', sets: [
        { label: '片語全部', secs: lessons },
        { label: '字搭全部', lessons: lessons },
        { label: '全部', secs: lessons, lessons: lessons } ] });
    }
    var flat = [];
    g.forEach(function (grp) { grp.sets.forEach(function (s) { s.g = grp.label; flat.push(s); }); });
    return { groups: g, flat: flat };
  }

  function poolOf(set){
    var out = [];
    if (set.secs) DATA.w.forEach(function (w, i) { if (set.secs.indexOf(w.s) >= 0) out.push({t:'w', i:i}); });
    if (set.nums) DATA.w.forEach(function (w, i) { if (inRanges(w.n, set.nums)) out.push({t:'w', i:i}); });
    if (set.lessons) DATA.c.forEach(function (c, i) { if (set.lessons.indexOf(c.l) >= 0) out.push({t:'c', i:i}); });
    return out;
  }

  function buildPool(){ return poolOf(SETS.flat[sel]); }

  function rec(card){ return card.t==='w' ? DATA.w[card.i] : DATA.c[card.i]; }
  function key(card){ var r=rec(card); return card.t==='w' ? ('w'+r.n+'|'+r.e) : ('c'+r.l+'|'+r.e); }
  function answerOf(card){ return rec(card).e; }
  function promptOf(card){ var r=rec(card); return r.z; }
  function labelOf(card){
    var r=rec(card);
    return card.t==='w' ? ('龍騰 '+r.s+'　片語') : ('龍騰 '+r.l+'　字詞搭配');
  }

  // 答案裡有兩種都對的寫法時，中間用「 / 」（前後有空格）隔開；
  // 括號裡的部分可寫可不寫，所以每一種寫法再展開成「有括號內容」和「沒有」兩種
  function variants(en){
    var out = [];
    en.split(/\s+\/\s+/).forEach(function (a) {
      out.push(a);
      if (a.indexOf('(') >= 0) out.push(a.replace(/\s*\([^)]*\)/g, ''));
    });
    return out;
  }

  // 提示：每個字母串留首字母，其餘蓋掉；標點與省略號原樣保留
  // 功能詞照考卷的做法直接印出來，只挖實詞和介系詞
  var GIVEN = ['a','an','the','his','her','their','your','its','my','our','sb','sbs','sth','sths','ones'];
  var TOKEN = /N\/V-ing|[A-Za-z]+/g;
  function isGiven(w){ return w === 'N/V-ing' || w === 'A' || w === 'B' || GIVEN.indexOf(w.toLowerCase()) >= 0; }
  function mask(en){
    return en.replace(TOKEN, function(w){
      return isGiven(w) ? w : w.charAt(0) + w.slice(1).replace(/./g,'_');
    });
  }
  function initials(en){
    return en.replace(TOKEN, function(w){ return isGiven(w) ? w : w.charAt(0) + '…'; });
  }
  function isPhrase(en){ return /[\s…]/.test(en) || /\.{2,}/.test(en); }
  function countOf(en){
    return isPhrase(en) ? en.split(/[\s…]+|\.{2,}/).filter(function (t) { return /[A-Za-z]/.test(t) && t !== 'N/V-ing'; }).length
                        : en.replace(/[^A-Za-z]/g,'').length;
  }
  function unit(en){ return isPhrase(en) ? ' 個字' : ' 個字母'; }
  function hintFor(en, stage){
    if (stage <= 0) return mask(en);
    if (stage === 1) return initials(en);
    var ns = [];
    variants(en).forEach(function (v) { var c = countOf(v); if (ns.indexOf(c) < 0) ns.push(c); });
    ns.sort(function (a, b) { return a - b; });
    return '（' + ns.join(' 或 ') + unit(variants(en)[0]) + '）';
  }

  function due(pool){
    var t=today(), fresh=[], ready=[], passed=0;
    pool.forEach(function(c){
      var r=state.w[key(c)];
      if (!r) fresh.push(c);
      else if (r.p>=PASS && r.due>t) passed++;
      else if (r.due<=t) ready.push(c);
      else passed++;
    });
    return {fresh:fresh, ready:ready, passed:passed};
  }

  function renderHome(){
    var box = $('setGroups');
    box.innerHTML = '';
    var idx = 0;
    SETS.groups.forEach(function (grp) {
      var wrap = document.createElement('div');
      wrap.className = 'grp';
      var lbl = document.createElement('span');
      lbl.className = 'glbl'; lbl.textContent = grp.label;
      wrap.appendChild(lbl);
      var row = document.createElement('div');
      row.className = 'row';
      grp.sets.forEach(function (s) {
        var my = idx++;
        var n = poolOf(s).length;
        var b = document.createElement('button');
        b.className = 'chip'; b.type = 'button';
        b.setAttribute('aria-pressed', my === sel ? 'true' : 'false');
        b.innerHTML = esc(s.label) + '<span class="qty">' + n + '</span>';
        b.addEventListener('click', function () { sel = my; renderHome(); });
        row.appendChild(b);
      });
      wrap.appendChild(row);
      box.appendChild(wrap);
    });
    var pool = buildPool(), dd = due(pool);
    $('homeStat').innerHTML = '這個範圍 <b>' + pool.length + '</b> 個，今天要練 <b>' +
      (dd.ready.length + dd.fresh.length) + '</b> 個，已經拼得出來的 <b>' + dd.passed + '</b> 個。';
  }

  function start(){
    var pool=buildPool(), d=due(pool);
    var q=shuffle(d.ready.slice()).concat(shuffle(d.fresh.slice()));
    if (!q.length) q=shuffle(pool.slice());
    session={q:q, total:q.length, miss:{}};
    $('home').classList.add('hide'); $('done').classList.add('hide'); $('quiz').classList.remove('hide');
    next();
  }

  // 判分：大小寫、空白、標點不列入計分；冠詞、人稱代名詞、be 動詞時態同樣不列入計分；
  // 介系詞與介副詞一律嚴格比對，那是搭配本身要考的東西
  var DROP = ['a','an','the'];
  var BE = ['is','are','was','were','been','being','am','be'];
  var SB = ['sb','sbs','sth','sths','someone','somebody','something','ones',
            'his','her','hers','their','theirs','its','my','mine','your','yours','our','ours','him','them','me','us','you',
            'oneself','himself','herself','themselves','myself','yourself','ourselves','itself'];
  function norm(s){
    var w = String(s).toLowerCase()
      .replace(/[…]|\.{2,}/g, ' ')
      .replace(/[’‘]/g, "'")
      .replace(/\.(?='s)/g, '')
      .replace(/'s\b/g, 's')
      .replace(/[.,;:!?"“”'()]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .split(' ');
    var out = [];
    w.forEach(function (x) {
      if (!x) return;
      if (DROP.indexOf(x) >= 0) return;
      if (BE.indexOf(x) >= 0) { out.push('be'); return; }
      if (SB.indexOf(x) >= 0) { out.push('sb'); return; }
      // sb's/sth's 這種「某人或某事物」並列的寫法，視同 sb
      if (x.indexOf('/') >= 0 && x.split('/').every(function (p) { return SB.indexOf(p) >= 0; })) { out.push('sb'); return; }
      out.push(x);
    });
    return out.join(' ');
  }
  function matches(typed, card){
    var t = norm(typed);
    return variants(answerOf(card)).some(function (v) { return norm(v) === t; });
  }

  function next(){
    if (!session.q.length) return finish();
    var card = session.q[0], r = state.w[key(card)] || {p:0, i:0, due:0};
    var en = answerOf(card);
    $('qProgress').textContent = '還有 ' + session.q.length + ' 個';
    $('srcLbl').textContent = labelOf(card);
    $('prompt').textContent = promptOf(card);
    $('hint').textContent = hintFor(en, Math.min(r.p, 2));
    $('ansBox').classList.add('hide');
    $('typeBox').classList.remove('hide');
    var box = $('typed');
    box.value = '';
    try { box.focus(); } catch (e) {}
    $('sendBtn').onclick = function () { check(card, box.value); };
    $('dunnoBtn').onclick = function () { show(card, box.value, false, true); };
    box.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); check(card, box.value); } };
  }

  function check(card, typed){
    if (!norm(typed)) return;
    show(card, typed, matches(typed, card), false);
  }

  function show(card, typed, ok, gaveUp){
    var en = answerOf(card);
    $('typeBox').classList.add('hide');
    $('ansBox').classList.remove('hide');
    var v = $('verdict');
    v.className = 'verdict ' + (ok ? 'right' : 'wrong');
    v.textContent = ok ? '拼對了' : (gaveUp ? '這一個先看答案' : '還差一點');
    $('yours').textContent = (!ok && !gaveUp && typed.trim()) ? ('你寫的：' + typed.trim()) : '';
    $('answer').textContent = en;
    var k = rec(card).k;
    $('kk').textContent = k ? '[' + k + ']' : '';
    $('overrideBtn').style.display = ok ? 'none' : '';
    $('overrideBtn').onclick = function () { grade(card, true); };
    $('nextBtn').onclick = function () { grade(card, ok); };
  }

  function grade(card, ok){
    var k=key(card), r=state.w[k]||{p:0,i:0,due:0};
    if (ok) {
      r.p=(r.p||0)+1;
      if (r.p>=PASS) { r.i=r.i?Math.min(r.i*2,30):1; r.due=today()+r.i; session.q.shift(); }
      else { var it=session.q.shift(); session.q.splice(Math.min(RELEARN_GAP,session.q.length),0,it); }
    } else {
      r.p=0; r.i=0; r.due=today();
      session.miss[k]=(session.miss[k]||0)+1;
      var it2=session.q.shift();
      session.q.splice(Math.min(RELEARN_GAP,session.q.length),0,it2);
    }
    state.w[k]=r; saveState(); next();
  }

  function finish(){
    $('quiz').classList.add('hide'); $('done').classList.remove('hide');
    var m=Object.keys(session.miss).length;
    $('doneNote').textContent = m ? ('這一輪 '+session.total+' 個，其中 '+m+' 個卡住過，過幾天會再出現。')
                                  : ('這一輪 '+session.total+' 個，全部一次就拼出來。');
    renderHome();
  }

  $('startBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);
  $('homeBtn').addEventListener('click', function(){ $('done').classList.add('hide'); $('home').classList.remove('hide'); renderHome(); });
  $('quitLink').addEventListener('click', function(e){ e.preventDefault(); $('quiz').classList.add('hide'); $('home').classList.remove('hide'); renderHome(); });
  $('clearBtn').addEventListener('click', function(){
    if (!confirm('確定要清除這台裝置上的練習進度嗎？清掉之後所有字都會變回沒練過。')) return;
    state={v:1,w:{}}; saveState(); renderHome();
  });
  window.addEventListener('hashchange', function(){ scope=parseScope(); SETS=makeSets(); sel=0; renderHome(); });

  // 資料檔：每次段考換這個檔名就好，介面不動
  var DATA_FILE = 'exam2p.json';

  function boot(d){
    DATA = d;
    state = loadState(); scope = parseScope(); SETS = makeSets(); sel = 0;
    renderHome();
  }
  fetch(DATA_FILE, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(boot)
    .catch(function (e) {
      $('setGroups').innerHTML = '<p class="note">字庫載入失敗，請重新整理頁面試試。</p>';
    });
  window.__deck={ get state(){return state;}, get DATA(){return DATA;}, hintFor:hintFor, buildPool:buildPool,
    parseScope:parseScope, get SETS(){return SETS.flat;}, poolOf:poolOf, setSel:function(i){sel=i;}, norm:norm,
    matches:matches, variants:variants, answerOf:answerOf, rec:rec };
})();
</script>
</body>
</html>
