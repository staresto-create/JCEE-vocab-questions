<style>
  :root{--paper:#F6F1E4;--paper-card:#FFFDF7;--ink:#221F1A;--ink-soft:#5B5648;--rule:#DCD3BB;--crimson:#AE3626;--sage:#3E6E52;--gold:#A9812E;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 48px;}
  header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:18px 0 10px;border-bottom:3px double var(--ink);}
  header.top .title{font-family:'Noto Serif TC',serif;font-weight:900;font-size:21px;white-space:nowrap;}
  header.top .sub{font-family:'IBM Plex Mono','Noto Sans TC',monospace;font-size:11.5px;color:var(--ink-soft);}
  .tabs{display:flex;gap:8px;margin:14px 0 6px;}
  .tabs button{flex:1;font:inherit;font-size:16px;font-weight:700;background:var(--paper-card);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:8px 0;cursor:pointer;}
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper-card);border-color:var(--ink);}
  .note{color:var(--ink-soft);font-size:13.5px;margin:6px 0 10px;}
  .day{background:var(--paper-card);border:1px solid var(--rule);border-radius:3px;padding:10px 14px;margin:10px 0;}
  .day.past{opacity:.55;}
  .day.today{border:2px solid var(--crimson);box-shadow:0 4px 16px rgba(174,54,38,.15);}
  .day.off{background:transparent;border-style:dashed;color:var(--ink-soft);padding:6px 14px;}
  .day.exam{background:var(--ink);color:var(--paper-card);border-color:var(--ink);}
  .dh{display:flex;align-items:baseline;gap:8px;font-weight:700;}
  .dh .md{font-family:'IBM Plex Mono',monospace;font-size:17px;}
  .dh .tag{font-size:12px;font-weight:700;color:#fff;background:var(--crimson);border-radius:2px;padding:0 6px;}
  dl{margin:4px 0 0;display:grid;grid-template-columns:3.2em 1fr;gap:2px 8px;font-size:15px;}
  dt{color:var(--sage);font-weight:700;font-size:13.5px;padding-top:1px;}
  dd{margin:0;}
  dd.q{color:var(--crimson);font-weight:500;}
  a{color:var(--sage);}
  footer{margin-top:22px;font-size:12.5px;color:var(--ink-soft);}

  var CLS = ['208','204','212','215'];
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function linkify(s){
    s = esc(s);
    s = s.replace(/(線上單字卡開放|線上 L[456] 字搭卡)/g, '<a href="./">$1</a>');
    s = s.replace(/(單字輪 L[456])/g, '<a href="../wordwheel.html">$1</a>');
    s = s.replace(/U(\d+) 圖表組織/g, '<a href="../outline-202610-u$1.html">U$1 圖表組織</a>');
    return s;
  }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function pick(){
    var m=/(?:^|[?&#])c=(\d{3})/.exec(location.search+location.hash);
    if (m && P[m[1]]) return m[1];
    try { var s=localStorage.getItem('plan2_cls'); if (s && P[s]) return s; } catch(e){}
    return '208';
  }
  var cur = pick();
  function render(){
    try { localStorage.setItem('plan2_cls', cur); } catch(e){}
    document.getElementById('tabs').innerHTML = CLS.map(function(c){
      return '<button type="button" data-c="'+c+'" aria-pressed="'+(c===cur)+'">'+c+'</button>'; }).join('');
    var t = todayStr(), html = '', marked = false;
    P[cur].forEach(function(r){
      var cls = 'day', tag = '';
      if (r.d < t) cls += ' past';
      if (!marked && r.d >= t && !r.off) { cls += ' today'; marked = true; tag = r.d===t ? '今天' : '下一節'; }
      if (r.off) {
        html += '<div class="'+cls+(r.off==='第二次段考'?' exam':' off')+'"><div class="dh"><span class="md">'+r.md+'</span><span>'+r.wd+'</span><span>'+esc(r.off)+'</span></div></div>';
        return;
      }
      html += '<div class="'+cls+'"'+(tag?' id="now"':'')+'><div class="dh"><span class="md">'+r.md+'</span><span>'+r.wd+'</span>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</div><dl>'
        + (r.q ? '<dt>小考</dt><dd class="q">'+esc(r.q)+'</dd>' : '')
        + '<dt>上課</dt><dd>'+esc(r.l)+'</dd>'
        + (r.h ? '<dt>繳交</dt><dd>'+esc(r.h)+'</dd>' : '')
        + (r.w ? '<dt>作業</dt><dd>'+linkify(r.w)+'</dd>' : '')
        + '</dl></div>';
    });
    document.getElementById('list').innerHTML = html;
    var n = document.getElementById('now');
    if (n && n.previousElementSibling) n.previousElementSibling.scrollIntoView();
  }
  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return; cur = b.getAttribute('data-c'); render();
  });
  render();
})();
