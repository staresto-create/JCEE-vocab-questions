<style>
  :root{
    --paper:#F6F1E4; --paper-card:#FFFDF7; --ink:#221F1A; --ink-soft:#5B5648;
    --rule:#DCD3BB; --crimson:#AE3626; --sage:#3E6E52; --sage-soft:#E6EEE7;
    --shadow: 0 1px 0 rgba(34,31,26,.06), 0 8px 24px rgba(34,31,26,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Noto Sans TC',sans-serif;
       font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%;}
  .wrap{max-width:600px; margin:0 auto; padding:0 16px 48px;}
  header.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
             padding:18px 0 10px; border-bottom:3px double var(--ink);}
  header.top .title{font-family:'Noto Serif TC',serif; font-weight:900; font-size:21px;}
  header.top .sub{font-family:'IBM Plex Mono','Noto Sans TC',monospace; font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}
  .note{color:var(--ink-soft); font-size:14.5px; margin:14px 0 12px;}
  .total{background:var(--paper-card); border:1px solid var(--rule); border-radius:3px; box-shadow:var(--shadow);
         padding:14px 16px; margin:0 0 14px;}
  .total .num{font-family:'Noto Serif TC',serif; font-weight:900; font-size:30px; line-height:1.2;}
  .total .num small{font-size:16px; color:var(--ink-soft); font-weight:700;}
  .meter{height:8px; background:var(--rule); border-radius:4px; overflow:hidden; margin:8px 0 2px;}
  .meter i{display:block; height:100%; width:0; background:var(--sage); transition:width .25s;}
  .tabs{display:flex; gap:7px; margin:0 0 10px; position:sticky; top:0; z-index:5; background:var(--paper); padding:8px 0;}
  .tab{flex:1 1 0; font:inherit; font-size:14px; line-height:1.35; background:var(--paper-card); color:var(--ink);
       border:1px solid var(--rule); border-radius:3px; padding:8px 4px; cursor:pointer; text-align:center;}
  .tab b{display:block; font-size:15px;}
  .tab span{font-family:'IBM Plex Mono','Noto Sans TC',monospace; font-size:12px; color:var(--ink-soft);}
  .tab[aria-selected="true"]{background:var(--ink); color:var(--paper-card); border-color:var(--ink);}
  .tab[aria-selected="true"] span{color:#D9D2BF;}
  .tools{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 6px; font-size:14px;}
  .tools label{display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--ink-soft);}
  .tools input{width:18px; height:18px; accent-color:var(--sage);}
  .sec{margin:18px 0 0;}
  .sec h2{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:0 0 6px;
          font-family:'Noto Serif TC',serif; font-weight:700; font-size:18px; border-bottom:1px solid var(--ink); padding-bottom:3px;}
  .sec h2 .cnt{font-family:'IBM Plex Mono','Noto Sans TC',monospace; font-size:12.5px; font-weight:400; color:var(--ink-soft); white-space:nowrap;}
  .sec h2 .cnt.full{color:var(--sage); font-weight:500;}
  .sec.star h2{color:var(--crimson); border-bottom-color:var(--crimson);}
  .utitle{font-size:13.5px; color:var(--crimson); margin:-2px 0 6px;}
  details.gist{background:var(--paper-card); border:1px solid var(--rule); border-radius:3px; margin:0 0 8px; padding:0 12px;}
  details.gist summary{cursor:pointer; font-size:14px; color:var(--ink-soft); padding:8px 0;}
  details.gist p{margin:0 0 10px; font-size:14.5px;}
  details.gist p.en{font-family:Georgia,'Times New Roman',serif; font-size:15.5px; line-height:1.65;}
  details.gist p.zh{color:var(--ink-soft);}
  ul.items{list-style:none; margin:0; padding:0;}
  ul.items li{border-bottom:1px dashed var(--rule);}
  ul.items label{display:flex; gap:11px; align-items:flex-start; padding:9px 2px; cursor:pointer;}
  ul.items input{flex:none; width:22px; height:22px; margin:3px 0 0; accent-color:var(--sage); cursor:pointer;}
  .w{font-weight:700; font-size:16.5px; word-break:break-word;}
  .ph{font-family:'IBM Plex Mono','Lucida Sans Unicode','Noto Sans TC',sans-serif; font-size:13px; color:var(--ink-soft); margin-left:5px;}
  .g{display:block; font-size:14.5px;}
  .lv{font-family:'IBM Plex Mono','Noto Sans TC',monospace; font-size:11.5px; color:var(--sage); margin-left:6px; white-space:nowrap;}
  .c{display:block; font-size:13.5px; color:var(--ink-soft);}
  .c::before{content:"搭配詞　";}
  li.on .w{color:var(--sage);}
  li.on .w, li.on .g{opacity:.72;}
  .onlyleft li.on{display:none;}
  .onlyleft .sec.allon{display:none;}
  .empty{display:none; text-align:center; color:var(--sage); font-family:'Noto Serif TC',serif; font-weight:700; padding:22px 0;}
  .onlyleft .empty.show{display:block;}
  input:focus-visible,.tab:focus-visible,button:focus-visible{outline:2px solid var(--crimson); outline-offset:2px;}
  footer{border-top:1px solid var(--rule); margin-top:28px; padding-top:14px; font-size:13px; color:var(--ink-soft);}
  footer a{color:var(--crimson);}
  .reset{font:inherit; font-size:13px; background:none; border:1px solid var(--rule); border-radius:3px; color:var(--ink-soft);
         padding:6px 12px; cursor:pointer; margin-top:10px;}
  @media (prefers-reduced-motion: reduce){ .meter i{transition:none;} }
</style>
</head>

nk tree roots.", "zh": "植物看起來簡單、容易預料，其實它們的生活比外表複雜得多。有些植物，像荷花和臭菘，會自己產生熱，把氣味散發出去、吸引授粉者。菸草和萊豆遭到昆蟲攻擊的時候，會釋放化學訊號，促使附近的植物加強防禦。在森林的地底下，真菌網路把樹根連在一起。"}, {"s": "9/3", "u": 2, "star": true, "items": [{"w": "harsh", "ph": "[hɑrʃ]", "g": "adj. 嚴酷的、惡劣的；嚴厲的", "lv": "字級 4", "c": []}, {"w": "essential", "ph": "[ɪˋsɛnʃəl]", "g": "adj. 極其重要的、必不可少的", "lv": "字級 4", "c": []}, {"w": "absorb", "ph": "[əbˋsɔrb]", "g": "v. 吸收；理解、掌握（知識）", "lv": "字級 4", "c": []}, {"w": "otherwise", "ph": "[ˋʌðɚˏwaɪz]", "g": "adv. 在其他情況下；以另外的方式；否則", "lv": "字級 4", "c": []}, {"w": "exceed", "ph": "[ɪkˋsid]", "g": "v. 超過、超出（數量、程度等）", "lv": "字級 5", "c": []}, {"w": "physics", "ph": "[ˋfɪzɪks]", "g": "n. 物理學", "lv": "字級 4", "c": []}, {"w": "behavior", "ph": "[bɪˋhevjɚ]", "g": "n. 習性；行為、舉止", "lv": "字級 4", "c": []}], "g": "A", "t": "The Secret Lives of Plants", "en": "Through these connections, trees exchange nutrients and support younger, shaded neighbors, which suggests that cooperation plays a part in forest survival. To conserve water, cacti open their stomata at night rather than during the day. Trees cannot grow endlessly upward: the taller a tree grows, the harder it becomes for water to reach its highest branches. Mature sunflowers settle into a fixed eastward-facing position. Sometimes, stillness is the smarter strategy.", "zh": "樹木透過這些連結交換養分，還會支援年紀較小、照不到陽光的鄰居，這表示合作也是森林生存的一環。為了保存水分，仙人掌在夜間而不是白天打開氣孔。樹木也不能無止境地往上長：樹長得越高，水就越難送到最高的枝頭。至於成熟的向日葵，則會固定朝向東方。有時候，靜止不動才是比較聰明的策略。"}, {"s": "9/4", "u": null, "star": false, "items": [{"w": "recipe", "ph": "[ˋrɛsəpi]", "g": "n. 食譜；烹飪法", "lv": "字級 4", "c": []}, {"w": "pasta", "ph": "[ˋpɑstə]", "g": "n. 義大利麵食（統稱）", "lv": "字級 4", "c": []}, {"w": "variation", "ph": "[ˏvɛriˋeʃən]", "g": "n. 變體；變化形式", "lv": "字級 5", "c": []}, {"w": "combination", "ph": "[ˏkɑmbəˋneʃən]", "g": "n. 組合；結合（文中指「配料組合」）", "lv": "字級 4", "c": []}, {"w": "ultimately", "ph": "[ˋʌltəmətli]", "g": "adv. 說到底、歸根究柢；最終", "lv": "字級 5", "c": []}, {"w": "generation", "ph": "[ˏdʒɛnəˋreʃən]", "g": "n. 世代；一代人", "lv": "字級 4", "  a former raised railway, the High Line lets visitors walk above the city's bustle in peaceful surroundings. SoHo, with its vibrant artistic atmosphere, combines art galleries and boutiques with 19th-century cast-iron architecture. The 9/11 Memorial & Museum is a place of quiet reflection where visitors pay their respects. At Yankee Stadium, fans can step into the heart of American sports culture.", "zh": "高架公園建在一條舊的高架鐵路上，遊客可以在城市的喧囂之上、在寧靜的環境裡散步。蘇活區充滿藝術氣息，藝廊和精品小店配上十九世紀的鑄鐵建築。九一一紀念館與博物館是讓人靜心追思的地方，遊客在這裡表達敬意。至於洋基體育場，球迷在那裡可以走進美國運動文化的核心。"}, {"s": "9/15", "u": 8, "star": true, "items": [{"w": "coincidence", "ph": "[koˋɪnsədəns]", "g": "n. 巧合；碰巧的事", "lv": "字級 5", "c": []}, {"w": "invade", "ph": "[ɪnˋved]", "g": "v. 入侵、侵略；侵犯", "lv": "字級 4", "c": []}, {"w": "overthrow", "ph": "[ˏovɚˋθro]", "g": "v. （尤指以武力）推翻、打倒（動詞三態為overthrow–overthrew–overthrown）", "lv": "字級 4", "c": []}, {"w": "rigid", "ph": "[ˋrɪdʒəd]", "g": "adj. 僵化的、不易改變的；死板的", "lv": "字級 5", "c": []}, {"w": "labor", "ph": "[ˋlebɚ]", "g": "v. 勞動；辛苦工作（文中為現在分詞作形容詞用，表示「勞動的」）", "lv": "字級 4", "c": []}, {"w": "peasant", "ph": "[ˋpɛzn̩t]", "g": "n. （尤指舊時的）農民、佃農", "lv": "字級 5", "c": []}], "g": "A", "t": "Beef Versus Cow: The Linguistic History Hidden on Your Plate", "en": "In most languages, one word names both a living animal and the meat it produces, but English is a curious outlier: a farmer tends to cows and pigs, while a diner orders beef and pork. The divide goes back to 1066, when William the Conqueror invaded England and overthrew the Anglo-Saxon monarchy. The French-speaking Normans became the ruling aristocracy, and the Anglo-Saxon peasants, who raised the livestock, kept speaking Old English.", "zh": "在大多數語言裡，活的動物和牠提供的肉用同一個字，英文卻是個奇特的例外：農夫照顧的是 cow 和 pig，客人點的卻是 beef 和 pork。這個分歧要追溯到 1066 年，征服者威廉入侵英格蘭，推翻了盎格魯撒克遜王朝。從此說法語的諾曼人成為統治貴族，飼養牲畜的盎格魯撒克遜農民則繼續說古英語。"}, {"s": "9/16", "u": 8, "star": true, "items": [{"w": "noble", "ph": "[ˋnobəl]", "g": "n. 貴族；品德高尚的人", "lv": "字級 4", "c": []}, {"w": "encounter", "ph": "[ɪnˋkaʊntɚ]", "g": "v. （偶然）遇到；遭遇", "lv": "字級 4", "c": []}, {"w": "feast", "ph": "[fist]", "g": "n. 盛宴、宴會", "lv": "字級 4", "c": []}, {"w": "merge", "ph": "[mɝdʒ]", "g": "v. （公司、部門等）合併、融合、結合（可作及物或不及物動詞）", "lv": "字級 5", "c": []}, {"w": "distinct", "ph": "[dɪˋstɪŋkt]", "g": "adj. 有所區分的、截然不同的；顯著的", "lv": "字級 4", "c": []}, {"w": "endure", "ph": "[ɪnˋdʊr]", "g": "v. 持續存在、持久（不及物）；忍受、忍耐（及物）", "lv": "字級 4", "c": []}, {"w": "reminder", "ph": "[rɪˋmaɪndɚ]", "g": "n. 提醒物；提醒的人或事；提示", "lv": "字級 5", "c": []}], "g": "A", "t": "Beef Versus Cow: The Linguistic History Hidden on Your Plate", "en": "Meanwhile, the Norman nobles only saw these animals as dishes served at lavish feasts, so they used French terms that evolved into “beef,” “pork,” and “mutton.” As the two cultures merged, both sets of words survived. Chicken and fish, eaten by all social classes, kept their Germanic names. Today, this duality endures as a reminder that the words we use still carry the weight of history.", "zh": "另一方面，諾曼貴族只在奢華的宴席上看到這些動物做成的菜，所以用法文稱呼牠們，這些字後來演變成 beef、pork 和 mutton。兩種文化融合之後，兩套字都保留了下來。至於各階級都吃的雞和魚，則保留原本的日耳曼語名稱。這種雙重用字一直延續到今天，提醒我們平常用的字仍然承載著歷史的重量。"}, {"s": "9/17", "u": 9, "star": true, "items": [{"w": "presentation", "ph": "[ˏprizɛnˋteʃən]", "g": "n. 報告、簡報；授予；呈現", "lv": "字級 4", "c": []}, {"w": "boost", "ph": "[bust]", "g": "v. 提升、增加；推動、促進（文中mood-boosting表示「提振心情的」）", "lv": "字級 5", "c": []}, {"w": "accomplish", "ph": "[əˋkɑmplɪʃ]", "g": "v. 完成；達成、實現", "lv": "字級 4", "c": []}, {"w": "purchase", "ph": "[ˋpɝtʃəs]", "g": "n. 購買之物、購買行為v.購買、採購", "lv": "字級 5", "c": []}, {"w": "trigger", "ph": "[ˋtrɪgɚ]", "g": "v. 引發、觸發n.誘因；扳機", "lv": "字級 5", "c": []}, {"w": "psychology", "ph": "[saɪˋkɑlədʒi]", "g": "n. 心理學", "lv": "字級 4", "c": []}, {"w": "stability", "ph": "[stəˋbɪləti]", "g": "n. 穩定（性）；穩固", "lv": "字級 5", "c": []}], "g": "A", "t": "Dress to De-Stress: How the Clothes You Wear Can Impact Your Mood", "en": "When nothing in your wardrobe feels right, what you need is a dose of dopamine dressing, which means choosing clothes for their mood-boosting powers. Wearing clothes we like can trigger dopamine, the “happiness hormone.” Color also matters: according to color psychology, blue tends to convey calmness, red is capable of raising heart rates, and green is linked to greater creativity.", "zh": "如果衣櫃裡怎麼挑都不對勁，你需要的是來一點「多巴胺穿搭」，也就是挑選能提振心情的衣服。穿上自己喜歡的衣服，會觸發大腦分泌多巴胺這種「快樂荷爾蒙」。顏色也有影響：根據色彩心理學，藍色通常給人平靜的感覺，紅色能讓心跳加快，綠色則和更好的創造力有關。"}, {"s": "9/18", "u": 9, "star": true, "items": [{"w": "participant", "ph": "[pɑrˋtɪsəpənt]", "g": "n. 參加者、參與者", "lv": "字級 5", "c": []}, {"w": "implication", "ph": "[ˏɪmpləˋkeʃən]", "g": "n. 可能的影響、後果（作此義時常用複數）；含意、暗示", "lv": "字級 5", "c": []}, {"w": "motivation", "ph": "[ˏmotəˋveʃən]", "g": "n. 動機、動力；積極性", "lv": "字級 4", "c": []}, {"w": "polished", "ph": "[ˋpɑlɪʃt]", "g": "adj. 優雅的；得體的；精緻熟練的", "lv": "字級 4", "c": []}, {"w": "outfit", "ph": "[ˋaʊtˏfɪt]", "g": "n. 全套服裝；穿搭", "lv": "字級 5", "c": []}, {"w": "reinforce", "ph": "[ˏriənˋfɔrs]", "g": "v. 強化、加強；鞏固", "lv": "字級 5", "c": []}, {"w": "accessible", "ph": "[ækˋsɛsəbəl]", "g": "adj. 可取得的、可使用的；易接近的", "lv": "字級 5", "c": []}], "g": "A", "t": "Dress to De-Stress: How the Clothes You Wear Can Impact Your Mood", "en": "A closely related concept is enclothed cognition, the idea that what we wear shapes our mindset. In one well-known study, participants who wore white lab coats scored significantly better on attention tests. All of this has practical implications: dress for the task at hand. Used thoughtfully, your wardrobe is one of the most accessible tools for managing your mood and improving your focus.", "zh": "一個密切相關的概念是「衣著認知」，意思是我們穿的衣服會塑造我們的心態。在一項知名的研究裡，穿上白色實驗袍的受試者，注意力測驗的成績明顯比較好。這一切都有實際的用處，也就是依照手邊要做的事情來穿衣服。只要用心搭配，衣櫃就是最容易取得的工具之一，可以幫你調節心情、提升專注力。"}, {"s": "9/21", "u": null, "star": false, "items": [{"w": "disqualify", "ph": "[dɪsˋkwɑləˏfaɪ]", "g": "v. 取消……的資格；判定無資格", "lv": "超出字表", "c": []}, {"w": "revise", "ph": "[rɪˋvaɪz]", "g": "v. 修改、修正；修訂（文中為過去分詞作形容詞，表示「修正後的」）", "lv": "字級 4", "c": []}, {"w": "aerospace", "ph": "[ˋɛroˏspes]", "g": "adj. 航空太空的； : "字級 6", "c": []}, {"w": "massive", "ph": "[ˋmæsɪv]", "g": "adj. 巨大的；大規模的；大量的", "lv": "字級 5", "c": []}, {"w": "vomit", "ph": "[ˋvɑmət]", "g": "v. 嘔吐", "lv": "字級 5", "c": []}, {"w": "physician", "ph": "[fəˋzɪʃən]", "g": "n. 醫生（尤指內科醫生）", "lv": "字級 4", "c": []}, {"w": "dose", "ph": "[dos]", "g": "n. 一次的服用量、劑量", "lv": "字級 3", "c": []}, {"w": "established", "ph": "[ɪˋstæblɪʃt]", "g": "adj. 已確立的、已被接受的；備受尊重的", "lv": "字級 4", "c": []}, {"w": "undergo", "ph": "[ˏʌndɚˋgo]", "g": "v. 經歷、接受、遭受（動詞三態為undergo–underwent–undergone）", "lv": "字級 5", "c": []}], "g": "A", "t": "Anesthesia: The Discovery That Transformed Medicine", "en": "This all changed in 1846, when an American dentist named William Morton demonstrated the use of ether. It was a miraculous breakthrough, but it wasn't perfect: ether often made patients cough or vomit, and it could easily catch fire. Chloroform was used instead, and the physician John Snow worked out the right dose. Today, we may take anesthesia for granted, but we should remember how lucky we are to have it.", "zh": "這一切在 1846 年有了轉變，美國牙醫莫頓示範了乙醚的用法。這是一項奇蹟般的突破，卻不完美：乙醚常讓病人咳嗽或嘔吐，而且很容易起火。後來醫界改用氯仿，英國醫師約翰．斯諾算出了正確的劑量。今天我們或許把麻醉視為理所當然，但應該記得自己能有它是多麼幸運。"}, {"s": "9/30", "u": null, "star": false, "items": [{"w": "solo", "ph": "[ˋsolo]", "g": "adj. 單人的；獨自進行的；獨唱的、獨奏的", "lv": "字級 5", "c": []}, {"w": "flexibility", "ph": "[ˏflɛksəˋbɪləti]", "g": "n. 靈活性、彈性", "lv": "字級 5", "c": []}, {"w": "compromise", "ph": "[ˋkɑmprəˏmaɪz]", "g": "v. 妥協、折衷、讓步", "lv": "字級 5", "c": []}, {"w": "destination", "ph": "[ˏdɛstəˋneʃən]", "g": "n. 目的地；終點", "lv": "字級 5", "c": []}, {"w": "split", "ph": "[splɪt]", "g": "v. 分攤、分享；分開；分裂", "lv": "字級 4", "c": []}, {"w": "arise", "ph": "[əˋraɪz]", "g": "v. 發生、出現；產生（較正式，常指抽象問題；動詞三態為arise–arose–arisen）", "lv": "字級 4", "c": []}, {"w": "occasionally", "ph": "[əˋkeʒənəli]", "g": "adv. 偶爾、有時", "lv": "字級 4", "c": []}], "g": "A"}];
var KEY = "exam1-checklist-v1";
var on = {};
try{ on = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }catch(e){ on = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(on)); }catch(e){} }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function id(s, w){ return s + "|" + w; }

var list = document.getElementById("list");
var html = "";
DATA.forEach(function(s, si){
  html += '<section class="sec' + (s.star ? ' star' : '') + '" data-g="' + s.g + '" data-si="' + si + '">';
  html += '<h2><span>' + (s.star ? '★ ' : '') + esc(s.s) + (s.u ? '　ALL+ U' + s.u : '') + '</span><span class="cnt"></span></h2>';
  if (s.star){
    html += '<p class="utitle">' + esc(s.t) + '</p>';
    html += '<details class="gist"><summary>看這天的大意</summary><p class="en">' + esc(s.en) + '</p><p class="zh">' + esc(s.zh) + '</p></details>';
  }
  html += '<ul class="items">';
  s.items.forEach(function(it){
    var k = id(s.s, it.w);
    html += '<li' + (on[k] ? ' class="on"' : '') + '><label><input type="checkbox" data-k="' + esc(k) + '"' + (on[k] ? ' checked' : '') + '>';
    html += '<span><span class="w">' + esc(it.w) + '</span>' + (it.ph ? '<span class="ph">' + esc(it.ph) + '</span>' : '');
    html += '<span class="g">' + esc(it.g) + (it.lv ? '<span class="lv">' + esc(it.lv) + '</span>' : '') + '</span>';
    (it.c || []).forEach(function(c){ html += '<span class="c">' + esc(c) + '</span>'; });
    html += '</span></label></li>';
  });
  html += '</ul></section>';
});
list.innerHTML = html;

var cur = "L";
function counts(){
  var tot = 0, done = 0, grp = {L:[0,0], U:[0,0], A:[0,0]};
  DATA.forEach(function(s, si){
    var d = 0;
    s.items.forEach(function(it){ if (on[id(s.s, it.w)]) d++; });
    tot += s.items.length; done += d;
    grp[s.g][0] += d; grp[s.g][1] += s.items.length;
    var sec = list.querySelector('[data-si="' + si + '"]');
    var c = sec.querySelector(".cnt");
    c.textContent = "已背 " + d + "／" + s.items.length;
    c.classList.toggle("full", d === s.items.length);
    sec.classList.toggle("allon", d === s.items.length);
  });
  document.getElementById("tn").innerHTML = done + ' <small>／ ' + tot + ' 個已背熟</small>';
  document.getElementById("tm").style.width = (tot ? done / tot * 100 : 0) + "%";
  ["L","U","A"].forEach(function(g){ document.getElementById("c" + g).textContent = grp[g][0] + "／" + grp[g][1]; });
  var g = grp[cur];
  document.getElementById("empty").classList.toggle("show", g[0] === g[1]);
}
function show(g){
  cur = g;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){ t.setAttribute("aria-selected", t.getAttribute("data-g") === g ? "true" : "false"); });
  Array.prototype.forEach.call(list.querySelectorAll(".sec"), function(s){ s.hidden = s.getAttribute("data-g") !== g; });
  document.getElementById("anote").hidden = g !== "A";
  counts();
}
list.addEventListener("change", function(e){
  var t = e.target; if (!t.matches || !t.matches("input[data-k]")) return;
  var k = t.getAttribute("data-k");
  if (t.checked) on[k] = 1; else delete on[k];
  t.closest("li").classList.toggle("on", t.checked);
  save(); counts();
});
Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
  t.addEventListener("click", function(){ show(t.getAttribute("data-g")); window.scrollTo(0, 0); });
});
document.getElementById("only").addEventListener("change", function(e){
  document.body.classList.toggle("onlyleft", e.target.checked);
});
document.getElementById("reset").addEventListener("click", function(){
  if (!confirm("確定要清除這一台裝置上的所有勾選嗎？清除之後無法復原。")) return;
  on = {}; save();
  Array.prototype.forEach.call(list.querySelectorAll("input[data-k]"), function(i){ i.checked = false; i.closest("li").classList.remove("on"); });
  counts();
});
show("L");
})();
