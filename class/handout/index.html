<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>龍騰課本講義與練習</title><style>
:root{--bg:#E9EEF3;--surface:#fff;--fg:#1C2431;--muted:#566274;--line:#C9D2DD;--ac:#A8520F;--shadow:0 1px 0 rgba(28,36,49,.05),0 12px 28px -16px rgba(28,36,49,.35)}
@media (prefers-color-scheme:dark){:root{--bg:#131922;--surface:#1C2430;--fg:#E8EDF3;--muted:#A4AFBE;--line:#333E4E;--ac:#F0AB66}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6;padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.app{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:21px;line-height:1.3}.how{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ac);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:18px}.card .sub{margin:0;font-size:13px;color:var(--muted)}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.btns a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;font-size:15px;text-align:center}
.btns a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.soon{margin:0;font-size:14px;color:var(--muted)}
</style></head>
<body><div class="app"><div><h1>龍騰課本講義與練習</h1><p class="how">請選擇你的身分，進入對應的頁面。</p></div><section class="card"><div class="btns"><a href="outside.html">校外版</a><a href="school.html">校內版</a></div><p class="sub">校外版：只含課本內容。校內版：另含學校課堂使用的內容。</p></section></div></body></html>
