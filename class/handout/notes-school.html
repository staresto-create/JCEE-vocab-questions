<style>
:root{--bg:#E9EEF3;--surface:#fff;--fg:#1C2431;--muted:#566274;--line:#C9D2DD;--ac:#A8520F;--link:#1F5F8B;--hl:#FFF3C4;--shadow:0 1px 0 rgba(28,36,49,.05),0 12px 28px -16px rgba(28,36,49,.35)}
@media (prefers-color-scheme:dark){:root{--bg:#131922;--surface:#1C2430;--fg:#E8EDF3;--muted:#A4AFBE;--line:#3A475A;--ac:#F0AB66;--link:#8FC4E8;--hl:#4A4220;--shadow:0 12px 28px -16px rgba(0,0,0,.75)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.65;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));-webkit-text-size-adjust:100%}
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:21px;line-height:1.3}
.how{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ac);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:18px}
.sub{margin:0;font-size:13.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.list a,.btns a,.chips button{display:flex;align-items:center;min-height:48px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;font-size:16px}
.list a{justify-content:space-between;gap:12px}
.list b{margin-right:6px;white-space:nowrap}
.list .n{color:var(--muted);font-size:13px;white-space:nowrap}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.btns a{justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;cursor:pointer;min-height:44px}
.chips button[aria-pressed=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){.chips button[aria-pressed=true]{color:#131922}}
input[type=search]{width:100%;min-height:48px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:inherit}
.words{display:flex;flex-direction:column}
.w{padding:10px 0;border-top:1px solid var(--line)}
.w:first-child{border-top:0}
.w .h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.w .en{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:18px}
.w .pos{color:var(--muted);font-size:14px}
.w .zh{margin-top:2px}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.refs a{display:inline-flex;align-items:center;min-height:44px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;color:var(--link);text-decoration:none;font-size:15px;white-space:nowrap}
.none{color:var(--muted);padding:8px 0}
details{border-top:1px solid var(--line);padding:6px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;flex-wrap:wrap;row-gap:0;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";margin-right:8px;color:var(--ac)}
details[open] summary::before{content:"▾"}
.s{padding:8px 0;border-top:1px dashed var(--line)}
.s .no{display:inline-block;min-width:3.2em;color:var(--ac);font-weight:700}
.s .t{font-family:Georgia,'Times New Roman',serif;font-size:17px}
.s .ln{display:flex;align-items:center;min-height:44px;color:var(--link);font-size:14px;margin-left:4px}
.src{color:var(--muted);font-size:12.5px}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.spk{margin-left:.2rem;min-height:44px;min-width:44px;border-radius:6px;font-size:16px;align-items:center;justify-content:center}
.spkset{margin:0}
.spkv{min-height:44px;padding:.3rem .7rem;border-radius:6px}

.jump{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.jump button{font:inherit;cursor:pointer;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.s:target{background:var(--hl)}
.s{scroll-margin-top:12px}
.sum2{display:block;font-weight:400;font-size:13.5px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:3px}
</style>

<script>
(function(){
var DATA={"lessons":{"L4":{"title":"Day of the Dead: A Joyous Celebration of Death","pages":15,"url":"l4-school.html","sents":[{"n":1,"p":1,"en":"Have you ever thought about what it would be like to have a deceased loved one return and accompany you to a holiday celebration?","v":[["deceased","adj.","已故的"],["loved one","n.","[C] 摯愛的人（親人）"],["accompany","vt.","陪伴"],["celebration","n.","[C, U] 慶典"]]},{"n":2,"p":2,"en":"The idea may scare you to death or at least make your hair stand on end, but this is the essential concept behind the Mexican festival called the Day of the Dead, when people celebrate death with joy and humor rather than mourn it with sorrow.","v":[["essential","adj.","本質的；基本的"],["concept","n.","[C] 概念"],["mourn","vt.","哀悼"],["sorrow","n.","[U] 悲傷"]]},{"n":3,"p":3,"en":"On this joyous occasion, family members gather for a reunion in honor of those who have moved on to the afterlife.","v":[["joyous","adj.","令人愉快的"],["occasion","n.","[C] 場合"],["reunion","n.","[C] 團聚"],["afterlife","n. sing.","死後的世界"]]},{"n":4,"p":3,"en":"The Day of the Dead is thought to have originated centuries ago with the Aztecs.","v":[["originate","vi.","起源；源自"],["Aztec","n.","[C] 阿茲特克人（墨西哥的古老民族）"]]},{"n":5,"p":4,"en":"Nowadays, it is celebrated passionately throughout Mexico on November 1 and 2.","v":[["passionately","adv.","熱情地"]]},{"n":6,"p":4,"en":"Traditionally, deceased children are honored on Nov. 1, while Nov. 2 is the day when departed adults are the main focus.","v":[["honor","vt.","紀念；向……致敬"],["departed","adj.","已逝的"],["focus","n.","[C] 焦點"]]},{"n":7,"p":5,"en":"During these two days, the souls of the dead are believed to return to earth to visit the living members of their family.","v":[["soul","n.","[C] 靈魂"],["living","adj.","活著的；在世的"]]},{"n":8,"p":6,"en":"Instead of fearing these spirits, Mexicans anticipate their arrival and prepare for it by purchasing necessary items in local markets in advance.","v":[["spirit","n.","[C] 亡靈；靈魂"],["anticipate","vt.","期盼"],["arrival","n.","[U] 到來"],["purchase","vt.","購買"]]},{"n":9,"p":6,"en":"These include marigolds, candles, decorated sugar skulls bearing the names of departed family members, and “bread of the dead.”","v":[["marigold","n.","[C] 萬壽菊"],["decorated","adj.","裝飾過的"],["sugar skull","n.","[C] 糖骷髏頭"],["bear","vt.","帶有；刻有"]]},{"n":10,"p":7,"en":"Families also tidy and restore the graves and cemeteries where their family members are buried to welcome the souls home.","v":[["tidy","vt.","整理"],["restore","vt.","修復"],["grave","n.","[C] 墳墓"],["cemetery","n.","[C] 墓地"],["bury","vt.","埋葬"]]},{"n":11,"p":7,"en":"On the Day of the Dead, families assemble colorful altars in their homes to welcome returning spirits.","v":[["assemble","vt.","架設；組裝"],["altar","n.","[C] 祭壇"],["returning","adj.","歸來的"]]},{"n":12,"p":8,"en":"On the altars, they place photographs of their deceased loved ones as well as beverages and dishes that those family members had a preference for while alive.","v":[["beverage","n.","[C] 飲料"],["dish","n.","[C] 菜餚"],["preference","n. sing.","偏愛"]]},{"n":13,"p":9,"en":"After this warm reception for the souls at home, it is usually late in the evening, and families head to the cemetery, where they decorate the graves of their loved ones and light one candle for each dead person.","v":[["reception","n. sing.","歡迎；接待"],["cemetery","n.","[C] 墓地"],["decorate","vt.","裝飾"],["light","vt.","點燃"]]},{"n":14,"p":10,"en":"Cheerful and merry, they feast with the honored souls and pray till dawn, transforming the normally horrifying graveyard into a venue of joy and celebration for the entire night.","v":[["cheerful","adj.","興高采烈的"],["merry","adj.","歡樂的"],["feast","vi.","盡情享用"],["dawn","n.","[U] 黎明"],["transform","vt.","使轉變；使變成"],["horrifying","adj.","令人恐懼的"],["graveyard","n.","[C] 墓地"],["venue","n.","[C] 場所"]]},{"n":15,"p":11,"en":"Throughout the festival, colorful, cartoon-like representations of the dead can be seen everywhere.","v":[["throughout","prep.","自始至終；整個……期間"],["representation","n.","[C, U] 代表物；形象"]]},{"n":16,"p":11,"en":"These include skeleton and skull cookies, candies, flags, and toys.","v":[["skeleton","n.","[C] 骷髏；骨骼"],["skull","n.","[C] 頭骨"]]},{"n":17,"p":12,"en":"Many people also dress up in skeleton costumes, paint their faces to resemble skulls, and participate in performances and street parades.","v":[["costume","n.","[C, U] 服裝；戲服"],["resemble","vt.","看起來像"],["performance","n.","[C] 表演"],["parade","n.","[C] 遊行"]]},{"n":18,"p":12,"en":"While doing so, Mexicans aren’t mocking death.","v":[["mock","vt.","嘲弄"]]},{"n":19,"p":13,"en":"Instead, they are recognizing it as an inevitable part of the natural cycle and would rather embrace it than ignore it.","v":[["inevitable","adj.","不可避免的"],["cycle","n.","[C] 循環"],["embrace","vt.","擁抱；欣然接受"],["ignore","vt.","忽視"]]},{"n":20,"p":14,"en":"By inviting the dead to return and sharing the pleasures of life with them, Mexicans are celebrating the cycle of life itself.","v":[["pleasure","n.","[C, U] 樂趣；愉快"]]},{"n":21,"p":14,"en":"The Mexican Day of the Dead is an annual national event that brings together living hosts and non-living guests of honor.","v":[["annual","adj.","每年的"],["guest of honor","n.","[C] 貴賓"]]},{"n":22,"p":15,"en":"Hopefully, this tradition will never die out, since it helps people accept a fact of life that awaits us all.","v":[["fact of life","n.","[C] 無法改變的現實"],["await","vt.","等待"]]},{"n":23,"p":15,"en":"If we cannot escape death, why not celebrate it?","v":[["escape","vt.","避免（同 avoid）"]]}]},"L5":{"title":"Kyoto: The Heart of Japan","pages":20,"url":"l5-school.html","sents":[{"n":1,"p":1,"en":"Kyoto, like a beauty in a bright and colorful kimono, delights tourists throughout the year.","v":[["Kyoto","n.","京都"],["kimono","n.","[C] 和服"]]},{"n":2,"p":2,"en":"In spring romance is in the air as the city is filled with a sea of pink cherry blossoms.","v":[["cherry","n.","[C] 櫻桃；櫻桃樹（cherry blossom＝櫻花）"],["blossom","n.","[C, U] 花朵；開花"]]},{"n":3,"p":3,"en":"In summer, green leaves can be heard rustling in the wind and seen sparkling in the sunshine.","v":[["rustle","vi.","沙沙作響"]]},{"n":4,"p":4,"en":"Maple leaves in autumn set the landscape on fire with orange and red colors.","v":[["maple","n.","[C] 楓樹"],["landscape","n.","[C] 景色；風景（通常用單數）"]]},{"n":5,"p":4,"en":"Then, when winter comes, white snow turns the whole city into a magic, silver kingdom.","v":[]},{"n":6,"p":5,"en":"Apart from its natural splendor, Kyoto has so much more to feast one's eyes on.","v":[["splendor","n.","[U] 壯麗；雄偉"]]},{"n":7,"p":6,"en":"Having previously been the capital of Japan for over a thousand years, the city boasts a large number of historic shrines and temples.","v":[["previously","adv.","以前；先前"],["capital","n.","[C] 首都"],["boast","vt.","以……為傲；擁有"],["historic","adj.","歷史悠久的；歷史上著名的"],["shrine","n.","[C] 神社"]]},{"n":8,"p":7,"en":"No visit to Kyoto would be complete without seeing one of the most photographed landmarks: the Kinkaku-ji, or the Golden Pavilion Temple in English.","v":[["Kinkaku-ji","n.","金閣寺"],["Golden Pavilion Temple","n.","金閣寺（Kinkaku-ji 的英文名稱）"]]},{"n":9,"p":8,"en":"With giant, leafy maple trees leading up to its main entrance, what comes into view is this magnificent three-story pavilion.","v":[["entrance","n.","[C] 大門；入口"],["magnificent","adj.","壯麗的；雄偉的"]]},{"n":10,"p":9,"en":"Rising up behind a crystal-clear pond, it is covered in sparkling gold leaf and crowned with a large bronze phoenix on its shimmering roof.","v":[["crystal-clear","adj.","清澈的"],["bronze","adj.","青銅（製）的"],["phoenix","n.","[C] 鳳凰"],["shimmering","adj.","閃閃發光的"]]},{"n":11,"p":10,"en":"The reflection of the pavilion on the glassy surface of the pond is a breathtaking sight.","v":[["breathtaking","adj.","驚人的；極為美麗的"]]},{"n":12,"p":11,"en":"Visitors can take a leisurely walk through the surrounding gardens and enjoy many stunning views of this beautiful structure.","v":[["leisurely","adj.","悠閒的"],["stunning","adj.","撼動人心的；令人驚豔的"]]},{"n":13,"p":12,"en":"Another unforgettable Kyoto sight involves coming face to face with one of the old capital's very special \"persons of art,\" or geishas.","v":[["geisha","n.","[C] 藝妓"]]},{"n":14,"p":13,"en":"These are women dressed in delicate kimonos with silk sleeves.","v":[["delicate","adj.","精美的"]]},{"n":15,"p":14,"en":"Their distinctive white makeup, bright red lipstick, and elegant hairpins also make them easy to recognize.","v":[["distinctive","adj.","獨特的"],["lipstick","n.","[U] 口紅"],["elegant","adj.","雅致的"],["hairpin","n.","[C] 髮簪；髮夾"]]},{"n":16,"p":15,"en":"And it's not just their unique appearance that makes geishas stand out from the crowd.","v":[["appearance","n.","[C] 外表"]]},{"n":17,"p":16,"en":"These highly skilled entertainers spend years mastering different musical instruments, songs, and literature.","v":[["literature","n.","[U] 文學；文學作品"]]},{"n":18,"p":17,"en":"Of course, no \"person of art\" could be a true geisha without being able to perform the traditional kyomai dance.","v":[["kyomai","n.","京舞"]]},{"n":19,"p":18,"en":"This ancient art combines slow music with very deliberate movements and often expresses very deep emotion.","v":[["deliberate","adj.","（動作等）小心翼翼的"]]},{"n":20,"p":18,"en":"In Kyoto, culture and natural beauty flow together like the graceful motions of kyomai.","v":[]},{"n":21,"p":19,"en":"Regardless of the season, the city is a must-see destination for tourists seeking an authentic local experience.","v":[["must-see","adj.","必看的；不可錯過的"],["destination","n.","[C] 目的地"]]},{"n":22,"p":20,"en":"Those who visit are likely to end up falling in love with the heart of Japan.","v":[]}]},"L6":{"title":"The Country of the Blind","pages":27,"url":"l6-school.html","sents":[{"n":1,"p":1,"en":"Nuñez, an experienced mountaineer, was climbing up one of Ecuador's highest mountains when he lost his footing.","v":[["mountaineer","n.","[C] 登山家"],["Ecuador","n.","厄瓜多（位於南美洲西北部的國家）"],["lose one's footing","","失足；跌倒"]]},{"n":2,"p":2,"en":"He slid down a snowy slope and fell over a cliff edge, tumbling a great distance.","v":[["slope","n.","[C] 斜坡；坡地"],["cliff","n.","[C] 懸崖"],["tumble","vi.","滾落"]]},{"n":3,"p":2,"en":"Bruised and dazed, he found himself in a place cut off from the world.","v":[["bruised","adj.","瘀傷的；碰傷的"],["dazed","adj.","暈眩的"]]},{"n":4,"p":3,"en":"Despite his injuries, Nuñez struggled to his feet and set off to explore.","v":[["set off","","出發；啟程"]]},{"n":5,"p":4,"en":"As he made his way through the unfamiliar land, he came upon an unusual village.","v":[["come upon","","偶然遇到；偶然發現"]]},{"n":6,"p":5,"en":"The houses were unevenly painted, and all the roads leading to the houses had low walls alongside them.","v":[["unevenly","adv.","不均勻地；不規則地"],["alongside","prep.","在……旁邊"]]},{"n":7,"p":6,"en":"It didn't take long for Nuñez to realize that every villager was blind.","v":[]},{"n":8,"p":7,"en":"Feeling superior to these sightless people, he thought to himself, “In the country of the blind, the one-eyed man is king.”","v":[["superior","adj.","優於；更好的（後面接 to）"],["sightless","adj.","看不見的；眼盲的"]]},{"n":9,"p":8,"en":"However, after spending time with the locals, he was amazed at their great knowledge.","v":[]},{"n":10,"p":8,"en":"Though blind, they knew their mountain kingdom intimately.","v":[["intimately","adv.","了如指掌地；密切地"]]},{"n":11,"p":9,"en":"The villagers skillfully farmed and moved around by using their keen senses of hearing, touch, and smell.","v":[["skillfully","adv.","熟練地"]]},{"n":12,"p":9,"en":"They also employed effective techniques for growing crops and caring for animals.","v":[["crop","n.","[C] 作物；農作物"],["care for","","照顧；照料（同 look after、take care of）"]]},{"n":13,"p":10,"en":"The paths, lined with low walls, had been specially built to help them navigate safely.","v":[["path","n.","[C] 小路；小徑"],["navigate","vi.","（人）行走、確認方向；（船隻、車輛等）航行"]]},{"n":14,"p":11,"en":"Among the villagers, a respected elder named Yacob put the outsider to work and began teaching him their ways.","v":[["outsider","n.","[C] 外人；外來者"]]},{"n":15,"p":12,"en":"Gradually, Nuñez adapted to their way of life, but he clung to the reality of sight.","v":[["adapt","vi. vt.","（使）適應；（使）適合"],["cling","vi.","抓緊；緊握（cling — clung — clung）"],["cling to","","堅持；堅信"]]},{"n":16,"p":13,"en":"To him, vision was as real as the air he breathed.","v":[]},{"n":17,"p":14,"en":"Although he tried to explain what he saw, he failed to make them understand what it meant to have vision.","v":[]},{"n":18,"p":15,"en":"The more he spoke of high mountains and twinkling stars, the more the villagers pitied him.","v":[["twinkle","vi.","閃耀；閃爍"],["pity","vt.","憐憫；同情"]]},{"n":19,"p":16,"en":"Nuñez felt frustrated at the villagers' lack of awe for his precious gift of sight.","v":[["awe","n.","[U] 敬畏"]]},{"n":20,"p":17,"en":"It wasn't until he first laid eyes on Yacob's daughter, Medina-saroté, that he began to feel better.","v":[["lay eyes on","","看見；注意到"]]},{"n":21,"p":18,"en":"No one else admired Medina's beauty, as she had well-defined features that lacked the smoothness the villagers valued.","v":[["well-defined","adj.","輪廓分明的"],["smoothness","n.","[U] 平滑；細緻"]]},{"n":22,"p":19,"en":"Furthermore, her weak voice was neither powerful nor pleasing enough to meet their standards.","v":[]},{"n":23,"p":19,"en":"Nuñez alone recognized her beauty, and he soon fell in love with her.","v":[]},{"n":24,"p":20,"en":"Yet as their relationship blossomed, their desire to marry faced fierce opposition from the other villagers, who viewed Nuñez's “sight” as a dangerous delusion that needed to be “cured.”","v":[["opposition","n.","[U] 反對；反抗"],["delusion","n.","[C] 妄想；幻覺"]]},{"n":25,"p":21,"en":"Worst of all, even Medina herself agreed with them.","v":[["worst of all","","最糟的是"]]},{"n":26,"p":21,"en":"She persuaded Nuñez to remove the peculiar orbs on either side of his nose.","v":[["peculiar","adj.","奇怪的；不尋常的"],["orb","n.","[C] 球狀物（此處指眼球）"]]},{"n":27,"p":22,"en":"That way, he could stop daydreaming and truly become one of them.","v":[["daydream","vi.","做白日夢"]]},{"n":28,"p":22,"en":"In return for Nuñez's great sacrifice, she agreed to marry him.","v":[["in return (for)","","作為（對……的）回報、交換"]]},{"n":29,"p":23,"en":"Nuñez was confronted with a dilemma: he had to choose either to lose his eyes or to end their relationship.","v":[["confront","vt.","面臨；面對"],["dilemma","n.","[C] 進退兩難的困境"]]},{"n":30,"p":23,"en":"Eventually, he agreed to give up his eyes for Medina's sake.","v":[["for sb.'s sake","","為了某人；看在某人份上（同 for the sake of sb.）"]]},{"n":31,"p":24,"en":"Nevertheless, it wasn't until the day of his surgery that he realized he was making a huge mistake.","v":[["nevertheless","adv.","儘管如此；然而（同 nonetheless、however）"]]},{"n":32,"p":25,"en":"That morning, he once again beheld the splendor of the sunrise.","v":[["behold","vt.","注視；看著（behold — beheld — beheld）"]]},{"n":33,"p":26,"en":"Gazing at the beautiful surrounding landscape and envisioning all that he might still see in the future, Nuñez saw that he had to escape.","v":[["gaze","vi.","凝視；注視（gaze at ...；強調帶有情感地看）"],["envision","vt.","想像；嚮往"]]},{"n":34,"p":27,"en":"Driven by the desire to save his sight, he fled the country of the blind.","v":[["flee","vt.","逃離；逃跑（flee — fled — fled）"]]}]},"L7":{"title":"Bodies Speak Louder Than Words","pages":15,"url":"l7-school.html","sents":[{"n":1,"p":1,"en":"The theory that spoken words account for only about seven percent of communication involving emotions may surprise many people.","v":[["theory","n.","學說；理論"],["account for","","（數量上）占⋯"]]},{"n":2,"p":1,"en":"This was first proposed by Dr. Albert Mehrabian, a famous psychology professor.","v":[["psychology","n.","心理學"],["Mehrabian","n.","艾伯特．麥拉賓（美國心理學教授，提出 7-38-55 法則）"]]},{"n":3,"p":2,"en":"According to his studies, we achieve about 55% of our emotional communication with our bodies, for they typically demonstrate our true feelings and what we’re actually thinking.","v":[["demonstrate","vt.","表達；展示；證明"],["typically","adv.","一般而言（同 generally）"]]},{"n":4,"p":3,"en":"Therefore, understanding people’s body language is an important ability to help us better interpret others’ messages.","v":[["interpret","vt.","理解；詮釋"]]},{"n":5,"p":3,"en":"Being able to read body language well is helpful in determining whether or not someone is telling the truth.","v":[]},{"n":6,"p":4,"en":"When people are lying, there are usually three telltale signs: making stiff body movements, touching or scratching themselves, and making eye movements.","v":[["telltale","adj.","無法掩飾的"],["stiff","adj.","僵硬的"],["scratch","vt.","搔抓"]]},{"n":7,"p":4,"en":"Typically, liars exhibit fewer arm and hand gestures.","v":[["exhibit","vt.","表現；表露"],["gesture","n.","手勢；姿勢"]]},{"n":8,"p":5,"en":"When they do make such gestures, their movements are usually stiff, and their hands tend to stay close to the body rather than move in an outward direction.","v":[["outward","adj.","朝外的"]]},{"n":9,"p":6,"en":"Moreover, liars often can’t help but touch or scratch their faces, their necks, or behind their ears.","v":[["moreover","adv.","此外（同 furthermore）"]]},{"n":10,"p":6,"en":"They sometimes rub their eyes without being conscious of it as well.","v":[["conscious","adj.","意識到的；察覺到的"]]},{"n":11,"p":7,"en":"Whether people are telling falsehoods or not can also be detected by observing how their eyes move as they speak.","v":[["falsehood","n.","謊言"],["observe","vt.","觀察"]]},{"n":12,"p":7,"en":"When right-handed people say true things, their eyes move to their left.","v":[]},{"n":13,"p":8,"en":"In contrast, when they are lying or being “creative” with the truth, their eyes tend to drift toward their right.","v":[]},{"n":14,"p":8,"en":"The reverse is true for left-handed people.","v":[["reverse","n.","相反的情況或事物"]]},{"n":15,"p":9,"en":"Another significant type of telling body language is connected to love.","v":[["significant","adj.","重要的；顯著的"],["telling","adj.","顯露內心活動的"]]},{"n":16,"p":9,"en":"In the case of romantic feelings, people’s bodies subconsciously provide an indication for someone to whom they are attracted.","v":[["subconsciously","adv.","下意識地；潛意識地"],["in the case of","","關於；在⋯的情況下"]]},{"n":17,"p":10,"en":"Under the circumstances, their eyes do most of the “talking.”","v":[["circumstance","n.","條件；狀況"],["under the circumstances","","在這種情況下"]]},{"n":18,"p":10,"en":"Initially, they may glance at a person from a distance and for just slightly longer than normal.","v":[["initially","adv.","起初"],["glance","vi.","匆匆一瞥"]]},{"n":19,"p":11,"en":"Afterward, they may look away and finally rest their eyes on him or her again for an even longer period.","v":[]},{"n":20,"p":11,"en":"Furthermore, they automatically track or repeat his or her actions without even knowing it.","v":[["automatically","adv.","自動地；無意識地；不假思索地"],["track","vt.","追蹤"]]},{"n":21,"p":12,"en":"If he or she sits back, they will follow suit.","v":[["follow suit","","照著做"]]},{"n":22,"p":12,"en":"If that person takes a sip of water, they will probably do the same.","v":[]},{"n":23,"p":13,"en":"Aside from copying behavior, they often can’t help pointing their feet and shoulders toward the one they adore or standing closer to the object of their affection than to others.","v":[["aside from","","除了⋯之外"],["adore","vt.","愛慕；熱愛"],["affection","n.","喜愛"]]},{"n":24,"p":14,"en":"All of the previously mentioned points reveal the idea that one of the best methods for interpreting people’s thoughts and emotions is to pay attention to their body language.","v":[]},{"n":25,"p":15,"en":"By understanding the signals that people send out with their body language, we may interact in a more meaningful way with our fellow human beings.","v":[["interact","vi.","互動；交流"],["meaningful","adj.","有意義的；重要的"],["fellow","adj.","同伴的；同事的"]]},{"n":26,"p":15,"en":"Best of all, we can do it without even saying a single word!","v":[["best of all","","最棒的是"]]}]},"L8":{"title":"Elephant Abuse: The Thai Tourism Industry’s Dark Secret","pages":13,"url":"l8-school.html","sents":[{"n":0,"p":1,"en":"Elephant Abuse: The Thai Tourism Industry’s Dark Secret","v":[["abuse","n.","[U] 虐待"]]},{"n":1,"p":1,"en":"Every year, Thailand sees millions of tourists, many of whom have a lot of fun riding elephants.","v":[]},{"n":2,"p":2,"en":"In fact, this activity is often the highlight of a visitor’s vacation, and these rides bring a lot of money into the Thai economy.","v":[["highlight","n.","最精彩的部分"],["economy","n.","經濟"]]},{"n":3,"p":2,"en":"However, there is a dark side to elephant tourism that would horrify many travelers.","v":[]},{"n":4,"p":3,"en":"Due to high demand in Thailand’s tourism industry, some young wild elephants are illegally captured and sold to tourist attractions.","v":[["demand","n.","需求；要求"],["illegally","adv.","非法地"]]},{"n":5,"p":3,"en":"These young elephants are lured away from their mothers and into traps.","v":[["lure","vt.","引誘"]]},{"n":6,"p":4,"en":"Wild elephants live in herds led by females, and it is natural for mothers to protect their babies.","v":[["herd","n.","獸群"]]},{"n":7,"p":4,"en":"Any females from the herd that try to defend their calves may be shot by brutal trappers.","v":[["calf","n.","（象、鯨等的）幼獸；小牛（複數 calves）"],["brutal","adj.","殘暴的"],["trapper","n.","捕殺動物者"]]},{"n":8,"p":5,"en":"Once the captured elephants are sold to tour operators, the real horror begins as they are often violently abused.","v":[["operator","n.","經營者"]]},{"n":9,"p":5,"en":"Confined in small cages, these poor creatures are beaten mercilessly for days and even struck with sharp nails.","v":[["mercilessly","adv.","冷酷無情地；殘忍地"],["strike","vt.","打；擊（三態 strike - struck - struck）"]]},{"n":10,"p":6,"en":"Such psychological torture and physical abuse, both of which cause extreme suffering, are committed in order to make them obedient to their human trainers.","v":[["abuse","n.","[U] 虐待"],["commit","vt.","做出（錯事）；犯（罪）"],["obedient","adj.","服從的；順從的"]]},{"n":11,"p":6,"en":"After the elephants are tamed, they are forced into a life of slavery.","v":[["tame","vt.","馴服"]]},{"n":12,"p":7,"en":"Many of them are made to carry people on their backs at tourist attractions and elephant camps.","v":[]},{"n":13,"p":8,"en":"Since an elephant’s spine is vulnerable to pressure from above, carrying heavy tourists for hours every day can lead to painful, permanent back injuries.","v":[["spine","n.","脊柱；脊椎"],["vulnerable","adj.","脆弱的；容易受傷害的"],["permanent","adj.","永久的"],["lead to","","導致；造成"]]},{"n":14,"p":9,"en":"What’s more, they are denied an adequate amount of food and water, which further contributes to their exhaustion.","v":[["adequate","adj.","充足的；足夠的"],["exhaustion","n.","筋疲力盡"],["what’s more","","此外"]]},{"n":15,"p":10,"en":"Worse still, these elephants are beaten as they work; their flesh is struck with bullhooks.","v":[["worse still","","更糟的是"],["flesh","n.","（人或動物的）肉；果肉"],["bullhook","n.","（趕象、馴象用的）象鉤"]]},{"n":16,"p":10,"en":"On average, more than 13 million tourists ride elephants in Thailand every year.","v":[]},{"n":17,"p":11,"en":"This puts money in the pockets of those who capture and take advantage of them, which allows the cruel elephant trade to continue.","v":[["take advantage of","","占⋯的便宜；利用⋯"]]},{"n":18,"p":12,"en":"Supply never comes without demand, so it is high time that we dealt with the roots of this problem.","v":[["deal with","","解決；處理（同 handle, cope with）"]]},{"n":19,"p":12,"en":"When you visit Thailand, avoid companies profiting from elephant tourism.","v":[]},{"n":20,"p":13,"en":"As an alternative, visit one of Thailand’s three national parks where wild elephants roam free.","v":[["roam","vi.","閒逛（於）；漫步（於）"]]},{"n":21,"p":13,"en":"There, you can take pleasure in seeing these complex, intelligent animals as they happily go about their lives in peace.","v":[["complex","adj.","複雜的"],["intelligent","adj.","聰明的；有才智的"],["take pleasure in","","以⋯為樂；喜歡做⋯"],["go about","","做⋯；忙碌於⋯"]]}]},"L9":{"title":"Mazu Mania: A Great Pilgrimage That Unifies the People","pages":16,"url":"l9-school.html","sents":[{"n":0,"p":1,"en":"Mazu Mania: A Great Pilgrimage That Unifies the People","v":[["Mazu","n.","媽祖"],["mania","n.","[C] 瘋狂；狂熱"],["pilgrimage","n.","[C] 朝聖之旅"],["unify","vt.","使⋯成為一體；凝聚"]]},{"n":1,"p":1,"en":"Every year, more than five million people participate in the Mazu pilgrimage.","v":[]},{"n":2,"p":2,"en":"It is no exaggeration to say that this event might just be the world’s largest and wildest birthday party.","v":[["exaggeration","n.","[U, C] 誇張；誇大"]]},{"n":3,"p":3,"en":"The festivities do not end until the participants have celebrated for nine days and journeyed over 300 kilometers in central Taiwan.","v":[["festivity","n.","[C] 慶典"]]},{"n":4,"p":3,"en":"Undoubtedly, the Mazu pilgrimage is a can’t-miss event for visitors to Taiwan.","v":[["undoubtedly","adv.","無疑地"]]},{"n":5,"p":4,"en":"The pilgrimage, which honors the sea goddess Mazu, sets out from Dajia’s Zhenlan Temple around her birthday, the twenty-third day of the third month on Taiwan’s lunar calendar.","v":[["Zhenlan Temple","n.","鎮瀾宮"],["lunar calendar","n.","[C] 陰曆；農曆"],["set out","","出發；開始工作（同 set off）"]]},{"n":6,"p":5,"en":"The exact date and time, which vary from year to year, are determined earlier.","v":[["exact","adj.","精確的"]]},{"n":7,"p":5,"en":"During the Lantern Festival, temple authorities cast two half-moon-shaped wooden blocks to decide the actual schedule.","v":[["authorities","n. pl.","當局；掌權者"],["cast","vt.","擲；拋（三態 cast - cast - cast）"]]},{"n":8,"p":6,"en":"At the chosen time, some 200,000 pilgrims set out from Zhenlan Temple on foot and visit more than 100 temples over the course of nine days.","v":[]},{"n":9,"p":6,"en":"They are accompanied every step of the way by a statue of Mazu, which is carried in a sedan chair.","v":[["sedan chair","n.","[C] 轎座"]]},{"n":10,"p":7,"en":"Although the pilgrims’ strength may wane during the long journey, never do their passion and dedication fade.","v":[["wane","vi.","衰退；下降"]]},{"n":11,"p":8,"en":"Apart from being a chance for people to show their devotion to the goddess, this annual festival is a spectacular and heart-warming event.","v":[["devotion","n.","[U] 虔誠"],["apart from","","除了⋯外（同 besides）"]]},{"n":12,"p":8,"en":"The gathering in front of Zhenlan Temple before the pilgrimage begins is a scene like no other.","v":[]},{"n":13,"p":9,"en":"Throngs of people fill the streets, while the explosive sounds of drums, horns, fireworks, and firecrackers pierce the air.","v":[["throng","n.","[C] 聚集的人群；一大群人"],["explosive","adj.","震耳欲聾的"],["horn","n.","[C] （樂器）號角"],["firework","n.","[C] 煙火"],["firecracker","n.","[C] 爆竹"],["pierce","vt.","vi.（光線、聲音等）穿過"]]},{"n":14,"p":10,"en":"When the statue of Mazu finally emerges from the temple in her sedan chair, the crowd surrounds her, excited to send her off on her long journey.","v":[["emerge","vi.","出現"],["send … off","","送行；罰某人下場"]]},{"n":15,"p":11,"en":"Along the route, millions of people also join in the celebration and come out to receive her blessing.","v":[["blessing","n. sing.","神的祝福"]]},{"n":16,"p":12,"en":"Some even kneel or lie face down on the pavement to allow the sedan chair to pass over them, which symbolizes their hope for good luck.","v":[["kneel","vi.","跪（三態 kneel - knelt - knelt）"],["pavement","n.","[U] （鋪過的）路面"]]},{"n":17,"p":13,"en":"In the meantime, locals show their hospitality by enthusiastically offering free food, washing facilities, and accommodations to passing pilgrims.","v":[["in the meantime","","同時；期間（同 meanwhile）"],["hospitality","n.","[U] 好客"],["enthusiastically","adv.","熱情地"],["facilities","n. pl.","設施；設備"],["accommodations","n. pl.","住宿"]]},{"n":18,"p":13,"en":"Rarely can such generosity be seen during a religious event.","v":[["religious","adj.","宗教的"]]},{"n":19,"p":14,"en":"It reflects not only the locals’ dedication to Mazu but also the warmth and humanity that are characteristic of the Taiwanese people.","v":[["humanity","n.","[U] 人道；仁慈"]]},{"n":20,"p":15,"en":"Over the years, the Mazu pilgrimage has transformed into more than just a religious ritual, and every year it attracts all manner of people—young and old, foreign and Taiwanese.","v":[["ritual","n.","[C] 宗教儀式"],["all manner of","","各式各樣的（同 all kinds of）"]]},{"n":21,"p":16,"en":"Thus, the Mazu pilgrimage has been designated as one of Taiwan’s important national folk customs.","v":[["designate","vt.","指定；認定"]]},{"n":22,"p":16,"en":"For those who are looking to experience Taiwan’s cultural heritage, participating in the Mazu pilgrimage is essential!","v":[["heritage","n. usually sing.","（一國家或社會所形成的）遺產"],["be looking to","","想要；打算（同 plan to）"]]}]}},"scopes":[{"id":"b3-2","name":"第三冊 L4–L6","lessons":["L4","L5","L6"]},{"id":"b3-3","name":"第三冊 L7–L9","lessons":["L7","L8","L9"]}],"order":["L4","L5","L6","L7","L8","L9"]};

  document.getElementById('how').textContent='這一頁收齊'+(one?SC[0].name:'各考試範圍')+'的課文彩色筆記。'+(one?'':'先選考試範圍，再')+'輸入單字，就會標出它出現在哪一課、哪一句；點「L4 句 7」這類連結，就能直接開啟那一句的筆記頁。';
  c.style.display=one?'none':'';
  document.getElementById('scopeNote').textContent=one?('目前範圍：'+SC[0].name+'。點下面的課次，就能開啟那一課的彩色筆記。'):'點下面的課次，就能開啟那一課的彩色筆記。';
  c.innerHTML=SC.map(function(s,i){return '<button type="button" data-i="'+i+'" aria-pressed="'+(i===cur)+'">'+esc(s.name)+'</button>'}).join('');
  Array.prototype.forEach.call(c.querySelectorAll('button'),function(b){b.onclick=function(){cur=+b.getAttribute('data-i');renderAll()}});
  document.getElementById('lessonList').innerHTML=lessonsNow().map(function(l){return '<a href="'+L[l].url+'"><span><b>'+l+'</b>'+esc(L[l].title)+'</span><span class="n">'+L[l].pages+' 頁</span></a>'}).join('');
}
function hi(text,q){
  if(!q)return esc(text);
  var i=text.toLowerCase().indexOf(q);
  if(i<0)return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function renderWords(){
  var qraw=document.getElementById('q').value.trim();var q=qraw.toLowerCase().replace(/[\u2018\u2019]/g,"'");
  var now=lessonsNow(),out=[],n=0,shown={};
  keys.forEach(function(k){
    var e=idx[k];
    var refs=e.refs.filter(function(r){return now.indexOf(r.l)>=0});
    if(!refs.length)return;
    if(q&&k.indexOf(q)<0&&e.zh.indexOf(q)<0)return;
    n++;shown[k]=refs;
    out.push('<div class="w"><div class="h"><span class="en">'+hi(e.w,q)+'</span>'+'<span class="pos">'+esc(e.pos)+'</span>'+spk(e.w,e.pos)+'</div><div class="zh">'+hi(e.zh,q)+'</div><div class="refs">'+
      refs.map(function(r){return '<a href="'+L[r.l].url+'#p'+r.p+'" title="開啟 '+r.l+' 筆記第 '+r.p+' 頁">'+r.l+(r.n?' 句 '+r.n:' 標題')+'</a>'}).join('')+'</div></div>');
  });
  var extra='';
  var m=0;
  if(q&&q.length>=2&&/^[a-z' -]+$/.test(q)){
    var hits=[];
    now.forEach(function(l){L[l].sents.forEach(function(s){
      var t=s.en.toLowerCase().replace(/[\u2018\u2019]/g,"'");var i=t.indexOf(q);
      if(i>=0&&(i===0||!/[a-z]/.test(t.charAt(i-1))))if(!Object.keys(shown).some(function(k){return shown[k].some(function(r){return r.l===l&&r.n===s.n})}))hits.push({l:l,s:s});
    });});
    m=hits.length;if(hits.length)extra='<div class="w"><div class="h"><b>課文裡有 '+hits.length+' 句出現「'+esc(qraw)+'」</b></div><div class="refs">'+hits.map(function(h){return '<a href="'+L[h.l].url+'#p'+h.s.p+'">'+h.l+(h.s.n?' 句 '+h.s.n:' 標題')+'</a>'}).join('')+'</div></div>';
  }
  document.getElementById('words').innerHTML=(out.join('')+extra)||'<div class="none">找不到符合的單字。這一頁只收'+esc(SC[cur].name)+'的生字與課文，可以改輸入原形，或改用中文查。</div>';
  document.getElementById('count').textContent=q?('符合 '+n+' 個單字與片語'+(m?'、'+m+' 句課文':'')):('共 '+n+' 個單字與片語');
}
function renderTexts(){
  document.getElementById('texts').innerHTML=lessonsNow().map(function(l){
    return '<details id="'+l.toLowerCase()+'"><summary>'+l+'　'+esc(L[l].title)+'<span style="flex-basis:100%;padding-left:20px;font-weight:400;font-size:13.5px;color:var(--muted)">共 '+L[l].sents.filter(function(s){return s.n>0}).length+' 句</span></summary>'+
      L[l].sents.map(function(s){return '<div class="s" id="'+l.toLowerCase()+'-s'+s.n+'"><span class="no">'+(s.n?'句 '+s.n:'標題')+'</span><span class="t">'+esc(s.en)+'</span><a class="ln" href="'+L[l].url+'#p'+s.p+'">看筆記第 '+s.p+' 頁</a></div>'}).join('')+'</details>';
  }).join('');
  openHash();
}
function openHash(){
  var h=location.hash.slice(1);if(!h)return;
  var el=document.getElementById(h);if(!el)return;
  var d=el.tagName==='DETAILS'?el:el.closest('details');if(d)d.open=true;
  el.scrollIntoView();
}
function renderAll(){renderScope();renderWords();renderTexts()}
document.getElementById('q').addEventListener('input',renderWords);
window.addEventListener('hashchange',openHash);
renderAll();
})();
</script>
</body>
</html>
