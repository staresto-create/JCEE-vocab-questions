<script src="../../speaker.js"></script>
<script>
(function(){
  var rows=document.querySelectorAll('.spkrow');
  rows.forEach(function(r){
    var data=JSON.parse(r.getAttribute('data-w'));
    data.forEach(function(it){
      var label=it[0],say=it[1],only=it[2];
      var chip=document.createElement('span');chip.className='chip';
      var h=window.SPK&&SPK.het(label);
      if(h){
        var tmp=document.createElement('span');tmp.innerHTML=SPK.html(label,true);
        if(only){tmp.querySelectorAll('.spkv').forEach(function(b){if(only.indexOf(b.getAttribute('data-w'))<0)b.parentNode.removeChild(b);});}
        var set=tmp.firstChild; if(!set)return;
        chip.appendChild(set);
      }else{
        var b=window.SPK&&SPK.el(say||label);
        if(!b)return;
        b.setAttribute('aria-label','聽 '+label+' 的發音');
        var w=document.createElement('span');w.className='w';w.textContent=label;
        chip.appendChild(w);chip.appendChild(b);
      }
      r.appendChild(chip);
    });
    if(!r.querySelector('.chip')) r.parentNode.removeChild(r);
  });
})();
</script>
