<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字首字尾表｜高中英文參考詞彙表</title>
<meta name="description" content="把大考中心《高中英文參考詞彙表》裡帶字首、字尾的字按字首、字尾分組，每個字附 KK 音標、拆解與意思，考過的字直接連到歷屆試題，每一組另附看起來像、其實不是的假朋友。">
<meta property="og:title" content="字首字尾表｜高中英文參考詞彙表">
<meta property="og:description" content="三十六組字首、五組字尾，一千五百六十一個字，其中九百三十二個字連得到學測、指考、克漏字、中譯英與作文的歷屆考題。">
<style>
:root{
  --ground:#f1f3f2; --ink:#17282f; --teal:#1f6f6a; --teal-soft:#dfeceb;
  --muted:#77878d; --line:#cdd6d6; --exam:#b4661c; --exam-soft:#fdf4e7;
  --serif: "Times New Roman",Times,"Liberation Serif","Noto Serif","PingFang TC","Noto Sans TC","Microsoft JhengHei",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
     line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:46rem;margin:0 auto;padding:1.6rem 1.1rem 4rem}
h1{font-family:var(--serif);font-weight:600;font-size:1.7rem;line-height:1.25;margin:0 0 .4rem}
.lede{color:#3d5059;font-size:.95rem;margin:0 0 1.2rem;max-width:38em}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:0 0 .5rem}
input[type=search]{flex:1 1 12rem;font:inherit;font-size:.92rem;padding:.42rem .6rem;
  border:1px solid var(--line);border-radius:.3rem;background:#fff;color:var(--ink)}
input[type=search]:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.lv{display:flex;gap:.3rem;flex-wrap:wrap}
.lv button{font:inherit;font-size:.82rem;padding:.28rem .55rem;background:#fff;color:var(--ink);
  border:1px solid var(--line);border-radius:.3rem;cursor:pointer}
.lv button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.lv button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.count{font-size:.85rem;color:var(--muted);margin:0 0 1.4rem}
nav{margin:0 0 1.6rem;display:flex;flex-wrap:wrap;gap:.3rem}
nav a{font-family:var(--serif);font-size:.9rem;text-decoration:none;color:var(--teal);
  border:1px solid var(--line);background:#fff;border-radius:.3rem;padding:.26rem .5rem}
nav a:hover{background:var(--teal-soft)}
nav .navlab{font-size:.8rem;color:var(--muted);align-self:center;margin-right:.15rem}
nav .navbr{flex-basis:100%;height:0}
section{margin:0 0 2.4rem;scroll-margin-top:1rem}
h2{font-family:var(--serif);font-size:1.24rem;margin:0 0 .1rem;font-weight:600}
h2 span{font-family:var(--sans);font-size:.92rem;color:#3d5059;margin-left:.5rem;font-weight:400}
h3{font-size:.95rem;margin:1.1rem 0 .3rem;color:var(--teal);font-weight:600}
.kk{font-size:.85rem;color:var(--muted);margin-left:.45rem}
.note{font-size:.9rem;color:#3d5059;margin:.35rem 0 1rem;max-width:40em;
  border-left:3px solid var(--teal-soft);padding-left:.7rem}
ul{list-style:none;margin:0;padding:0}
li{padding:.55rem 0;border-top:1px solid var(--line)}
li:last-child{border-bottom:1px solid var(--line)}
.w{font-family:var(--serif);font-size:1.06rem;font-weight:600}
.badge{font-size:.72rem;color:var(--muted);border:1px solid var(--line);background:#fff;
  border-radius:.9rem;padding:.02rem .4rem;margin-left:.45rem;vertical-align:.08em}
.p{font-size:.9rem;color:var(--teal);margin-top:.1rem}
.g{font-size:.92rem;margin-top:.06rem}
details{margin-top:.9rem;font-size:.9rem}
summary{cursor:pointer;color:var(--exam);font-weight:600}
summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
details .why{font-weight:600;margin-top:.6rem}
details .list{color:#3d5059}
.refs{margin-top:.34rem;font-size:.82rem;line-height:1.5}
.refs .lb{color:var(--muted);margin-right:.3rem}
.refs a{display:inline-block;color:var(--exam);background:var(--exam-soft);
  border:1px solid #f0dcc0;border-radius:.25rem;padding:.02rem .35rem;
  margin:.1rem .28rem .1rem 0;text-decoration:none}
.refs a:hover{background:#f9e8d2}
.refs a:focus-visible{outline:2px solid var(--exam);outline-offset:1px}
.refs a .k{color:var(--muted);font-size:.92em}
.foot{border-top:3px double var(--ink);margin-top:2.4rem;padding-top:1rem;
  font-size:.86rem;color:#3d5059;max-width:40em}
.empty{padding:1.2rem 0;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){li{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>字首字尾表</h1>
  <p class="lede">把大考中心《高中英文參考詞彙表》（111 學年度起適用）裡帶字首、字尾的字，按字首、字尾分組，同一個字首或字尾再依意思分成幾小組。一、二級的熟字也收進來，先從認得的字看懂字首的意思，再拿去拆不認得的字；只想看難字，可以用級別篩選。每一組後面附假朋友，那些是看起來像、其實不是這個字首的字，或照字面拆會猜錯意思的字。字根另見<a href="../roots/">字根家族表</a>。目前收三十六組常用字首、五組字尾，其他字尾陸續補上。同一個字有字首也有字尾的，兩邊都收，像 unify 在 uni- 和 -fy 兩組都查得到。</p>

  <div class="tools">
    <input type="search" id="q" placeholder="搜尋單字、拆解或意思" aria-label="搜尋">
    <div class="lv" id="lv" role="group" aria-label="依級別篩選"></div>
  </div>
  <p class="count" id="count"></p>

  <nav id="nav" aria-label="字首與字尾"></nav>
  <div id="body"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const $=s=>document.querySelector(s);
let DATA=null, state={q:'', lv:new Set(), examOnly:false};

function render(){
  const nav=$('#nav'), body=$('#body');
  nav.innerHTML=''; body.innerHTML='';
  const q=state.q.trim().toLowerCase();
  let ffShown=0; const allW=new Set(), shownW=new Set(); let lastKind=null;
  const ffHit=x=>q && !state.lv.size && !state.examOnly && (x.why+' '+x.list).toLowerCase().includes(q);

  const keep=it=>{
      if(state.lv.size && !state.lv.has(it.lv)) return false;
      if(state.examOnly && !(it.refs && it.refs.length)) return false;
      if(!q) return true;
      const refTxt=(it.refs||[]).map(r=>r.t).join(' ');
      return (it.w+' '+it.p+' '+it.g+' '+refTxt).toLowerCase().includes(q);
  };
  DATA.groups.forEach((g,gi)=>{
    const subs=g.subs.map(sb=>({t:sb.t,items:sb.items.filter(keep)}));
    g.subs.forEach(sb=>sb.items.forEach(it=>allW.add(it.w)));
    const cnt=subs.reduce((a,sb)=>a+sb.items.length,0);
    const ffs=q?(g.dropped||[]).filter(ffHit):(g.dropped||[]);
    if(!cnt && !(q && ffs.length)) return;
    subs.forEach(sb=>sb.items.forEach(it=>shownW.add(it.w))); if(q) ffShown+=ffs.length;
    const kind=g.kind==='suffix'?'suffix':'prefix';
    if(kind!==lastKind){
      if(lastKind){const br=document.createElement('span');br.className='navbr';nav.appendChild(br);}
      const lb=document.createElement('span');lb.className='navlab';lb.textContent=kind==='suffix'?'字尾':'字首';nav.appendChild(lb);
      lastKind=kind;
    }

    const a=document.createElement('a');
    a.href='#g'+gi; a.textContent=g.key.split('（')[0]; a.title=g.key+'　'+(g.zh||''); nav.appendChild(a);

    const sec=document.createElement('section');
    sec.id='g'+gi;
    const h=document.createElement('h2');
    h.textContent=g.key;
    if(g.zh){const sp=document.createElement('span');sp.textContent=g.zh;h.appendChild(sp);}
    sec.appendChild(h);
    if(g.note){const n=document.createElement('p');n.className='note';n.textContent=g.note;sec.appendChild(n);}

    subs.forEach(sb=>{
    if(!sb.items.length) return;
    const h3=document.createElement('h3'); h3.textContent=sb.t; sec.appendChild(h3);
    const ul=document.createElement('ul');
    sb.items.forEach(it=>{
      const li=document.createElement('li');
      const w=document.createElement('div');
      const nm=document.createElement('span'); nm.className='w'; nm.textContent=it.w; w.appendChild(nm);
      if(it.kk){const k=document.createElement('span');k.className='kk';k.textContent='['+it.kk+']';w.appendChild(k);}
      if(it.lv){const b=document.createElement('span');b.className='badge';b.textContent=it.base?('衍生自 '+it.base+'（第 '+it.lv+' 級）'):('第 '+it.lv+' 級');w.appendChild(b);}
      li.appendChild(w);
      const p=document.createElement('div'); p.className='p'; p.textContent=it.p; li.appendChild(p);
      const gg=document.createElement('div'); gg.className='g'; gg.textContent=it.g; li.appendChild(gg);
      if(it.refs && it.refs.length && DATA.sites){
        const rf=document.createElement('div'); rf.className='refs';
        const lb=document.createElement('span'); lb.className='lb'; lb.textContent='考過'; rf.appendChild(lb);
        it.refs.forEach(r=>{
          const site=DATA.sites[r.s]; if(!site) return;
          const a=document.createElement('a');
          a.href=site.base+encodeURIComponent(r.id)+(site.suf||'');
          a.append(r.t);
          if(r.k){const k=document.createElement('span');k.className='k';
            k.textContent=r.k==='a'?'（答案）':'（誘答）';a.appendChild(k);}
          a.title=site.n+'　'+r.t;
          rf.appendChild(a);
        });
        li.appendChild(rf);
      }
      ul.appendChild(li);
    });
    sec.appendChild(ul);
    });

    if(ffs.length){
      const d=document.createElement('details');
      if(q) d.open=true;
      const s=document.createElement('summary');
      s.textContent='假朋友：看起來像、其實不是，或照字面拆會猜錯的字';
      d.appendChild(s);
      ffs.forEach(x=>{
        const t=document.createElement('p'); t.className='why'; t.textContent=x.why; d.appendChild(t);
        const l=document.createElement('p'); l.className='list'; l.textContent=x.list; d.appendChild(l);
      });
      sec.appendChild(d);
    }
    body.appendChild(sec);
  });

  if(!shownW.size && !ffShown){
    const e=document.createElement('p'); e.className='empty';
    e.textContent='這個條件下沒有字。清掉搜尋或級別再試一次。';
    body.appendChild(e);
  }
  const linkedW=new Set(); DATA.groups.forEach(g=>g.subs.forEach(sb=>sb.items.forEach(it=>{if(it.refs&&it.refs.length)linkedW.add(it.w);}))); const linked=linkedW.size, total=allW.size, shown=shownW.size;
  const nPre=DATA.groups.filter(g=>g.kind!=='suffix').length, nSuf=DATA.groups.length-nPre;
  $('#count').textContent = (state.q||state.lv.size||state.examOnly)
    ? '符合的字 '+shown+' 個'+(ffShown?'，另有 '+ffShown+' 則假朋友說明提到這個字':'')+'，全表共 '+total.toLocaleString('en-US')+' 個'
    : '共 '+nPre+' 組字首'+(nSuf?'、'+nSuf+' 組字尾':'')+'、'+total.toLocaleString('en-US')+' 個字，其中 '+linked.toLocaleString('en-US')+' 個字附了考古題連結';
}

function buildLv(){
  const box=$('#lv');
  const e=document.createElement('button');
  e.type='button'; e.textContent='只看考過的字';
  e.setAttribute('aria-pressed','false');
  e.onclick=()=>{ state.examOnly=!state.examOnly;
    e.setAttribute('aria-pressed', state.examOnly?'true':'false'); render(); };
  box.appendChild(e);
  for(let i=1;i<=6;i++){
    const b=document.createElement('button');
    b.type='button'; b.textContent='第 '+i+' 級';
    b.setAttribute('aria-pressed','false');
    b.onclick=()=>{
      if(state.lv.has(i)){state.lv.delete(i);b.setAttribute('aria-pressed','false');}
      else{state.lv.add(i);b.setAttribute('aria-pressed','true');}
      render();
    };
    box.appendChild(b);
  }
}

fetch('affixes_data.json').then(r=>r.json()).then(d=>{
  DATA=d;
  buildLv();
  $('#q').addEventListener('input',e=>{state.q=e.target.value;render();});
  $('#foot').textContent=d.note+' 資料更新：'+d.updated+'。標「考過」的字可以點進本題庫看那一題的原文；拆解與中文說明是本題庫整理的，字源依 Online Etymology Dictionary 查證；詞彙表著作權屬財團法人大學入學考試中心基金會，本表只供非營利教學使用。';
  render();
}).catch(()=>{
  $('#body').innerHTML='<p class="empty">讀不到 affixes_data.json。這個頁面要跟資料檔放在同一個資料夾。</p>';
});
</script>
</body>
</html>
